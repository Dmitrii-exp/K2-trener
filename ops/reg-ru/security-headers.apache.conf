# Merge into the existing document-root .htaccess; do not replace existing rules.
# Apache 2.4 with mod_headers. On nginx-only hosting use the nginx snippet.
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    Header always set Permissions-Policy "camera=(), geolocation=(), microphone=(self)"
</IfModule>
