# Include inside the HTTPS server{} or the final location{} serving the app.
# nginx add_header inheritance changes when a child location has add_header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(self)" always;
