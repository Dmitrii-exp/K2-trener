<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SaleTrening — AI-тренажёр продаж</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#6d4aff;--p2:#8a6bff;--bg:#f7f7fb;--card:#fff;--text:#171827;--muted:#777b91;--line:#e8e8f0;--good:#16a56a;--danger:#e05252}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}button{cursor:pointer}
.hidden{display:none!important}.app{min-height:100vh}.auth{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#faf9ff,#f4f1ff)}
.auth-card{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:34px;box-shadow:0 20px 60px #33206014}
.logo{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px}.logo-b{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--p),#9a7cff);color:#fff;display:grid;place-items:center}
h1{font-size:34px;margin:26px 0 8px}.sub{color:var(--muted);line-height:1.5}.field{margin:14px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px 13px;outline:none;background:#fff}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--p)}
.primary{border:0;border-radius:12px;padding:12px 18px;background:var(--p);color:#fff;font-weight:700}.secondary{border:1px solid var(--line);border-radius:12px;padding:11px 16px;background:#fff}.danger{color:#c33;border-color:#f0caca}.auth-actions{display:flex;gap:10px;margin-top:18px}.auth-note{font-size:12px;color:var(--muted);margin-top:14px}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:#171625;color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}.side .logo{padding:4px 10px 24px}.side .logo-b{background:var(--p)}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#bcb9ca;text-align:left;padding:12px 14px;border-radius:11px}.nav button.active,.nav button:hover{background:#28243b;color:#fff}.side-bottom{position:absolute;bottom:18px;left:14px;right:14px}.user-mini{font-size:12px;color:#aaa6b7;margin:10px}.content{padding:28px 34px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.top h2{margin:0;font-size:28px}.pill{background:#eeeaff;color:var(--p);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}.metric{font-size:30px;font-weight:800;margin-top:8px}.muted{color:var(--muted);font-size:13px}.section{margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section h3{margin:0}.scenario-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.scenario{display:flex;flex-direction:column;gap:12px}.scenario .grow{flex:1}.tag{display:inline-block;background:#f0edff;color:#5b40db;border-radius:999px;padding:5px 8px;font-size:11px;margin-right:5px}
.chat{height:520px;display:grid;grid-template-rows:1fr auto;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.messages{padding:20px;overflow:auto;background:#fafaff}.msg{max-width:78%;padding:12px 14px;border-radius:15px;margin:8px 0;line-height:1.45}.msg.client{background:#fff;border:1px solid var(--line)}.msg.manager{background:#eeeaff;margin-left:auto}.composer{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)}.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:12px}.voice{width:46px;border:1px solid var(--line);border-radius:12px;background:#fff}
.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.bar{height:8px;border-radius:99px;background:#eee}.bar>i{display:block;height:100%;background:var(--p);border-radius:99px}.empty{padding:40px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}
.toast{position:fixed;right:20px;bottom:20px;background:#191827;color:#fff;padding:12px 16px;border-radius:12px;z-index:20}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative}.side-bottom{position:static;margin-top:20px}.grid{grid-template-columns:repeat(2,1fr)}.scenario-grid{grid-template-columns:1fr}.content{padding:20px}}
</style>
</head>
<body>
<div id="root"></div><div id="toast" class="toast hidden"></div>
<script>
const SUPABASE_URL="https://svxykakyrloqzloerygb.supabase.co";
const SUPABASE_KEY="sb_publishable_r7wu9xAgaiIZBTg4tBiJvQ_CVKHaUoi";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let state={user:null,profile:null,company:null,view:"home",scenarios:[],session:null,messages:[],stats:null,team:[]};

const $=id=>document.getElementById(id);
function toast(t){$("toast").textContent=t;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2800)}
function esc(s=""){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function roleName(r){return ({employee:"Менеджер",manager:"Менеджер",director:"Руководитель",admin:"Администратор"})[r]||r}
function authScreen(){ $("root").innerHTML=`<div class="auth"><div class="auth-card">
<div class="logo"><div class="logo-b">S</div>SaleTrening</div>
<h1>AI-тренер по продажам</h1><div class="sub">Реальные пользователи, организации, тренировки, транскрипты и аналитика. AI подключается через защищённую Edge Function.</div>
<div class="field"><label>Имя</label><input id="first" placeholder="Дмитрий"></div>
<div class="field"><label>Компания <span class="muted">(для новой организации)</span></label><input id="company" placeholder="Моя компания"></div>
<div class="field"><label>Email</label><input id="email" type="email" placeholder="you@company.ru"></div>
<div class="field"><label>Пароль</label><input id="pass" type="password" placeholder="Минимум 6 символов"></div>
<div class="auth-actions"><button class="primary" onclick="signUp()">Создать аккаунт</button><button class="secondary" onclick="signIn()">Войти</button></div>
<div class="auth-note">При регистрации с названием компании создаётся новая организация, а первый пользователь становится руководителем.</div>
</div></div>`}
async function signUp(){
 const email=$("email").value.trim(),password=$("pass").value,first=$("first").value.trim(),company=$("company").value.trim();
 if(!email||!password){toast("Заполни email и пароль");return}
 const {data,error}=await sb.auth.signUp({email,password,options:{data:{first_name:first,company_name:company}}});
 if(error){toast(error.message);return}
 if(data.session){await boot(data.session.user)} else toast("Проверь почту для подтверждения аккаунта");
}
async function signIn(){const {data,error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});if(error){toast(error.message);return}await boot(data.user)}
async function boot(user){
 state.user=user;
 let {data:p,error}=await sb.from("profiles").select("*").eq("id",user.id).single();
 if(error){toast("Профиль ещё создаётся. Обнови страницу через секунду.");return}
 state.profile=p;
 if(p.company_id){let c=await sb.from("companies").select("*").eq("id",p.company_id).single();state.company=c.data}
 await loadAll(); render();
}
async function loadAll(){
 let q=await sb.from("saletrening_scenarios").select("*").eq("active",true).order("id");state.scenarios=q.data||[];
 let s=await sb.from("my_training_stats").select("*").eq("employee_id",state.user.id).maybeSingle();state.stats=s.data||{completed_sessions:0,avg_score:0,best_score:0,active_sessions:0};
 if(["director","admin"].includes(state.profile.role)&&state.profile.company_id){let t=await sb.from("manager_team_stats").select("*").eq("company_id",state.profile.company_id).order("avg_score",{ascending:false});state.team=t.data||[]}
}
function render(){if(!state.user){authScreen();return} $("root").innerHTML=`<div class="shell"><aside class="side"><div class="logo"><div class="logo-b">S</div>SaleTrening</div><div class="nav">
${nav("home","Главная")} ${nav("training","Тренировки")} ${nav("scenarios","Сценарии")} ${nav("progress","Мой прогресс")} ${nav("ai","AI-наставник")}
${(["director","admin"].includes(state.profile.role))?nav("team","Команда")+nav("analytics","Аналитика"):''}
</div><div class="side-bottom"><div class="user-mini">${esc(state.profile.first_name||state.user.email)}<br>${roleName(state.profile.role)}${state.company?" · "+esc(state.company.name):""}</div><button class="secondary" style="width:100%" onclick="logout()">Выйти</button></div></aside><main class="content"><div id="page"></div></main></div>`;page()}
function nav(v,t){return `<button class="${state.view===v?"active":""}" onclick="state.view='${v}';page()">${t}</button>`}
function page(){let p=$("page");if(state.view==="home")p.innerHTML=home();else if(state.view==="training")p.innerHTML=trainingList();else if(state.view==="scenarios")p.innerHTML=scenarios();else if(state.view==="progress")p.innerHTML=progress();else if(state.view==="team")p.innerHTML=team();else if(state.view==="analytics")p.innerHTML=analytics();else p.innerHTML=aiCoach()}
function home(){return `<div class="top"><div><h2>Добро пожаловать, ${esc(state.profile.first_name||"коллега")}</h2><div class="muted">Сегодняшний прогресс и быстрый старт</div></div><span class="pill">${roleName(state.profile.role)}</span></div><div class="grid"><div class="card"><div class="muted">Тренировок</div><div class="metric">${state.stats.completed_sessions||0}</div></div><div class="card"><div class="muted">Средний балл</div><div class="metric">${state.stats.avg_score||0}</div></div><div class="card"><div class="muted">Лучший результат</div><div class="metric">${state.stats.best_score||0}</div></div><div class="card"><div class="muted">Активных</div><div class="metric">${state.stats.active_sessions||0}</div></div></div><div class="section"><div class="section-head"><h3>Быстрый старт</h3><button class="primary" onclick="state.view='training';page()">Все тренировки</button></div>${scenarioCards(state.scenarios.slice(0,3))}</div>`}
function scenarioCards(arr){if(!arr.length)return `<div class="empty">Сценариев пока нет.</div>`;return `<div class="scenario-grid">${arr.map(s=>`<div class="card scenario"><div><span class="tag">${esc(s.difficulty||"Средняя")}</span><span class="tag">${esc(s.client_mood||"Нейтральный")}</span></div><div class="grow"><h3>${esc(s.title)}</h3><div class="muted">${esc(s.description||s.objective||"Практика продаж")}</div></div><button class="primary" onclick="startTraining(${s.id})">Начать</button></div>`).join("")}</div>`}
function trainingList(){return `<div class="top"><div><h2>Тренировки</h2><div class="muted">Выбери ситуацию и начни живой диалог</div></div></div>${scenarioCards(state.scenarios)}`}
function scenarios(){return `<div class="top"><div><h2>Сценарии</h2><div class="muted">Библиотека ситуаций для команды</div></div></div>${scenarioCards(state.scenarios)}`}
function progress(){let s=state.stats||{};return `<div class="top"><div><h2>Мой прогресс</h2><div class="muted">Результаты реальных тренировок из Supabase</div></div></div><div class="grid"><div class="card"><div class="muted">Средний балл</div><div class="metric">${s.avg_score||0}</div></div><div class="card"><div class="muted">Лучший</div><div class="metric">${s.best_score||0}</div></div><div class="card"><div class="muted">Завершено</div><div class="metric">${s.completed_sessions||0}</div></div><div class="card"><div class="muted">Активные</div><div class="metric">${s.active_sessions||0}</div></div></div><div class="section card"><h3>Следующий шаг</h3><p class="muted">Запусти тренировку, завершив диалог, и запроси AI-анализ. После подключения ключа AI оценка сохранится в session_scores.</p><button class="primary" onclick="state.view='training';page()">Начать тренировку</button></div>`}
function team(){if(!state.team.length)return `<div class="top"><div><h2>Команда</h2><div class="muted">В организации пока нет данных о тренировках</div></div></div><div class="empty">Добавь сотрудников через систему приглашений на следующем этапе.</div>`;return `<div class="top"><div><h2>Команда</h2><div class="muted">${state.team.length} участников</div></div></div><div class="card"><table class="table"><thead><tr><th>Сотрудник</th><th>Тренировки</th><th>Средний</th><th>Выявление</th><th>Возражения</th><th>Закрытие</th></tr></thead><tbody>${state.team.map(x=>`<tr><td>${esc(x.employee_name)}</td><td>${x.sessions_count}</td><td><b>${x.avg_score}</b></td><td>${x.discovery_score}</td><td>${x.objection_score}</td><td>${x.closing_score}</td></tr>`).join("")}</tbody></table></div>`}
function analytics(){if(!state.team.length)return `<div class="top"><div><h2>Аналитика</h2><div class="muted">Данные появятся после тренировок команды</div></div></div><div class="empty">Пока нет завершённых тренировок.</div>`;let avg=Math.round(state.team.reduce((a,x)=>a+(x.avg_score||0),0)/state.team.length);return `<div class="top"><div><h2>Аналитика руководителя</h2><div class="muted">Командная эффективность</div></div><span class="pill">Средний балл ${avg}</span></div><div class="grid"><div class="card"><div class="muted">Средний команды</div><div class="metric">${avg}</div></div><div class="card"><div class="muted">Лучший менеджер</div><div class="metric" style="font-size:20px">${esc(state.team[0].employee_name)}</div></div><div class="card"><div class="muted">Тренировок</div><div class="metric">${state.team.reduce((a,x)=>a+x.sessions_count,0)}</div></div><div class="card"><div class="muted">Слабое место</div><div class="metric" style="font-size:20px">${weakest()}</div></div></div><div class="section card"><h3>Навыки команды</h3>${skillBar("Выявление потребности",avgSkill("discovery_score"))}${skillBar("Работа с возражениями",avgSkill("objection_score"))}${skillBar("Ценность",avgSkill("value_score"))}${skillBar("Закрытие",avgSkill("closing_score"))}</div>`}
function avgSkill(k){return Math.round(state.team.reduce((a,x)=>a+(x[k]||0),0)/state.team.length)}
function weakest(){let a=[["Выявление",avgSkill("discovery_score")],["Возражения",avgSkill("objection_score")],["Ценность",avgSkill("value_score")],["Закрытие",avgSkill("closing_score")]];return a.sort((x,y)=>x[1]-y[1])[0][0]}
function skillBar(t,n){return `<div style="margin:16px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${t}</span><b>${n}</b></div><div class="bar"><i style="width:${n}%"></i></div></div>`}
function aiCoach(){return `<div class="top"><div><h2>AI-наставник</h2><div class="muted">Здесь будет персональный разбор и план развития</div></div></div><div class="card"><h3>Что анализирует SaleTrening</h3><ul class="muted"><li>выявление потребностей</li><li>работу с возражениями</li><li>ценность и аргументацию</li><li>закрытие и следующий шаг</li><li>коммуникацию и структуру диалога</li></ul><p class="muted">AI Edge Function уже создана в Supabase. Для живого анализа осталось добавить ключ AI-провайдера.</p></div>`}
async function startTraining(id){
 const s=state.scenarios.find(x=>x.id===id); if(!s)return;
 const {data,error}=await sb.from("saletrening_sessions").insert({employee_id:state.user.id,company_id:state.profile.company_id,scenario_id:id,status:"started",transcript:[],voice_mode:false}).select().single();
 if(error){toast(error.message);return}
 state.session={...data,scenario:s};state.messages=[{speaker:"client",content:"Здравствуйте. Я пока просто сравниваю варианты и не уверен, что мне это вообще нужно."}];await saveSession();trainingChat();state.view="training"}
function trainingChat(){const p=$("page");p.innerHTML=`<div class="top"><div><h2>${esc(state.session.scenario.title)}</h2><div class="muted">${esc(state.session.scenario.client_role||"Клиент")} · ${esc(state.session.scenario.difficulty||"Средняя")}</div></div><button class="secondary" onclick="finishTraining()">Завершить и оценить</button></div><div class="chat"><div id="messages" class="messages">${state.messages.map(m=>`<div class="msg ${m.speaker}"><b>${m.speaker==="client"?"Клиент":"Вы"}:</b> ${esc(m.content)}</div>`).join("")}</div><div class="composer"><button class="voice" onclick="voiceInput()" title="Голосовой ввод">🎙</button><textarea id="msg" rows="2" placeholder="Ответьте клиенту..."></textarea><button class="primary" onclick="sendMessage()">Отправить</button></div></div>`}
async function saveSession(){if(!state.session)return;await sb.from("saletrening_sessions").update({transcript:state.messages,updated_at:new Date().toISOString()}).eq("id",state.session.id).eq("employee_id",state.user.id)}
async function sendMessage(){
 const t=$("msg").value.trim();if(!t)return;state.messages.push({speaker:"manager",content:t});$("msg").value="";await saveSession();trainingChat();
 setTimeout(async()=>{let replies=["Понимаю. А чем ваше предложение отличается от других вариантов?","А если цена окажется выше, почему мне выбрать вас?","Мне нужно подумать. Что вы предлагаете сделать дальше?","Какие условия вы можете предложить прямо сейчас?"];let r=replies[Math.floor(Math.random()*replies.length)];state.messages.push({speaker:"client",content:r});await saveSession();trainingChat()},500)
}
async function finishTraining(){
 if(!state.session)return;await saveSession();
 const {data,error}=await sb.functions.invoke("evaluate-session",{body:{session_id:state.session.id}});
 if(error){toast("AI-анализ: "+error.message);return}
 if(data?.configured){toast("AI-анализ завершён");}else toast("Тренировка сохранена. AI-ключ пока не подключён.");
 state.session=null;await loadAll();state.view="progress";render()
}
function voiceInput(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast("Голосовой ввод не поддерживается этим браузером");return}const r=new SR();r.lang="ru-RU";r.interimResults=false;r.onresult=e=>{$("msg").value=e.results[0][0].transcript};r.onerror=()=>toast("Не удалось распознать речь");r.start()}
async function logout(){await sb.auth.signOut();state={user:null,profile:null,company:null,view:"home",scenarios:[],session:null,messages:[],stats:null,team:[]};authScreen()}
sb.auth.onAuthStateChange(async(event,session)=>{if(event==="SIGNED_IN"&&session&&!state.user){setTimeout(()=>boot(session.user),0)}});
(async()=>{const {data}=await sb.auth.getSession();if(data.session)await boot(data.session.user);else authScreen()})();
</script>
</body></html>
