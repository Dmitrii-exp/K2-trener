name: Fix local Supabase loader
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-index:
    if: ${{ !contains(github.event.head_commit.message, 'Use local Supabase client') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace external Supabase loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='<script src="https://unpkg.com/@supabase/supabase-js@2.109.0/dist/umd/supabase.js" onerror="this.onerror=null;this.src=\'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.109.0/dist/umd/supabase.js\'">'
          new='<script src="/supabase-client.js">'
          if old not in s:
              print('loader pattern not found; no changes needed')
          else:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use local Supabase client"
          git push
