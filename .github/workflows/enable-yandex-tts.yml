name: Connect Yandex SpeechKit TTS
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair training runtime wrappers
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'(</style>\s*<script>\s*)+</style>\s*<script>\s*',r'\1',s,flags=re.I)
          s=re.sub(r'(</script>\s*<style>\s*)+</script>\s*<style>\s*',r'\1',s,flags=re.I)
          marker='async function startTraining'
          styles=list(re.finditer(r'<style[^>]*>(.*?)</style>',s,flags=re.S|re.I))
          containing=next((m for m in styles if marker in m.group(1)),None)
          if containing:
              block=containing.group(1)
              css_marker='/* COLD_CALL_MODE_V1 */'
              if css_marker not in block: raise SystemExit('training runtime/CSS boundary not found')
              split=block.index(css_marker)
              js=block[:split].strip();css=block[split:].strip()
              open_end=s.index('>',containing.start())+1
              close_start=containing.end()-len('</style>')
              s=s[:containing.start()]+s[containing.start():open_end]+'\n'+css+'\n</style>\n<script>\n'+js+'\n</script>'+s[close_start+len('</style>'):]
          s=re.sub(r'(</style>\s*<script>\s*)+</style>\s*<script>\s*',r'\1',s,flags=re.I)
          s=re.sub(r'(</script>\s*<style>\s*)+</script>\s*<style>\s*',r'\1',s,flags=re.I)
          p.write_text(s,encoding='utf-8')
      - name: Patch only speech output
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          if '/* YANDEX_TTS_V1 */' in s:
              print('Yandex TTS already connected')
              raise SystemExit(0)
          old_call=re.compile(r'function speakCallClient\(text\)\{.*?\n\}', re.S)
          new_call='''/* YANDEX_TTS_V1 */
async function speakYandexTTS(text,onEnd){
  if(!text)return;
  try{
    const {data,error}=await sb.auth.getSession();
    const token=data?.session?.access_token;
    if(error||!token)throw new Error("Сессия авторизации истекла");
    const r=await fetch(SUPABASE_URL+"/functions/v1/yandex-tts",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+token},body:JSON.stringify({text,voice:"marina",role:"friendly",speed:.96}),cache:"no-store"});
    const j=await r.json();
    if(!r.ok||!j?.audio_base64)throw new Error(j?.error||"SpeechKit не вернул аудио");
    const bin=atob(j.audio_base64);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const audio=new Audio(URL.createObjectURL(new Blob([bytes],{type:j.mime||"audio/wav"})));
    audio.onended=()=>{URL.revokeObjectURL(audio.src);if(onEnd)onEnd()};
    audio.onerror=()=>{URL.revokeObjectURL(audio.src);if(onEnd)onEnd()};
    await audio.play();
    return audio;
  }catch(e){
    console.warn("Yandex TTS fallback:",e);
    if("speechSynthesis" in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ru-RU";u.rate=.96;u.pitch=1;u.onend=()=>{if(onEnd)onEnd()};window.speechSynthesis.speak(u)}else if(onEnd)onEnd();
  }
}
function speakCallClient(text){if(!text)return;speakYandexTTS(text,()=>{if(state.session&&!coldCall.processing)setTimeout(startVoiceListening,250)})}'''
          s2,n=old_call.subn(new_call,s,count=1)
          if n!=1: raise SystemExit('speakCallClient pattern not found')
          s=s2
          old_client=re.compile(r'function speakClient\(text\)\{.*?\n\}', re.S)
          new_client='''function speakClient(text){if(!text)return;speakYandexTTS(text)}'''
          s2,n=old_client.subn(new_client,s,count=1)
          if n!=1: raise SystemExit('speakClient pattern not found')
          s=s2
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then echo 'No changes needed'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: normalize executable training runtime'
          git push
