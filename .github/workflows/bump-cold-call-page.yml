name: Bump cold call page asset
on:
  push:
    branches: [main]
    paths:
      - 'cold-call-voice-v5.js'
      - 'site-repair.js'
      - '.github/workflows/bump-cold-call-page.yml'
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Normalize cold call runtime tags
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'/cold-call-voice-v5\.js\?v=[^"\']+','/cold-call-voice-v5.js?v=20260906-page-3',s)
          s=re.sub(r'\s*<script src="/cold-call-page-mode\.js\?v=[^"]+"></script>','',s)
          s=re.sub(r'\s*<script src="/cold-call-page-v4\.js\?v=[^"]+"></script>','',s)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: finalize normal cold call page loader'
          git push
