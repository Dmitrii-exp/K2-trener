name: apply history spec
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only history/report layer
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='else if(state.view==="history")setPageHTML(p,historyPage());'
          new='else if(state.view==="history")setPageHTML(p,window.historyPage());'
          if old not in s:
              raise SystemExit('history page call not found')
          s=s.replace(old,new,1)
          marker='<!-- SALE_TRAINING_HISTORY_SPEC_V2 -->'
          if marker not in s:
              block=r'''<!-- SALE_TRAINING_HISTORY_SPEC_V2 -->
<script>
(()=>{
  const score20=v=>{const n=Number(v);if(!Number.isFinite(n))return 1;return Math.max(1,Math.min(20,Math.round(n>20?n/5:n)));};
  const listText=v=>Array.isArray(v)?v.filter(Boolean).slice(0,2).map(esc).join(' · '):(v?esc(v):'');
  window.showTrainingReport=async function(id){
    const q=await sb.from('saletrening_sessions').select('id,employee_id,company_id,scenario_id,status,total_score,ai_summary,transcript,created_at,completed_at').eq('id',id).single();
    if(q.error||!q.data){toast(q.error?.message||'Не удалось загрузить отчёт');return;}
    const sc=await sb.from('session_scores').select('*').eq('session_id',id).maybeSingle();
    state.report={session:q.data,score:sc.data||{}};state.view='history';page();
  };
  window.reportPage=function(){
    const r=state.report||{},x=r.session||{},s=r.score||{};
    const objection=score20(s.objection_score),presentation=score20(s.value_score),closing=score20(s.closing_score),communication=score20(s.communication_score),discovery=score20(s.discovery_score),total=objection+presentation+closing+communication+discovery;
    const arr=k=>Array.isArray(s[k])?s[k]:[];
    const list=k=>arr(k).length?'<ul>'+arr(k).map(z=>'<li>'+esc(z)+'</li>').join('')+'</ul>':'<div class="muted">Нет данных.</div>';
    const tr=Array.isArray(x.transcript)?x.transcript:[];
    const dialogue=tr.length?tr.map(m=>`<div class="msg ${m.speaker==='manager'?'manager':'client'}"><b>${m.speaker==='manager'?'Менеджер':'Клиент'}:</b> ${esc(m.content||'')}</div>`).join(''):'<div class="empty">Диалог не сохранён.</div>';
    return `<div class="top"><div><h2>Отчёт по тренировке</h2><div class="muted">${esc(new Date(x.created_at).toLocaleString('ru-RU'))} · ${esc(state.scenarios.find(z=>String(z.id)===String(x.scenario_id))?.title||'Тренировка')}</div></div><button class="secondary" onclick="state.report=null;state.view='history';page()">← История</button></div>
    <div class="card" style="text-align:center;padding:28px"><div class="muted">Общий балл</div><div class="metric" style="font-size:54px">${total}<span style="font-size:18px;color:var(--muted)"> / 100</span></div></div>
    <div class="section card"><h3>Оценка навыков</h3>${[['Работа с возражениями',objection],['Презентация продукта',presentation],['Дожим / закрытие сделки',closing],['Вовлечённость клиента в разговор',communication],['Выявление потребности',discovery]].map(z=>`<div style="margin:18px 0"><div style="display:flex;justify-content:space-between;gap:12px"><span>${z[0]}</span><b>${z[1]} / 20</b></div><div class="bar" style="margin-top:8px"><i style="width:${z[1]*5}%"></i></div></div>`).join('')}</div>
    <div class="section card"><h3>Анализ тренировки</h3><div style="margin-top:16px"><b>🟢 Что менеджер сделал хорошо</b>${list('strengths')}</div><div style="margin-top:20px"><b>🔴 Что менеджер сделал плохо</b>${list('weaknesses')}</div><div style="margin-top:20px"><b>💡 Что улучшить</b>${list('recommendations')}</div>${x.ai_summary?`<div style="margin-top:20px"><b>Краткий вывод AI</b><p class="muted">${esc(x.ai_summary)}</p></div>`:''}</div>
    <div class="section card"><h3>Полный диалог менеджера и клиента</h3><div class="messages" style="margin-top:14px;max-height:none;background:#fafaff;border-radius:14px">${dialogue}</div></div>`;
  };
  window.historyPage=async function(){
    let q;
    if(['manager','director','admin'].includes(state.profile?.role)&&state.profile?.company_id) q=await sb.from('saletrening_sessions').select('id,employee_id,scenario_id,status,total_score,ai_summary,created_at,completed_at').eq('company_id',state.profile.company_id).order('created_at',{ascending:false}).limit(100);
    else q=await sb.from('saletrening_sessions').select('id,employee_id,scenario_id,status,total_score,ai_summary,created_at,completed_at').eq('employee_id',state.user.id).order('created_at',{ascending:false}).limit(100);
    const rows=q.data||[],names={};state.scenarios.forEach(z=>names[z.id]=z.title);state.history=rows;
    let scoreMap={};
    if(rows.length){const ids=rows.map(x=>x.id);const sq=await sb.from('session_scores').select('session_id,strengths,weaknesses,recommendations').in('session_id',ids);(sq.data||[]).forEach(z=>scoreMap[z.session_id]=z);}
    return `<div class="top"><div><h2>История тренировок</h2><div class="muted">Нажмите на тренировку, чтобы открыть полный отчёт</div></div></div><div class="card" style="padding:0;overflow:hidden">${rows.length?`<table class="table"><thead><tr><th>Дата</th><th>Менеджер</th><th>Сценарий</th><th>Статус</th><th>Балл</th><th>Отчёт</th></tr></thead><tbody>${rows.map(x=>{const sc=scoreMap[x.id]||{};const good=listText(sc.strengths)||'—';const bad=listText(sc.weaknesses)||'—';return `<tr onclick="showTrainingReport('${x.id}')" style="cursor:pointer"><td>${new Date(x.created_at).toLocaleString('ru-RU')}</td><td>${x.employee_id===state.user.id?esc(state.profile.first_name||state.user.email):'Менеджер'}</td><td>${esc(names[x.scenario_id]||'Тренировка')}</td><td>${x.status==='completed'?'Завершена':'В процессе'}</td><td><b>${x.total_score??'—'}</b></td><td><div><b>Хорошо:</b> ${good}</div><div style="margin-top:4px"><b>Плохо:</b> ${bad}</div></td></tr>`;}).join('')}</tbody></table>`:'<div class="empty">История пока пуста.</div>'}</div>`;
  };
})();
</script>
'''
              s=s.replace('</body>',block+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: implement exact history report specification [skip ci]"
          git push
