name: Fix TTS playback
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: "!startsWith(github.event.head_commit.message, 'fix: route cold call client voice directly through Yandex TTS')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only cold-call TTS playback
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=re.search(r'function speakCallClient\(text\)\{.*?\n\}',s,re.S)
          if not old:
              raise SystemExit('speakCallClient not found')
          new='''async function speakCallClient(text){\n  if(!text)return;\n  try{\n    const {data,error}=await sb.functions.invoke('yandex-tts',{body:{text,voice:'marina',role:'friendly',speed:0.96,pitch_shift:0}});\n    if(error)throw error;\n    if(!data?.audio_base64)throw new Error(data?.error||'Yandex TTS returned no audio');\n    const bin=atob(data.audio_base64),bytes=new Uint8Array(bin.length);\n    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);\n    const audio=new Audio(URL.createObjectURL(new Blob([bytes],{type:data?.mime||'audio/wav'})));\n    audio.onended=()=>{URL.revokeObjectURL(audio.src);if(state.session&&!coldCall.processing)setTimeout(startVoiceListening,250)};\n    audio.onerror=()=>{URL.revokeObjectURL(audio.src);throw new Error('Yandex audio playback failed')};\n    await audio.play();\n  }catch(e){\n    console.error('Yandex SpeechKit TTS playback:',e);\n    if('speechSynthesis' in window){\n      window.speechSynthesis.cancel();\n      const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=.96;u.pitch=1;\n      u.onend=()=>{if(state.session&&!coldCall.processing)setTimeout(startVoiceListening,250)};\n      window.speechSynthesis.speak(u);\n    }\n  }\n}'''
          s=s[:old.start()]+new+s[old.end():]
          p.write_text(s,encoding='utf-8')
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-tts-playback.yml
          git commit -m 'fix: route cold call client voice directly through Yandex TTS'
          git push