name: Repair index script syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove unmatched IIFE closer
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '\n})();\nsb.auth.onAuthStateChange'
          new = '\nsb.auth.onAuthStateChange'
          if old not in s:
              raise SystemExit('Expected unmatched IIFE closer not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
      - name: Commit repair and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-index-syntax.yml
          git rm .github/workflows/fix-index-syntax.yml
          git commit -m 'fix: remove unmatched IIFE closer'
          git push
