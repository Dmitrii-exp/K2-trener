name: Add cold call character and client facts
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only cold call male voice selector
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          changed=False
          old="voice:'marina'"
          new="voice:(window.coldCall?.voice||'marina')"
          if old in s:
              s=s.replace(old,new,1)
              changed=True
          marker='<div class="field" style="margin-top:14px"><label>Факты о клиенте <span class="muted">(необязательно)</span></label>'
          voice_field='<div class="field" style="margin-top:14px"><label>Голос клиента</label><select id="coldVoice"><option value="filipp">Филипп — мужской</option><option value="ermil">Ермил — мужской</option><option value="zahar">Захар — мужской</option><option value="alexander">Александр — мужской</option><option value="kirill">Кирилл — мужской</option><option value="anton">Антон — мужской</option></select></div>'
          if 'id="coldVoice"' not in s:
              if marker not in s: raise SystemExit('cold facts marker not found')
              s=s.replace(marker,voice_field+marker,1)
              changed=True
          old_state='let coldCall={recognition:null,listening:false,silenceTimer:null,silenceNudged:false,startedAt:0,processing:false,difficulty:"Средний",timer:null,character:"Лояльный",facts:""};'
          new_state='let coldCall={recognition:null,listening:false,silenceTimer:null,silenceNudged:false,startedAt:0,processing:false,difficulty:"Средний",timer:null,character:"Лояльный",facts:"",voice:"filipp"};'
          if old_state in s:
              s=s.replace(old_state,new_state,1)
              changed=True
          old_start='coldCall.character=$("coldCharacter")?.value||"Лояльный";coldCall.facts=$("coldFacts")?.value.trim()||"";'
          new_start='coldCall.character=$("coldCharacter")?.value||"Лояльный";coldCall.facts=$("coldFacts")?.value.trim()||"";coldCall.voice=$("coldVoice")?.value||"filipp";'
          if old_start in s and 'coldCall.voice=$("coldVoice")' not in s:
              s=s.replace(old_start,new_start,1)
              changed=True
          if not changed:
              raise SystemExit('No target changes found')
          p.write_text(s,encoding='utf-8')
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['id="coldVoice"','coldCall.voice=$("coldVoice")?.value||"filipp"','voice:(window.coldCall?.voice||\'marina\')']
          missing=[x for x in required if x not in s]
          if missing: raise SystemExit('Missing: '+', '.join(missing))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add male voice selector to cold call'
          git push