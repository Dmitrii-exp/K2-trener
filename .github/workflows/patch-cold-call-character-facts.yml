name: Add cold call character and client facts
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only cold call male voice selector
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          changed=False
          for old,new in [("voice:'marina'","voice:(document.getElementById('coldVoice')?.value||'marina')"),("voice:\"marina\"","voice:(document.getElementById('coldVoice')?.value||'marina')")]:
              if old in s:
                  s=s.replace(old,new,1); changed=True; break
          voice_field='<div class="field" style="margin-top:14px"><label>Голос клиента</label><select id="coldVoice"><option value="filipp">Филипп — мужской</option><option value="ermil">Ермил — мужской</option><option value="zahar">Захар — мужской</option><option value="alexander">Александр — мужской</option><option value="kirill">Кирилл — мужской</option><option value="anton">Антон — мужской</option></select></div>'
          if 'id="coldVoice"' not in s:
              m=re.search(r'(<select id="coldCharacter"[\s\S]*?</select>)',s,flags=re.S)
              if not m: raise SystemExit('coldCharacter selector not found')
              s=s[:m.end()]+voice_field+s[m.end():]
              changed=True
          if not changed: raise SystemExit('No target changes found')
          p.write_text(s,encoding='utf-8')
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for x in ['id="coldVoice"','Филипп — мужской','Ермил — мужской','Захар — мужской']:
              if x not in s: raise SystemExit('Missing: '+x)
          if 'document.getElementById(\'coldVoice\')?.value' not in s: raise SystemExit('Voice selection is not connected')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add male voice selector to cold call'
          git push