name: One-time voice runtime repair
on:
  push:
    paths:
      - '.github/workflows/voice-fix.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable continuous voice runtime
        run: |
          cat > cold-call-voice.js <<'VOICE'
(() => {
  'use strict';
  if (window.__stProxyVoiceV5) return;
  window.__stProxyVoiceV5 = true;
  const PROJECT='https://svxykakyrloqzloerygb.supabase.co/functions/v1';
  let stream=null, recorder=null, chunks=[], recording=false, busy=false, callOpen=false, continuous=false, audioCtx=null, audioSource=null, timer=null;
  const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function auth(){const s=await sb.auth.getSession();const t=s?.data?.session?.access_token;if(!t)throw Error('Сессия авторизации не найдена');return{Authorization:`Bearer ${t}`};}
  function stateButton(text,cls='',disabled=true){const b=document.getElementById('st-phone-talk');if(b){b.className='st-phone-main '+cls;b.textContent=text;b.disabled=disabled;}}
  function addStyles(){if(document.getElementById('st-v5-style'))return;const s=document.createElement('style');s.id='st-v5-style';s.textContent='#st-phone-overlay{position:fixed;inset:0;background:rgba(10,9,18,.78);z-index:100000;display:flex;align-items:center;justify-content:center;padding:18px}#st-phone{width:min(780px,96vw);height:min(850px,94vh);display:flex;flex-direction:column;background:#15131f;color:#fff;border:1px solid #39324f;border-radius:28px;overflow:hidden}.st-phone-head{padding:20px;text-align:center;background:#211b35;position:relative}.st-phone-close{position:absolute;right:15px;top:13px;border:0;border-radius:50%;width:38px;height:38px;background:#302a47;color:#fff;font-size:21px}.st-phone-status{font-size:10px;color:#aaa3bd}.st-phone-avatar{font-size:28px;margin:10px}.st-phone-name{font-size:20px;font-weight:800}.st-phone-role,.st-phone-timer{color:#aaa3bd;font-size:12px;margin-top:4px}.st-phone-body{flex:1;min-height:0;padding:16px;display:flex;flex-direction:column;gap:10px}.st-phone-now{background:#211d32;border:1px solid #38314e;border-radius:17px;padding:12px;min-height:70px}.st-phone-now-label{font-size:9px;color:#aaa3bd;text-transform:uppercase}.st-phone-now-text{margin-top:5px}.st-phone-transcript{flex:1;min-height:0;overflow:auto;background:#0f0e17;border-radius:17px;padding:10px}.st-phone-msg{display:flex;margin:7px 3px}.st-phone-msg.client{justify-content:flex-start}.st-phone-msg.manager{justify-content:flex-end}.st-phone-bubble{max-width:80%;padding:9px 12px;border-radius:15px;line-height:1.42}.client .st-phone-bubble{background:#27223b}.manager .st-phone-bubble{background:#7357ff}.st-phone-label{font-size:9px;opacity:.7;margin-bottom:3px}.st-phone-controls{padding:14px;border-top:1px solid #2d2840}.st-phone-main{width:100%;height:54px;border:0;border-radius:17px;background:#7357ff;color:#fff;font-weight:800;font-size:15px}.st-phone-main.live{background:#2d8a65}.st-phone-main.recording{background:#d84d5b}.st-phone-hint{text-align:center;color:#9d97b0;font-size:11px;margin-top:7px}.st-phone-end{display:block;margin:9px auto 0;border:0;background:none;color:#b8b1cb}';document.head.appendChild(s)}
  function closeOnly(){callOpen=false;continuous=false;busy=false;try{recorder?.stop()}catch{};try{stream?.getTracks().forEach(t=>t.stop())}catch{};try{audioSource?.disconnect()}catch{};try{audioCtx?.close()}catch{};recorder=null;stream=null;audioSource=null;audioCtx=null;chunks=[];if(timer)clearInterval(timer);document.getElementById('st-phone-overlay')?.remove()}
  function renderDialog(sc){addStyles();const o=document.createElement('div');o.id='st-phone-overlay';o.innerHTML=`<div id="st-phone"><div class="st-phone-head"><button class="st-phone-close">×</button><div class="st-phone-status">Голосовая тренировка · имитация звонка</div><div class="st-phone-avatar">👤</div><div class="st-phone-name">${esc(sc?.client_name||sc?.client||'Потенциальный клиент')}</div><div class="st-phone-role">${esc(sc?.title||'Холодный звонок')}</div><div class="st-phone-timer" id="st-phone-timer">00:00</div></div><div class="st-phone-body"><div class="st-phone-now"><div class="st-phone-now-label">Сейчас говорит</div><div class="st-phone-now-text" id="st-phone-now-text">Нажмите один раз и говорите. Дальше разговор идёт автоматически.</div></div><div class="st-phone-transcript" id="st-phone-transcript"></div></div><div class="st-phone-controls"><button id="st-phone-talk" class="st-phone-main">🎙 Начать разговор</button><div class="st-phone-hint">Говорите → пауза → ИИ отвечает голосом → микрофон автоматически слушает дальше.</div><button id="st-phone-end" class="st-phone-end">Завершить разговор</button></div></div>`;document.body.appendChild(o);o.querySelector('.st-phone-close').onclick=finishCall;o.querySelector('#st-phone-end').onclick=finishCall;o.querySelector('#st-phone-talk').onclick=()=>{if(!continuous)startConversation()};const started=Date.now();timer=setInterval(()=>{const e=document.getElementById('st-phone-timer');if(e){const x=Math.floor((Date.now()-started)/1000);e.textContent=`${String(Math.floor(x/60)).padStart(2,'0')}:${String(x%60).padStart(2,'0')}`}},1000)}
  function addMsg(w,t){const box=document.getElementById('st-phone-transcript'),now=document.getElementById('st-phone-now-text');if(!box)return;const r=document.createElement('div');r.className='st-phone-msg '+w;r.innerHTML=`<div class="st-phone-bubble"><div class="st-phone-label">${w==='client'?'ИИ клиент':'Менеджер'}</div>${esc(t)}</div>`;box.appendChild(r);box.scrollTop=box.scrollHeight;if(now)now.textContent=t}
  async function stt(blob){const h=await auth(),f=new FormData();f.append('file',blob,'manager.webm');f.append('prompt','Русская речь менеджера по продажам. Распознай дословно всю речь менеджера без пересказа.');const r=await fetch(`${PROJECT}/proxy-stt`,{method:'POST',headers:h,body:f}),d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw Error(d.error||`STT HTTP ${r.status}`);return String(d.text||'').trim()}
  async function tts(text){const h=await auth();h['Content-Type']='application/json';const voice=document.getElementById('coldVoice')?.value||'coral';const r=await fetch(`${PROJECT}/proxy-tts`,{method:'POST',headers:h,body:JSON.stringify({input:text,voice,instructions:'Только русский язык. Живой потенциальный клиент по телефону, естественная разговорная речь.'})});if(!r.ok)throw Error(`TTS HTTP ${r.status}`);const b=await r.blob();if(!b.size)throw Error('TTS вернул пустой звук');audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();const a=await audioCtx.decodeAudioData(await b.arrayBuffer());await new Promise((res,rej)=>{const x=audioCtx.createBufferSource();audioSource=x;x.buffer=a;x.connect(audioCtx.destination);x.onended=res;x.start();setTimeout(()=>rej(Error('TTS timeout')),Math.max(10000,a.duration*1000+5000))})}
  async function startRecording(){if(!callOpen||!continuous||busy||recording)return;try{if(!stream)stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});chunks=[];const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';recorder=new MediaRecorder(stream,{mimeType:mime});recorder.ondataavailable=e=>{if(e.data?.size)chunks.push(e.data)};recorder.onstop=()=>process(new Blob(chunks,{type:mime}));recording=true;recorder.start(250);stateButton('🔴 Слушаю вас…','recording',true);detectSpeech()}catch(e){console.error(e);continuous=false;stateButton('🎙 Начать разговор','',false);if(typeof toast==='function')toast(`Микрофон: ${e.message}`)}}
  function detectSpeech(){if(!stream)return;try{const C=window.AudioContext||window.webkitAudioContext;audioCtx=audioCtx||new C();audioCtx.resume().catch(()=>{});const s=audioCtx.createMediaStreamSource(stream),a=audioCtx.createAnalyser();a.fftSize=2048;a.smoothingTimeConstant=.75;const data=new Uint8Array(a.fftSize);let heard=false,last=Date.now(),start=Date.now();const tick=()=>{if(!recording||!recorder||recorder.state==='inactive'){try{s.disconnect()}catch{};return}a.getByteTimeDomainData(data);let q=0;for(const z of data){const v=(z-128)/128;q+=v*v}const rms=Math.sqrt(q/data.length);if(rms>.012){heard=true;last=Date.now()}if(heard&&Date.now()-start>900&&Date.now()-last>1200){try{s.disconnect()}catch{};stopRecording();return}if(Date.now()-start>20000){try{s.disconnect()}catch{};stopRecording();return}requestAnimationFrame(tick)};requestAnimationFrame(tick)}catch{setTimeout(()=>stopRecording(),20000)}}
  function stopRecording(){if(recorder&&recorder.state!=='inactive')try{recorder.stop()}catch{}}
  async function process(blob){recorder=null;recording=false;if(!blob.size){busy=false;if(continuous)startRecording();return}busy=true;stateButton('⏳ Распознаю речь…','',true);try{const said=await stt(blob);if(!said||said.length<2)throw Error('Речь не распознана');state.messages=Array.isArray(state.messages)?state.messages:[];state.messages.push({speaker:'manager',content:said});addMsg('manager',said);if(typeof saveSession==='function')await saveSession();stateButton('⏳ ИИ отвечает…','',true);const reply=await aiClientReply(said,false);if(!reply)throw Error('ИИ не вернул ответ');state.messages.push({speaker:'client',content:reply});addMsg('client',reply);if(typeof saveSession==='function')await saveSession();stateButton('🔊 Клиент отвечает…','live',true);await tts(reply)}catch(e){console.error('[SaleTrening] voice turn',e);if(typeof toast==='function')toast(`Ошибка голосового хода: ${e.message}`)}finally{busy=false;if(continuous&&callOpen){stateButton('🔴 Слушаю вас…','live',true);setTimeout(startRecording,300)}}}
  async function startConversation(){if(continuous||busy||recording)return;continuous=true;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();await audioCtx.resume();await startRecording()}catch(e){continuous=false;stateButton('🎙 Начать разговор','',false)}}
  async function launchColdCall(id){if(callOpen)return;try{const ov=window.__stColdCallScenarioOverride;const sc=ov&&String(ov.id)===String(id)?ov:state.scenarios?.find(x=>String(x.id)===String(id));if(!sc)throw Error('Сценарий не найден');if(!state.user?.id)throw Error('Пользователь не авторизован');if(!state.profile?.company_id)throw Error('Профиль компании не загружен');const r=await sb.from('saletrening_sessions').insert({employee_id:state.user.id,company_id:state.profile.company_id,scenario_id:id,status:'started',transcript:[],voice_mode:true}).select().single();if(r.error)throw Error(r.error.message);state.session={...r.data,scenario:sc};state.messages=[];state.view='training';callOpen=true;window.__stColdCallActive=true;renderDialog(sc)}catch(e){console.error(e);closeOnly();if(typeof toast==='function')toast(`Ошибка запуска голосовой тренировки: ${e.message}`)}}
  async function finishCall(){if(!state.session){closeOnly();return}if(busy)return;try{if(typeof saveSession==='function')await saveSession()}catch{}closeOnly();window.__stColdCallActive=false;delete window.__stColdCallScenarioOverride;try{if(typeof finishTraining==='function')await finishTraining()}catch(e){console.error(e)}}
  window.launchColdCall=launchColdCall;window.finishColdCall=finishCall;
})();
VOICE
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cold-call-voice.js
          git rm .github/workflows/voice-fix.yml
          git commit -m "fix: stabilize continuous voice microphone" || exit 0
          git push
