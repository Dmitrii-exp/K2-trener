name: Update cold call voices

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-voices:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace cold call voice list
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''<select id="coldVoice">
      <option value="coral">Coral — нейтральный</option>
      <option value="alloy">Alloy — нейтральный</option>
      <option value="ash">Ash — мужской</option>
      <option value="ballad">Ballad — выразительный</option>
      <option value="echo">Echo — мужской</option>
      <option value="fable">Fable — выразительный</option>
      <option value="nova">Nova — женский</option>
      <option value="onyx">Onyx — мужской</option>
      <option value="sage">Sage — спокойный</option>
      <option value="shimmer">Shimmer — женский</option>
    </select>'''
          new = '''<select id="coldVoice">
      <option value="onyx">Олег</option>
      <option value="ash">Николай</option>
      <option value="coral">Даша</option>
    </select>'''
          if old not in s:
              raise SystemExit('Expected coldVoice options block was not found; no changes made.')
          s = s.replace(old, new, 1)
          s = s.replace('coldCall.voice=$("coldVoice")?.value||"coral"', 'coldCall.voice=$("coldVoice")?.value||"onyx"', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: set cold call voices to Oleg Nikolai Dasha"
          git push