name: Apply AI client settings UI
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'AI client settings UI') && !contains(github.event.head_commit.message, 'Remove temporary AI settings workflow') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if 'AI_CLIENT_SETTINGS_V3' in s: raise SystemExit(0)
          patch=Path('scripts/ai-client-settings.js').read_text(encoding='utf-8')
          s=s.replace('</body>',patch+'</body>',1) if '</body>' in s else s+patch
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit UI patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'AI client settings UI'
          git push
      - name: Remove temporary files
        run: |
          rm -f .github/workflows/apply-ai-client-settings.yml scripts/ai-client-settings.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u .github/workflows/apply-ai-client-settings.yml scripts/ai-client-settings.js
          git diff --cached --quiet || (git commit -m 'Remove temporary AI settings workflow' && git push)