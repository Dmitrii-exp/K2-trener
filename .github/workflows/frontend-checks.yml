name: Frontend checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/check_frontend.py
      - run: node scripts/test-invitation-privacy.cjs
      - run: node scripts/test-ai-request-guard.cjs
      - run: node scripts/test-training-runtime.cjs
      - run: node scripts/test-voice-runtime.cjs
      - run: node scripts/test-finish-persistence.cjs
      - run: node scripts/test-cold-call-behavior.cjs
      - run: node scripts/test-client-outcomes.cjs
      - run: node scripts/test-buyer-evaluation.cjs
      - run: node scripts/test-mentor-history.cjs
      - run: node scripts/test-mentor-attachments.cjs
      - run: node scripts/test-negotiation-lab.cjs
      - run: node scripts/test-negotiation-handler.cjs
      - name: Isolated negotiation database contracts
        run: bash scripts/test-negotiation-db.sh
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: postgres
          PGPASSWORD: fixture-only
          PGDATABASE: postgres
      - run: python scripts/test-reg-ru-release.py
      - run: node scripts/test-employee-analytics.cjs
      - name: Install browser test runtime
        run: npm install --prefix "$RUNNER_TEMP/branch-ui" --no-package-lock --no-save playwright@1.62.1
      - name: Branch workflow browser checks
        run: node scripts/test-branches-ui.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/branch-ui/node_modules
          UI_BROWSER_CHANNEL: chrome
      - name: Negotiation practice browser checks
        run: node scripts/test-negotiation-ui.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/branch-ui/node_modules
          UI_BROWSER_CHANNEL: chrome
      - name: Keep browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-ui-evidence
          path: test-results/
          if-no-files-found: ignore
