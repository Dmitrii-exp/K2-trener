name: Fix Promise render
on:
  push:
    branches: [main]

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch promise-safe rendering
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* PROMISE_SAFE_RENDER_V1 */'
          if marker not in s:
              helper = '''\n/* PROMISE_SAFE_RENDER_V1 */\nfunction setPageHTML(el, value){\n  try {\n    if (value && typeof value.then === 'function') {\n      value.then(html => { el.innerHTML = html; }).catch(err => {\n        console.error('Page render promise:', err);\n        el.innerHTML = '<div class="empty">Не удалось загрузить страницу. Откройте консоль для диагностики.</div>';\n      });\n    } else {\n      el.innerHTML = value;\n    }\n  } catch (err) {\n    console.error('Page render:', err);\n    el.innerHTML = '<div class="empty">Ошибка отображения страницы.</div>';\n  }\n}\n'''
              s = s.replace('function page(){', helper + '\nfunction page(){', 1)
              names = ['home','trainingList','coldCallHome','scenarios','progress','historyPage','team','analytics','aiCoach']
              for name in names:
                  s = s.replace(f'p.innerHTML={name}();', f'setPageHTML(p,{name}());')
              s = s.replace("$('page').innerHTML=reportPage();", "setPageHTML($('page'),reportPage());")
              p.write_text(s, encoding='utf-8')
      - name: Commit repaired index and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-promise-render.yml
          git rm .github/workflows/fix-promise-render.yml
          git commit -m "fix: render async pages without object promise [skip ci]"
          git push
