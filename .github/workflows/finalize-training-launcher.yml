name: Finalize training launcher

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add guard to launcher
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('training-runtime-fix.js')
          s=p.read_text(encoding='utf-8')
          old="    };\n  }\n  if(document.readyState"
          new="    };\n    window.startTraining.__saleTrainingWrapped=true;\n  }\n  if(document.readyState"
          if "__saleTrainingWrapped=true" not in s and old in s:
              s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add training-runtime-fix.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: prevent training launcher wrapper conflict'
          git push
