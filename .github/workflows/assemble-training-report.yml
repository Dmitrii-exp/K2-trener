name: Assemble training report
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          if 'TRAINING_REPORT_LAYER_V1' not in s:
            layer=''.join(Path(x).read_text(encoding='utf-8') for x in ['scripts/r1','scripts/r2','scripts/r3'])
            s=s.replace('let state={user:null,profile:null,company:null,view:"home",scenarios:[],session:null,messages:[],stats:null,team:[],history:[]};','let state={user:null,profile:null,company:null,view:"home",scenarios:[],session:null,messages:[],stats:null,team:[],history:[],report:null};',1)
            p.write_text(s.replace('</body>',layer+'</body>'),encoding='utf-8')
          PY
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m 'feat: add detailed training reports' && git push)
