name: Apply Canva UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-canva-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inject Canva UI script
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="/canva-ui.js"></script>'
          if marker not in s:
              s = s.replace('</body>', marker + '\n</body>')
              p.write_text(s, encoding='utf-8')
              print('Canva UI script injected')
          else:
              print('Canva UI script already present')

      - name: Commit and push
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'SaleTrening Bot'
          git config user.email 'actions@github.com'
          git add index.html
          git commit -m 'style: activate real Canva UI shell'
          git push
