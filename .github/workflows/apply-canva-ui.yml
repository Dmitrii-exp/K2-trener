name: Apply Canva UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-canva-ui:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply UI and scoring fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Make the AI training tab deterministic and self-healing: load scenarios on demand,
          # show an error instead of a blank area, and keep the existing training flow intact.
          training_nav = r'''async function openTrainingTab(){try{state.view="training";const p=$("page");if(p)p.innerHTML=`<div class="top"><div><h2>ИИ-тренировки</h2><div class="muted">Загружаем сценарии...</div></div></div><div class="empty">Подготавливаем AI-тренировки…</div>`;if(!state.scenarios?.length&&state.user){const q=await sb.from("saletrening_scenarios").select("*").eq("active",true).order("id");if(q.error)throw q.error;state.scenarios=q.data||[]}render()}catch(e){console.error("Training tab:",e);const p=$("page");if(p)p.innerHTML=`<div class="top"><div><h2>ИИ-тренировки</h2><div class="muted">Ошибка загрузки сценариев</div></div></div><div class="empty"><b>Не удалось загрузить тренировки.</b><br><span class="muted">${esc(e.message||"Проверьте подключение к Supabase")}</span><br><button class="primary" style="margin-top:14px" onclick="openTrainingTab()">Повторить</button></div>`}}
function nav(v,t,icon){return `<button class="${state.view===v?"active":""}" onclick="${v==='training'?"openTrainingTab()":"state.view='"+v+"';page()"}"><span class="nav-icon">${icon}</span>${t}</button>`}'''
          s,n=re.subn(r'function nav\(v,t,icon\)\{.*?\}\nfunction render\(\)',lambda m:training_nav+'\nfunction render()',s,count=1,flags=re.S)
          if n!=1: raise SystemExit('nav not found')

          training_list = r'''function trainingList(){return `<div class="top"><div><h2>ИИ-тренировки</h2><div class="muted">Выбери ситуацию и начни живой диалог с AI-клиентом</div></div></div>${scenarioCards(state.scenarios||[])}`}function scenarios()'''
          s,n=re.subn(r'function trainingList\(\)\{.*?\}\n?function scenarios\(\)',lambda m:training_list,s,count=1,flags=re.S)
          if n!=1: raise SystemExit('trainingList not found')

          p.write_text(s,encoding='utf-8')
          print('Training navigation patch applied')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['function openTrainingTab()','function trainingList()','ИИ-тренировки','startTraining(']
          for x in required:
              if x not in s: raise SystemExit('Missing: '+x)
          print('Validation passed')
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'SaleTrening Bot'
          git config user.email 'actions@github.com'
          git add index.html
          git commit -m 'fix: restore AI training tab'
          git push
