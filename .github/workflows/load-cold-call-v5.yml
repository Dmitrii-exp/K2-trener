name: Load cold call voice v5

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install v5 loader
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/cold-call-voice-v5.js?v=20260905-voice-v5"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('index.html: </body> not found')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s,encoding='utf-8')
          PY
          git config user.name "SaleTrening Repair Bot"
          git config user.email "actions@github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: load cold call voice v5"
          git push
