name: Fix cold-call TTS duplication
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-coldcall-tts]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate TTS shim and normalize role
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # The injected Yandex shim is not needed for cold-call playback:
          # speakCallClient() already calls yandex-tts directly. Remove both
          # global speechSynthesis overrides to prevent recursion/double audio.
          marker='/* YANDEX_SPEECHKIT_TTS_V1 */'
          if marker in s:
              start=s.index(marker)
              # First shim ends at the first IIFE close after the marker.
              end=s.find('})();',start)
              if end < 0: raise SystemExit('First TTS shim end not found')
              end += 4
              s=s[:start]+s[end:]
              # Remove the second shim: it starts immediately after the Supabase
              # client declaration and before the application state declaration.
              anchor='const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);'
              a=s.find(anchor)
              if a>=0:
                  a_end=a+len(anchor)
                  rest=s[a_end:]
                  # Find the next IIFE that overrides speechSynthesis and stop at
                  # the first occurrence of the state declaration.
                  m=re.search(r'\n\(\(\)=>\{const nativeSpeechSynthesis=.*?\}\)\(\);\n(?=let state=)',rest,re.S)
                  if m:
                      rest=rest[:m.start()]+'\n'+rest[m.end():]
                      s=s[:a_end]+rest
          # The remote function safely normalizes unsupported roles. Use neutral
          # explicitly in the remaining direct client-TTS call.
          s=s.replace("role:'friendly'", "role:'neutral'")
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'function speakCallClient(text)' in s
          assert "sb.functions.invoke('yandex-tts'" in s
          assert 'YANDEX_SPEECHKIT_TTS_V1' not in s
          assert "role:'friendly'" not in s
          print('Cold-call TTS duplication removed')
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: remove duplicate cold-call TTS [auto-coldcall-tts]'
          git push
