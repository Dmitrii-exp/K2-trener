name: Patch AI client settings
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ai-client-settings.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch runtime
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('auth-invite.js'); s=p.read_text()
          old="if(!window.state||!window.sb)return;"
          new="if(typeof state==='undefined'||typeof sb==='undefined')return;"
          if old not in s:
              raise SystemExit('auth-invite.js target not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('supabase/functions/chat-client/index.ts'); s=p.read_text()
          marker='const product=clean(embedded?.product||embedded?.productCustom||settings?.product||settings?.productCustom||"",500);'
          library='const objectionLibrary=["Дорого","Работаем с другими / есть поставщик","Нет времени","Не хочу менять поставщика","Нет бюджета, нет денег, нет финансирования","Жили же как-то без вас","Я подумаю","Ещё не смотрел","Не интересно","Не звоните сюда больше","Всё есть","Слышал негативные отзывы","Сам знаю где купить / сам всё знаю и тп","Сейчас не сезон","Решает директор. Решает Москва. Решает центральный офис","Был негативный опыт с вами","Сейчас сезон","Ничего не нужно","Пока всё заморозили","Я сам вам перезвоню","Хорошие отношения с текущим поставщиком","Есть поставщик рядом","Был негативный опыт с аналогичным продуктом","Отправляйте всё на почту","Я вас не знаю. Мы о вас не слышали","Пока нет заказов, нет покупателей","Мы будем иметь вас в виду","У директора брат работает у нашего поставщика","Все у всех одинаково","Долго везти","Что я скажу нашему поставщику","Перед новым годом не будем менять поставщика"];'+marker
          if 'const objectionLibrary=' not in s:
              if marker not in s: raise SystemExit('chat-client product marker not found')
              s=s.replace(marker,library,1)
          old='Если выбраны возражения, естественно используй их в разговоре по одному в подходящий момент; не перечисляй их заранее и не вставляй все сразу. Если включены случайные возражения, добавляй указанное количество дополнительных возражений из библиотеки, не повторяя уже выбранные.'
          new='Если выбраны возражения, естественно используй их в разговоре по одному в подходящий момент; не перечисляй их заранее и не вставляй все сразу. Если включены случайные возражения, выбери указанное количество дополнительных возражений только из этой библиотеки: ${objectionLibrary.join(" | ")}; не повторяй уже выбранные и не используй больше указанного количества.'
          if old not in s: raise SystemExit('chat-client instruction marker not found')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name "SaleTrening Bot"
          git config user.email "actions@github.com"
          git add auth-invite.js supabase/functions/chat-client/index.ts
          git commit -m "fix: activate AI client settings and objection library"
          git push
      - name: Remove one-time workflow
        run: |
          git config user.name "SaleTrening Bot"
          git config user.email "actions@github.com"
          git rm .github/workflows/patch-ai-client-settings.yml
          git commit -m "chore: remove one-time AI settings patch"
          git push
