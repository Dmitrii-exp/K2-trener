name: Load training runtime fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add training runtime fix script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/training-runtime-fix.js?v=20260903-1"></script>'
          import re
          s=re.sub(r'\s*<script src="/training-runtime-fix\.js[^>]*></script>', '', s)
          marker='</body>'
          if marker not in s:
              raise SystemExit('index.html: </body> not found')
          s=s.replace(marker, tag+'\n'+marker, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: load training runtime diagnostics'
          git push
