name: add-password-recovery
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'Dmitrii-exp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          needle='function authScreen(){const invite='
          insert='''function passwordRecoveryScreen(){
          $("root").innerHTML=`<div class="auth"><div class="auth-card"><div class="auth-brand"><div class="logo"><div class="logo-b">S</div>SaleTrening</div><span class="auth-badge">ВОССТАНОВЛЕНИЕ</span></div><h1>Новый пароль.</h1><div class="sub">Введите новый пароль для вашего аккаунта.</div><div class="field"><label>Новый пароль</label><input id="newPass" type="password" placeholder="Минимум 6 символов" autocomplete="new-password"></div><div class="field"><label>Повторите пароль</label><input id="newPass2" type="password" placeholder="Повторите пароль" autocomplete="new-password"></div><div class="auth-actions"><button class="primary" onclick="updatePassword()">Сохранить пароль</button><button class="secondary" onclick="authScreen()">Вернуться ко входу</button></div><div class="auth-note">После сохранения вы сможете войти с новым паролем.</div></div></div>`;
          }
          async function requestPasswordReset(){
          const email=$("email")?.value.trim().toLowerCase();
          if(!email){toast("Введите email для восстановления");$("email")?.focus();return}
          const redirectTo=location.origin+location.pathname;
          const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});
          if(error){toast(error.message);return}
          toast("Письмо для восстановления отправлено");
          }
          async function updatePassword(){
          const password=$("newPass")?.value||"",password2=$("newPass2")?.value||"";
          if(password.length<6){toast("Пароль должен содержать минимум 6 символов");return}
          if(password!==password2){toast("Пароли не совпадают");return}
          const {error}=await sb.auth.updateUser({password});
          if(error){toast(error.message);return}
          toast("Пароль изменён");
          await sb.auth.signOut();
          history.replaceState({},"",location.pathname);
          authScreen();
          }
          '''
          if needle not in s: raise SystemExit('auth function not found')
          s=s.replace(needle,insert+needle,1)
          old='''<div class="auth-actions"><button class="primary" onclick="signUp()">${hasInvite?"Зарегистрироваться в команде":"Создать аккаунт"}</button><button class="secondary" onclick="signIn()">Войти</button></div><div class="auth-note">'''
          new='''<div class="auth-actions"><button class="primary" onclick="signUp()">${hasInvite?"Зарегистрироваться в команде":"Создать аккаунт"}</button><button class="secondary" onclick="signIn()">Войти</button></div>${!hasInvite?'<button type="button" class="secondary" style="width:100%;margin-top:10px" onclick="requestPasswordReset()">Забыли пароль?</button>':""}<div class="auth-note">'''
          if old not in s: raise SystemExit('auth actions not found')
          s=s.replace(old,new,1)
          oldtail="sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session){setTimeout(()=>window.boot(session.user),0)}});(async()=>{const {data}=await sb.auth.getSession();if(data.session)await window.boot(data.session.user);else window.authScreen()})();"
          newtail="sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'){setTimeout(()=>passwordRecoveryScreen(),0);return}if(event==='SIGNED_IN'&&session){if(location.hash.includes('type=recovery')){setTimeout(()=>passwordRecoveryScreen(),0);return}setTimeout(()=>window.boot(session.user),0)}});(async()=>{const recovery=location.hash.includes('type=recovery');const {data}=await sb.auth.getSession();if(recovery){passwordRecoveryScreen();return}if(data.session)await window.boot(data.session.user);else window.authScreen()})();"
          if oldtail not in s: raise SystemExit('auth listener not found')
          s=s.replace(oldtail,newtail,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add working password recovery flow' || exit 0
          git push
