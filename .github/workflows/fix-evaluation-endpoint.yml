name: Fix evaluation endpoint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[auto-eval-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch frontend endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'SUPABASE_URL+"/functions/v1/evaluate-session"'
          new = 'SUPABASE_URL+"/functions/v1/evaluate-session-v3"'
          if old not in s:
              print('Endpoint already patched or pattern not found')
              raise SystemExit(0)
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          print('Patched evaluate-session -> evaluate-session-v3')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: use v3 session evaluation [auto-eval-fix]'
          git push
