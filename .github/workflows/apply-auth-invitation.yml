name: Apply auth invitation flow
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-auth-invitation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch auth invitation flow
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()

          marker='function authScreen(){'
          assert marker in s
          insert=r'''function inviteRegistrationScreen(email){
            const safeEmail=esc(String(email||''));
            $("root").innerHTML=`<div class="auth"><div class="auth-card"><div class="auth-brand"><div class="logo"><div class="logo-b">S</div>SaleTrening</div><span class="auth-badge">ПРИГЛАШЕНИЕ</span></div><h1>Завершите регистрацию.</h1><div class="sub">Вы приглашены в команду SaleTrening. Email из приглашения закреплён и не может быть изменён.</div><div class="field"><label>Имя</label><input id="inviteFirst" placeholder="Дмитрий"></div><div class="field"><label>Email</label><input id="inviteEmailLocked" type="email" value="${safeEmail}" readonly style="background:#f5f5f8;color:#555;cursor:not-allowed"></div><div class="field"><label>Пароль</label><input id="invitePass" type="password" placeholder="Минимум 6 символов"></div><div class="auth-actions"><button class="primary" onclick="completeInviteRegistration()">Завершить регистрацию</button></div><div class="auth-note">Этот Email автоматически закреплён за приглашением руководителя.</div></div></div>`;
          }
          async function completeInviteRegistration(){
            const first=$("inviteFirst")?.value.trim()||"",password=$("invitePass")?.value||"";
            if(password.length<6){toast("Пароль должен содержать минимум 6 символов");return}
            const {data,error}=await sb.auth.updateUser({password,data:{first_name:first}});
            if(error){toast(error.message);return}
            try{await acceptPendingInvitation(data?.user?.id);await boot(data.user)}catch(e){console.error("completeInviteRegistration:",e);toast(e.message||"Не удалось принять приглашение")}
          }

          '''
          s=s.replace(marker,insert+marker,1)

          old='<div class="field"><label>Email</label><input id="email" type="email" placeholder="you@company.ru"></div>'
          new='<div class="field"><label>Email</label><input id="email" type="email" placeholder="you@company.ru" ${hasInvite&&new URLSearchParams(location.search).get("email")?`value="${esc(new URLSearchParams(location.search).get("email"))}" readonly style="background:#f5f5f8;color:#555;cursor:not-allowed"`:""}></div>'
          assert old in s
          s=s.replace(old,new,1)

          old='async function createCompanyInvitation(){\n  if(!state.user||!state.profile){toast("Профиль ещё загружается. Обновите страницу через секунду.");return}\n  if(!state.profile.company_id||!["director","admin","manager"].includes(state.profile.role)){toast("Нет прав для приглашения сотрудников");return}\n  const email=$("inviteEmail")?.value.trim().toLowerCase();\n  const role=$("inviteRole")?.value||"employee";\n  if(!email){toast("Укажи email сотрудника");return}\n  const token=crypto.randomUUID().replace(/-/g,"");\n  const {error}=await sb.from("company_invitations").insert({company_id:state.profile.company_id,email,role,token,invited_by:state.user.id,expires_at:new Date(Date.now()+7*86400000).toISOString()});\n  if(error){toast(error.message);return}\n  const link=location.origin+location.pathname+"?invite="+encodeURIComponent(token);\n  const out=$("inviteResult");if(out)out.innerHTML=`<div class="card" style="margin-top:14px;background:#faf9ff"><b>Приглашение создано</b><div class="muted" style="margin:6px 0">Срок действия: 7 дней</div><input id="inviteLink" value="${esc(link)}" readonly style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff"><div style="display:flex;gap:8px;margin-top:8px"><button class="primary" onclick="navigator.clipboard.writeText($(\\"inviteLink\\").value);toast(\\"Ссылка скопирована\\")">Копировать ссылку</button><button class="secondary" onclick="toast(\\"Код: ${esc(token)}\\")">Показать код</button></div></div>`;\n}'
          # The exact source contains normal quotes in the JS, so locate the function by boundaries instead of relying on escaped formatting.
          start=s.index('async function createCompanyInvitation(){')
          end=s.index('\nfunction team(){',start)
          replacement=r'''async function createCompanyInvitation(){
  if(!state.user||!state.profile){toast("Профиль ещё загружается. Обновите страницу через секунду.");return}
  if(!state.profile.company_id||!["director","admin","manager"].includes(state.profile.role)){toast("Нет прав для приглашения сотрудников");return}
  const email=$("inviteEmail")?.value.trim().toLowerCase();
  const role=$("inviteRole")?.value||"employee";
  if(!email){toast("Укажи email сотрудника");return}
  const {data,error}=await sb.functions.invoke("send-company-invitation",{body:{email,role,origin:location.origin}});
  if(error){toast(error.message||"Не удалось отправить приглашение");return}
  if(data?.error){toast(data.error);return}
  const out=$("inviteResult");if(out)out.innerHTML=`<div class="card" style="margin-top:14px;background:#faf9ff"><b>Приглашение отправлено</b><div class="muted" style="margin-top:6px">Письмо с приглашением автоматически отправлено на ${esc(email)}. Срок действия — 7 дней.</div></div>`;
  if($("inviteEmail"))$("inviteEmail").value="";
}
'''
          s=s[:start]+replacement+s[end:]

          old='''(async()=>{const {data}=await sb.auth.getSession();if(data.session){await window.boot(data.session.user)}else{window.authScreen()}})();'''
          new='''(async()=>{const {data}=await sb.auth.getSession();const qs=new URLSearchParams(location.search);const token=qs.get("invite")||localStorage.getItem("saletrening_invite_token")||"";const invitedEmail=(qs.get("email")||"").trim().toLowerCase();const inviteFlow=qs.get("type")==="invite"&&!!token;if(data.session&&inviteFlow){const sessionEmail=String(data.session.user?.email||"").trim().toLowerCase();if(invitedEmail&&sessionEmail&&sessionEmail!==invitedEmail){await sb.auth.signOut();window.authScreen()}else{inviteRegistrationScreen(sessionEmail||invitedEmail)}}else if(data.session){await window.boot(data.session.user)}else{window.authScreen()}})();'''
          assert old in s
          s=s.replace(old,new,1)

          p.write_text(s)
          PY
          git config user.name "SaleTrening Bot"
          git config user.email "actions@github.com"
          git add index.html
          git commit -m "feat: send employee invitation email and lock invited email"
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git config user.name "SaleTrening Bot"
          git config user.email "actions@github.com"
          git rm .github/workflows/apply-auth-invitation.yml
          git commit -m "chore: remove one-time auth invitation patch workflow"
          git push
