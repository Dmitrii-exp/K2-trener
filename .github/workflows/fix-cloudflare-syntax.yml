name: Fix SaleTrening syntax 2

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[auto-fix-2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize TTS script newlines
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('/* YANDEX_SPEECHKIT_TTS_V1 */')
          end = s.find('let state=', start)
          if start < 0 or end < 0:
              raise SystemExit('TTS block markers not found')
          block = s[start:end]
          fixed = block.replace('\\n', '\n')
          if fixed == block:
              raise SystemExit('No literal newline escapes found in TTS block')
          s = s[:start] + fixed + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-cloudflare-syntax.yml
          git commit -m 'fix: normalize TTS script newlines [auto-fix-2]'
          git push
