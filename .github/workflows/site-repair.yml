name: Repair SaleTrening bootstrap
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove old experimental training launchers and install one cache-busted V6 launcher.
          s=re.sub(r'\n?<script src="/training-tab-fix\.js[^>]*></script>', '', s)
          s=re.sub(r'\n?<script src="/training-runtime-fix\.js[^>]*></script>', '', s)
          tag='<script src="/training-runtime-fix.js?v=20260903-6"></script>'
          if tag not in s:
              marker='<script>\nasync function startTraining'
              if marker not in s: raise SystemExit('main script marker not found')
              s=s.replace(marker, tag+'\n'+marker, 1)
          diag='<script src="/site-repair.js?v=20260903-2"></script>'
          s=re.sub(r'\n?<script src="/site-repair\.js[^>]*></script>', '', s)
          s=s.replace(marker, diag+'\n'+marker, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repaired index
        shell: bash
        run: |
          git config user.name 'SaleTrening Repair Bot'
          git config user.email 'actions@github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: install real text training dialog'
          git push
