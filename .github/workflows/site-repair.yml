name: Repair SaleTrening bootstrap
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove both experimental training fallback loaders; core trainingChat is the canonical UI.
          import re
          s=re.sub(r'\n?<script src="/training-tab-fix\.js[^>]*></script>', '', s)
          # Load diagnostics before the main inline application script.
          tag='<script src="/site-repair.js?v=20260903-1"></script>'
          marker='<script>\nasync function startTraining'
          if tag not in s:
              if marker not in s: raise SystemExit('main script marker not found')
              s=s.replace(marker, tag+'\n'+marker, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit repaired index
        shell: bash
        run: |
          git config user.name 'SaleTrening Repair Bot'
          git config user.email 'actions@github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore clean app bootstrap'
          git push
