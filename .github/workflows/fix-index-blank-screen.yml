name: Fix index blank screen

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix malformed cold-call separators
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = r'\n/* COLD_CALL_MODE_V1 */\n'
          new = '\n/* COLD_CALL_MODE_V1 */\n'
          if old in s:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Move training runtime JavaScript out of CSS
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'async function startTraining'
          css_marker = '/* COLD_CALL_MODE_V1 */'
          if marker not in text:
              raise SystemExit('training runtime marker not found')
          start = text.index(marker)
          style_end = text.index('</style>', start)
          block = text[start:style_end]
          if css_marker not in block:
              raise SystemExit('cold-call CSS marker not found')
          split = block.index(css_marker)
          js = block[:split].rstrip()
          css = block[split:].strip()
          prefix = text[:start]
          suffix = text[style_end + len('</style>'):]
          fixed = prefix + '</style>\n<script>\n' + js + '\n</script>\n<style>\n' + css + '\n</style>' + suffix
          if fixed != text:
              p.write_text(fixed, encoding='utf-8')
          PY
      - name: Verify training runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t = Path('index.html').read_text(encoding='utf-8')
          styles = re.findall(r'<style[^>]*>(.*?)</style>', t, flags=re.S|re.I)
          if any('async function startTraining' in css for css in styles):
              raise SystemExit('training runtime remains inside CSS')
          if '.call-shell' not in t:
              raise SystemExit('cold-call CSS missing')
          if '<script>\nasync function startTraining' not in t:
              raise SystemExit('training script block missing')
          if t.count('<style') != t.lower().count('</style>'):
              raise SystemExit('unbalanced style tags')
          print('training runtime verified')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restore executable training runtime'
          git push
