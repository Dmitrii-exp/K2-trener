name: Fix index blank screen

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix malformed cold-call separators
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = r'\n/* COLD_CALL_MODE_V1 */\n'
          new = '\n/* COLD_CALL_MODE_V1 */\n'
          if old in s:
              s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          if git diff --quiet -- index.html; then
            echo 'No malformed separator found.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: restore index script parsing'
          git push
