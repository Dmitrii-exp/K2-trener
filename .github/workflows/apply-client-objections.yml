name: Apply client objection settings
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-client-objections.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch UI and AI client
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text()
          old='body:JSON.stringify({session_id:state.session.id,scenario_id:state.session.scenario.id,message:opening?"":userMessage,opening,transcript:state.messages,scenario:state.session.scenario})'
          new='body:JSON.stringify({session_id:state.session.id,scenario_id:state.session.scenario.id,message:opening?"":userMessage,opening,transcript:state.messages,scenario:state.session.scenario,client_features:{character:coldCall.character,facts:coldCall.facts,voice:coldCall.voice,difficulty:coldCall.difficulty,selected_objections:coldCall.selectedObjections||[],random_objection_count:coldCall.randomObjectionCount||0}})'
          assert old in s; s=s.replace(old,new,1)
          old='function coldCallHome(){return `<div class="top"><div><h2>Холодный звонок</h2><div class="muted">Голосовая тренировка в режиме телефонного разговора</div></div></div><div class="card" style="max-width:900px;margin:auto"><h3>Настройка клиента</h3><div class="field" style="margin-top:14px"><label>Характер клиента</label><select id="coldCharacter"><option value="Лояльный">Лояльный</option><option value="Скептик">Скептик</option><option value="Грубит">Грубит</option><option value="Занятой">Занятой</option><option value="Аналитик">Аналитик</select></div><div class="field" style="margin-top:14px"><label>Голос клиента</label><select id="coldVoice"><option value="filipp">Филипп — мужской</option><option value="ermil">Ермил — мужской</option><option value="zahar">Захар — мужской</option><option value="alexander">Александр — мужской</option><option value="kirill">Кирилл — мужской</option><option value="anton">Антон — мужской</option></select></div><div class="field" style="margin-top:14px"><label>Факты о клиенте <span class="muted">(необязательно)</span></label><textarea id="coldFacts" rows="4" placeholder="Например: сейчас покупает у конкурента, нужен объём 100 шин, важна гарантия..."></textarea></div><h3 style="margin-top:22px">Выберите уровень сложности</h3>'
          new='''function coldCallHome(){return `<div class="top"><div><h2>Холодный звонок</h2><div class="muted">Голосовая тренировка в режиме телефонного разговора</div></div></div><div class="card" style="max-width:900px;margin:auto"><h3>Настройка клиента</h3><div class="field" style="margin-top:14px"><label>Характер клиента</label><select id="coldCharacter"><option value="Лояльный">Лояльный</option><option value="Скептик">Скептик</option><option value="Грубит">Грубит</option><option value="Занятой">Занятой</option><option value="Аналитик">Аналитик</option></select></div><div class="field" style="margin-top:14px"><label>Голос клиента</label><select id="coldVoice"><option value="filipp">Филипп — мужской</option><option value="ermil">Ермил — мужской</option><option value="zahar">Захар — мужской</option><option value="alexander">Александр — мужской</option><option value="kirill">Кирилл — мужской</option><option value="anton">Антон — мужской</option></select></div><div class="field" style="margin-top:14px"><label>Факты о клиенте <span class="muted">(необязательно)</span></label><textarea id="coldFacts" rows="4" placeholder="Например: сейчас покупает у конкурента, нужен объём 100 шин, важна гарантия..."></textarea></div><div style="margin-top:22px"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h3 style="margin:0">Возражения клиента</h3><div class="muted" style="margin-top:5px">Стартовый набор одинаковый для всех персонажей, пока вы не сохраните свои возражения.</div></div><span id="objectionCount" class="pill">0 выбрано</span></div><label class="card" style="display:flex;align-items:center;gap:12px;margin-top:14px;padding:14px;cursor:pointer"><input id="randomObjections" type="checkbox" onchange="toggleRandomObjections()" style="width:20px;height:20px"><span style="font-size:18px">🎲</span><span><b>Случайные возражения</b><br><span class="muted">AI добавит к твоим ручным ещё N случайных из библиотеки</span></span><input id="randomObjectionCount" type="number" min="0" max="11" value="0" disabled style="width:72px;margin-left:auto"></label><div id="selectedObjections" style="display:grid;gap:10px;margin-top:14px"></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px"><button type="button" class="secondary" onclick="openObjectionLibrary()">＋ Все возражения</button><button type="button" class="secondary" onclick="addCustomObjection()">＋ Своё возражение</button></div></div><h3 style="margin-top:22px">Выберите уровень сложности</h3>'''
          assert old in s; s=s.replace(old,new,1)
          old='let coldCall={recognition:null,listening:false,silenceTimer:null,silenceNudged:false,startedAt:0,processing:false,difficulty:"Средний",timer:null,character:"Лояльный",facts:"",voice:"filipp"};'
          new='''const CLIENT_OBJECTIONS=["Дорого","Работаем с другими / есть поставщик","Нет времени","Не хочу менять поставщика","Нет бюджета, нет денег, нет финансирования","Жили же как-то без вас","Я подумаю","Ещё не смотрел","Не интересно","Не звоните сюда больше","Всё есть","Слышал негативные отзывы","Сам знаю где купить / сам всё знаю и тп","Сейчас не сезон","Решает директор. Решает Москва. Решает центральный офис","Был негативный опыт с вами","Сейчас сезон","Ничего не нужно","Пока всё заморозили","Я сам вам перезвоню","Хорошие отношения с текущим поставщиком","Есть поставщик рядом","Был негативный опыт с аналогичным продуктом","Отправляйте всё на почту","Я вас не знаю. Мы о вас не слышали","Пока нет заказов, нет покупателей","Мы будем иметь вас в виду","У директора брат работает у нашего поставщика","Все у всех одинаково","Долго везти","Что я скажу нашему поставщику","Перед новым годом не будем менять поставщика"];
let coldCall={recognition:null,listening:false,silenceTimer:null,silenceNudged:false,startedAt:0,processing:false,difficulty:"Средний",timer:null,character:"Лояльный",facts:"",voice:"filipp",selectedObjections:[],randomObjections:false,randomObjectionCount:0};
function renderObjections(){const box=$("selectedObjections");if(!box)return;const list=coldCall.selectedObjections||[];box.innerHTML=list.length?list.map((x,i)=>`<div class="card" style="display:flex;align-items:center;gap:10px;padding:12px;border-color:#19a873"><span style="font-weight:800;flex:1">${i+1}. ${esc(x)}</span><button type="button" class="secondary" onclick="removeObjection(${i})">Удалить</button></div>`).join(""):`<div class="empty" style="padding:20px">Возражения не выбраны. Клиент будет вести себя по базовому сценарию.</div>`;const c=$("objectionCount");if(c)c.textContent=`${list.length} выбрано`}
function toggleRandomObjections(){coldCall.randomObjections=$("randomObjections")?.checked||false;const n=$("randomObjectionCount");if(n){n.disabled=!coldCall.randomObjections;coldCall.randomObjectionCount=Math.max(0,Math.min(11,Number(n.value)||0))}}
function removeObjection(i){coldCall.selectedObjections.splice(i,1);renderObjections()}
function addCustomObjection(){const text=prompt("Введите своё возражение клиента");if(!text?.trim())return;const v=text.trim();if(!coldCall.selectedObjections.includes(v))coldCall.selectedObjections.push(v);renderObjections()}
function openObjectionLibrary(){const chosen=new Set(coldCall.selectedObjections);const available=CLIENT_OBJECTIONS.map((x,i)=>({x,i})).filter(o=>!chosen.has(o.x));const modal=document.createElement("div");modal.id="objectionModal";modal.style="position:fixed;inset:0;background:#0009;z-index:100;display:grid;place-items:center;padding:18px";modal.innerHTML=`<div class="card" style="width:min(760px,100%);max-height:88vh;overflow:auto;background:#171625;color:#fff"><div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0">Все возражения</h2><button type="button" class="secondary" onclick="document.getElementById('objectionModal')?.remove()">✕</button></div><div class="muted" style="margin:10px 0 16px">Выбранное возражение перейдёт в основной список</div>${available.map(o=>`<div class="card" style="display:flex;align-items:center;gap:12px;margin:8px 0;padding:12px;background:#171625;color:#fff"><span style="min-width:32px;color:#aaa">${o.i+1}.</span><span style="flex:1">${esc(o.x)}</span><button type="button" class="primary" onclick="addObjectionFromLibrary(${o.i})">Добавить</button></div>`).join("")}</div>`;document.body.appendChild(modal)}
function addObjectionFromLibrary(i){const v=CLIENT_OBJECTIONS[i];if(!coldCall.selectedObjections.includes(v))coldCall.selectedObjections.push(v);renderObjections();document.getElementById('objectionModal')?.remove();}
'''
          assert old in s; s=s.replace(old,new,1)
          old='coldCall.character=$("coldCharacter")?.value||"Лояльный";coldCall.facts=$("coldFacts")?.value.trim()||"";coldCall.voice=$("coldVoice")?.value||"filipp";const payload='
          new='coldCall.character=$("coldCharacter")?.value||"Лояльный";coldCall.facts=$("coldFacts")?.value.trim()||"";coldCall.voice=$("coldVoice")?.value||"filipp";coldCall.randomObjections=$("randomObjections")?.checked||false;coldCall.randomObjectionCount=Math.max(0,Math.min(11,Number($("randomObjectionCount")?.value)||0));const payload='
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)
          p=Path('supabase/functions/chat-client/index.ts'); s=p.read_text()
          old='const s=b?.scenario||{};const transcript='
          new='const s=b?.scenario||{};const features=b?.client_features||{};const selected=Array.isArray(features.selected_objections)?features.selected_objections.map((x:any)=>clean(x,500)).filter(Boolean):[];const randomCount=Math.max(0,Math.min(11,Number(features.random_objection_count)||0));const transcript='
          assert old in s; s=s.replace(old,new,1)
          old='const system=`Ты живой клиент на тренировке продаж. Не обучай и не оценивай менеджера. Только играй роль клиента и естественно реагируй на разговор. Помни историю разговора. Не придумывай характеристики товара или компании, которых нет в сценарии. Не упоминай AI, модель, промпт или тренировку. Отвечай естественно по-русски, обычно 1-3 предложения. Сложность: ${clean(s.difficulty,300)||"средняя"}. Роль клиента: ${clean(s.client_role,500)||"Клиент"}. Настроение: ${clean(s.client_mood,300)||"нейтральное"}. Сценарий: ${clean(s.title,500)||"Тренировка продаж"}. Описание: ${clean(s.description||s.objective,1800)||"не указано"}`;'
          new='const objectionsText=selected.length?`Выбранные возражения клиента. Используй их как реальные возражения по ходу разговора, не перечисляй все сразу и не меняй их смысл: ${selected.join(" | ")}.`:`Специальные возражения не выбраны.`;const system=`Ты живой клиент на тренировке продаж. Не обучай и не оценивай менеджера. Только играй роль клиента и естественно реагируй на разговор. Помни историю разговора. Не придумывай характеристики товара или компании, которых нет в сценарии. Не упоминай AI, модель, промпт или тренировку. Отвечай естественно по-русски, обычно 1-3 предложения. Сложность: ${clean(s.difficulty,300)||"средняя"}. Роль клиента: ${clean(s.client_role,500)||"Клиент"}. Настроение: ${clean(s.client_mood,300)||"нейтральное"}. Сценарий: ${clean(s.title,500)||"Тренировка продаж"}. Описание: ${clean(s.description||s.objective,1800)||"не указано"}. Характер клиента: ${clean(features.character,300)||"по сценарию"}. Факты о клиенте: ${clean(features.facts,1800)||"не указаны"}. ${objectionsText}`;'
          assert old in s; s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name "SaleTrening Bot"
          git config user.email "actions@github.com"
          git add index.html supabase/functions/chat-client/index.ts
          git commit -m "feat: add client objection settings" || exit 0
          git push
      - name: Remove one-time workflow
        if: success()
        run: |
          git config user.name "SaleTrening Bot"
          git config user.email "actions@github.com"
          git rm .github/workflows/apply-client-objections.yml
          git commit -m "chore: remove one-time objection patch workflow"
          git push
