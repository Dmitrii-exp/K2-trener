name: Inspect training gate
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inspect:
    if: github.event.head_commit.message == 'debug: inspect training gate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect index
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          terms=['startTraining','company_subscriptions','subscription','current_period_end','training_used','402','status','active','paid','saveSession','saletrening_sessions']
          out=[]
          for term in terms:
              out.append('\n=== '+term+' ===')
              for m in list(re.finditer(re.escape(term),s,re.I))[:20]:
                  a=max(0,m.start()-500); b=min(len(s),m.end()+900)
                  out.append(s[a:b].replace('\n',' '))
          Path('debug-training-gate.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit report
        run: |
          git config user.name 'SaleTrening Debug Bot'
          git config user.email 'actions@github.com'
          git add debug-training-gate.txt
          git commit -m 'debug: training gate report'
          git push