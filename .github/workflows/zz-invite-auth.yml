name: Apply company invitation auth flow
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only authentication and company invitations
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* COMPANY_INVITE_AUTH_V2 */'
          if marker in s:
              print('Invitation auth already applied')
              raise SystemExit(0)

          auth=re.compile(r'function authScreen\(\)\{.*?\}\s*async function signUp\(\)',re.S)
          new_auth=r'''function authScreen(){
            const invite=new URLSearchParams(location.search).get("invite")||localStorage.getItem("saletrening_invite_token")||"";
            const hasInvite=!!invite;
            if(invite)localStorage.setItem("saletrening_invite_token",invite);
            $("root").innerHTML=`<div class="auth"><div class="auth-card"><div class="auth-brand"><div class="logo"><div class="logo-b">S</div>SaleTrening</div><span class="auth-badge">AI SALES COACH</span></div><h1>${hasInvite?"Присоединиться к команде.":"Тренируй продажи."}<br>${hasInvite?"Регистрация сотрудника.":"Продавай увереннее."}</h1><div class="sub">${hasInvite?"Вас пригласили в команду SaleTrening. Зарегистрируйтесь с тем же email, на который отправлено приглашение.":"Практика переговоров с AI-клиентом, разбор ошибок и понятная статистика прогресса."}</div>${hasInvite?'<div class="card" style="margin:16px 0;padding:13px;background:#faf9ff"><b>Приглашение найдено</b><div class="muted" style="margin-top:4px">После регистрации аккаунт автоматически подключится к компании руководителя.</div></div>':''}<div class="field"><label>Имя</label><input id="first" placeholder="Дмитрий"></div><div class="field" ${hasInvite?'style="display:none"':''}><label>Компания <span class="muted">(для новой организации)</span></label><input id="company" placeholder="Моя компания"></div><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@company.ru"></div><div class="field"><label>Пароль</label><input id="pass" type="password" placeholder="Минимум 6 символов"></div><div class="auth-actions"><button class="primary" onclick="signUp()">${hasInvite?"Зарегистрироваться в команде":"Создать аккаунт"}</button><button class="secondary" onclick="signIn()">Войти</button></div><div class="auth-note">${hasInvite?"Используйте email, указанный руководителем в приглашении.":"При регистрации с названием компании создаётся новая организация, а первый пользователь становится руководителем."}</div></div></div>`;
          }
          async function signUp()'''
          if not auth.search(s): raise SystemExit('authScreen/signUp block not found')
          s=auth.sub(new_auth,s,count=1)

          signup=re.compile(r'async function signUp\(\)\{.*?\}\s*async function signIn\(\)',re.S)
          new_signup=r'''async function signUp(){
            const email=$("email").value.trim().toLowerCase(),password=$("pass").value,first=$("first").value.trim(),company=$("company")?.value.trim()||"";
            const invite=new URLSearchParams(location.search).get("invite")||localStorage.getItem("saletrening_invite_token")||"";
            if(!email||!password){toast("Заполни email и пароль");return}
            if(invite)localStorage.setItem("saletrening_invite_token",invite);
            const {data,error}=await sb.auth.signUp({email,password,options:{data:{first_name:first,company_name:invite?"":company}}});
            if(error){toast(error.message);return}
            if(data.session){await boot(data.session.user)}else{toast("Проверь почту для подтверждения аккаунта")}
          }
          async function signIn()'''
          if not signup.search(s): raise SystemExit('signUp/signIn block not found')
          s=signup.sub(new_signup,s,count=1)

          boot=re.compile(r'async function boot\(user\)\{.*?\}\s*async function loadAll\(\)',re.S)
          new_boot=r'''async function acceptPendingInvitation(userId){
            const token=new URLSearchParams(location.search).get("invite")||localStorage.getItem("saletrening_invite_token")||"";
            if(!token)return null;
            const {data,error}=await sb.rpc("accept_company_invitation",{p_token:token});
            if(error){
              console.error("accept_company_invitation:",error);
              const code=String(error.message||"");
              if(code.includes("email_mismatch")){toast("Приглашение предназначено для другого email");return null}
              if(code.includes("expired")){toast("Срок приглашения истёк");return null}
              if(code.includes("already_accepted")){localStorage.removeItem("saletrening_invite_token");return null}
              throw error;
            }
            localStorage.removeItem("saletrening_invite_token");
            const u=new URL(location.href);u.searchParams.delete("invite");history.replaceState({},"",u.pathname+(u.search?u.search:""));
            return data;
          }
          async function boot(user){
            state.user=user;
            await acceptPendingInvitation(user.id);
            let {data:p,error}=await sb.from("profiles").select("*").eq("id",user.id).single();
            if(error){toast("Профиль ещё создаётся. Обнови страницу через секунду.");return}
            state.profile=p;
            if(p.company_id){let c=await sb.from("companies").select("*").eq("id",p.company_id).single();state.company=c.data}
            await loadAll();
            render();
          }
          async function loadAll()'''
          if not boot.search(s): raise SystemExit('boot/loadAll block not found')
          s=boot.sub(new_boot,s,count=1)

          team=re.compile(r'function team\(\)\{.*?\}\s*function avgSkill\(',re.S)
          new_team=r'''async function createCompanyInvitation(){
            if(!state.profile?.company_id||!["director","admin","manager"].includes(state.profile.role)){toast("Нет прав для приглашения сотрудников");return}
            const email=$("inviteEmail")?.value.trim().toLowerCase();
            const role=$("inviteRole")?.value||"employee";
            if(!email){toast("Укажи email сотрудника");return}
            const token=crypto.randomUUID().replace(/-/g,"");
            const {error}=await sb.from("company_invitations").insert({company_id:state.profile.company_id,email,role,token,invited_by:state.user.id,expires_at:new Date(Date.now()+7*86400000).toISOString()});
            if(error){toast(error.message);return}
            const link=location.origin+location.pathname+"?invite="+encodeURIComponent(token);
            const out=$("inviteResult");if(out)out.innerHTML=`<div class="card" style="margin-top:14px;background:#faf9ff"><b>Приглашение создано</b><div class="muted" style="margin:6px 0">Срок действия: 7 дней</div><input id="inviteLink" value="${esc(link)}" readonly style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff"><div style="display:flex;gap:8px;margin-top:8px"><button class="primary" onclick="navigator.clipboard.writeText($(\"inviteLink\").value);toast(\"Ссылка скопирована\")">Копировать ссылку</button><button class="secondary" onclick="toast(\"Код: ${esc(token)}\")">Показать код</button></div></div>`;
          }
          function team(){
            const header=`<div class="top"><div><h2>Команда</h2><div class="muted">${state.team.length} участников</div></div><button class="primary" onclick="$(\"inviteBox\").classList.toggle(\"hidden\")">Пригласить сотрудника</button></div><div id="inviteBox" class="card hidden" style="margin-bottom:15px"><h3 style="margin-top:0">Пригласить сотрудника</h3><div class="field"><label>Email сотрудника</label><input id="inviteEmail" type="email" placeholder="employee@company.ru"></div><div class="field"><label>Роль</label><select id="inviteRole"><option value="employee">Менеджер</option><option value="manager">Менеджер / старший</option></select></div><button class="primary" onclick="createCompanyInvitation()">Создать приглашение</button><div id="inviteResult"></div></div>`;
            if(!state.team.length)return header+`<div class="empty">Сотрудников пока нет. Создай первое приглашение выше.</div>`;
            return header+`<div class="card"><table class="table"><thead><tr><th>Сотрудник</th><th>Тренировки</th><th>Средний</th><th>Выявление</th><th>Возражения</th><th>Закрытие</th></tr></thead><tbody>${state.team.map(x=>`<tr><td>${esc(x.employee_name)}</td><td>${x.sessions_count}</td><td><b>${x.avg_score}</b></td><td>${x.discovery_score}</td><td>${x.objection_score}</td><td>${x.closing_score}</td></tr>`).join("")}</tbody></table></div>`;
          }
          function avgSkill('''
          if not team.search(s): raise SystemExit('team/avgSkill block not found')
          s=team.sub(new_team,s,count=1)

          s=s.replace('</script>',marker+'\n</script>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          required=['COMPANY_INVITE_AUTH_V2','accept_company_invitation','company_invitations','createCompanyInvitation','Пригласить сотрудника','saletrening_invite_token']
          for x in required:
              if x not in s: raise SystemExit('Missing: '+x)
          if s.count('function authScreen(')!=1: raise SystemExit('authScreen duplicate')
          if s.count('async function signUp(')!=1: raise SystemExit('signUp duplicate')
          if s.count('async function boot(')!=1: raise SystemExit('boot duplicate')
          if s.count('function team(')!=1: raise SystemExit('team duplicate')
          print('Invitation auth validation passed')
      - name: Commit only auth changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/zz-invite-auth.yml
          git commit -m 'feat: add company invitation registration flow [skip ci]'
          git push
