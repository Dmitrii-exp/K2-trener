name: Switch chat endpoint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  switch-endpoint:
    if: github.event.head_commit.message != 'chore: switch chat endpoint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch frontend to healthy Edge Function
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '/functions/v1/chat-client'
          new = '/functions/v1/chat-client-v13'
          if old not in s:
              raise SystemExit('chat-client endpoint not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'chore: switch chat endpoint'
          git push
