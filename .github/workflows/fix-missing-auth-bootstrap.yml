name: Fix missing auth bootstrap
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Restore auth bootstrap if missing
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = 'sb.auth.onAuthStateChange((event,session)=>'
          if marker not in s:
              needle = '</script>\n</body>\n</html>'
              boot = '''sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session){setTimeout(()=>boot(session.user),0)}});\n(async()=>{const {data}=await sb.auth.getSession();if(data.session){await boot(data.session.user)}else{authScreen()}})();\n'''
              if needle not in s:
                  raise SystemExit('HTML tail marker not found')
              s = s.replace(needle, boot + needle, 1)
              p.write_text(s, encoding='utf-8')
      - name: Commit fixed index and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-missing-auth-bootstrap.yml
          git rm .github/workflows/fix-missing-auth-bootstrap.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore auth bootstrap'
          git push
