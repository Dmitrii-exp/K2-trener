name: Fix text training
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch standard training
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Restore the original text-training flow and remove automatic speech.
          s = s.replace('state.view="training";trainingChat();try{const opening=await aiClientReply("",true);state.messages.push({speaker:"client",content:opening});await saveSession();trainingChat();speakClient(opening)}', 'state.view="training";trainingChat();try{const opening=await aiClientReply("",true);state.messages.push({speaker:"client",content:opening});await saveSession();trainingChat()}')
          s = s.replace('state.messages.push({speaker:"client",content:r});await saveSession();trainingChat();speakClient(r)', 'state.messages.push({speaker:"client",content:r});await saveSession();trainingChat()')

          tag = '<script src="/training-tab-fix.js?v=20260903-2"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('body marker not found')
              s = s.replace(marker, tag + '\n' + marker, 1)

          p.write_text(s, encoding='utf-8')
          print('text training patched')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'SaleTrening Bot'
          git config user.email 'actions@github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: text training dialog without voice'
          git push
