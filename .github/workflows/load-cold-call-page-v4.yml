name: Load stable cold call page v4

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add stable cold call page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'\s*<script src="/cold-call-page-v[0-9]+\.js\?v=[^"]+"></script>', '', s)
          tag='<script src="/cold-call-page-v4.js?v=20260906-cold-v4"></script>'
          if tag not in s:
              marker='<script src="/cold-call-voice-v5.js?v=20260905-voice-v5"></script>'
              if marker in s:
                  s=s.replace(marker, marker+'\n'+tag, 1)
              else:
                  s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: load stable cold call page v4'
          git push
