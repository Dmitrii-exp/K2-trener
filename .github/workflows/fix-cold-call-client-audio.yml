name: Fix cold call client audio
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only cold call audio fallback
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""const originalCancel=nativeSpeechSynthesis.cancel.bind(nativeSpeechSynthesis);\n  nativeSpeechSynthesis.cancel=()=>{try{if(yandexAudio){yandexAudio.pause();yandexAudio.currentTime=0;yandexAudio=null}}catch{};yandexBusy=false;originalCancel()};"""
          new="""const originalCancel=nativeSpeechSynthesis.cancel.bind(nativeSpeechSynthesis);\n  const originalSpeak=nativeSpeechSynthesis.speak.bind(nativeSpeechSynthesis);\n  nativeSpeechSynthesis.cancel=()=>{try{if(yandexAudio){yandexAudio.pause();yandexAudio.currentTime=0;yandexAudio=null}}catch{};yandexBusy=false;originalCancel()};"""
          if old not in s: raise SystemExit('speechkit cancel block not found')
          s=s.replace(old,new,1)
          old="""      await yandexAudio.play();\n    }catch(e){\n      yandexBusy=false;console.error('Yandex SpeechKit TTS:',e);\n      try{utterance?.onerror?.({type:'error',error:e})}catch{}\n    }"""
          new="""      try{await yandexAudio.play()}catch(playError){\n        console.warn('Yandex SpeechKit audio playback failed, using browser TTS fallback:',playError);\n        yandexBusy=false;\n        try{originalSpeak(utterance)}catch{}\n        return;\n      }\n    }catch(e){\n      yandexBusy=false;console.error('Yandex SpeechKit TTS:',e);\n      try{originalSpeak(utterance)}catch{}\n      try{utterance?.onerror?.({type:'error',error:e})}catch{}\n    }"""
          if old not in s: raise SystemExit('speechkit play block not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: restore cold call client audio fallback'
          git push
      - name: Patch detailed training reports
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('let state={user:null,profile:null,company:null,view:"home",scenarios:[],session:null,messages:[],stats:null,team:[],history:[]};','let state={user:null,profile:null,company:null,view:"home",scenarios:[],session:null,messages:[],stats:null,team:[],history:[],report:null};',1)
          old='const h=await sb.from("saletrening_sessions").select("id,scenario_id,status,total_score,ai_summary,created_at,completed_at").eq("employee_id",state.user.id).order("created_at",{ascending:false}).limit(50);state.history=h.data||[];if(["director","admin"].includes(state.profile.role)&&state.profile.company_id){let t=await sb.from("manager_team_stats").select("*").eq("company_id",state.profile.company_id).order("avg_score",{ascending:false});state.team=t.data||[]}'
          new='let h;if(["manager","director","admin"].includes(state.profile.role)&&state.profile.company_id){h=await sb.from("saletrening_sessions").select("id,employee_id,scenario_id,status,total_score,ai_summary,created_at,completed_at").eq("company_id",state.profile.company_id).order("created_at",{ascending:false}).limit(50)}else{h=await sb.from("saletrening_sessions").select("id,employee_id,scenario_id,status,total_score,ai_summary,created_at,completed_at").eq("employee_id",state.user.id).order("created_at",{ascending:false}).limit(50)}state.history=h.data||[];if(["director","admin"].includes(state.profile.role)&&state.profile.company_id){let t=await sb.from("manager_team_stats").select("*").eq("company_id",state.profile.company_id).order("avg_score",{ascending:false});state.team=t.data||[]}'
          if old not in s: raise SystemExit('history load target not found')
          s=s.replace(old,new,1)
          old='function page(){let p=$("page");if(!p)return;if(state.session){trainingChat();return}if(state.view==="home")p.innerHTML=home();'
          new='function page(){let p=$("page");if(!p)return;if(state.report){p.innerHTML=reportPage();return}if(state.session){trainingChat();return}if(state.view==="home")p.innerHTML=home();'
          if old not in s: raise SystemExit('page target not found')
          s=s.replace(old,new,1)
          old='function historyPage(){const names={};state.scenarios.forEach(s=>names[s.id]=s.title);return `<div class="top"><div><h2>История тренировок</h2><div class="muted">Последние 50 тренировок и результаты AI</div></div></div><div class="card" style="padding:0;overflow:hidden">${state.history.length?`<table class="table"><thead><tr><th>Дата</th><th>Сценарий</th><th>Статус</th><th>Балл</th><th>AI-разбор</th></tr></thead><tbody>${state.history.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString("ru-RU")}</td><td>${esc(names[x.scenario_id]||"Тренировка")}</td><td>${x.status==="completed"?"Завершена":"В процессе"}</td><td><b>${x.total_score??"—"}</b></td><td>${esc(x.ai_summary||"—")}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">История пока пуста.</div>`}</div>`}'
          new='function historyPage(){const names={};state.scenarios.forEach(s=>names[s.id]=s.title);const employees={};state.team.forEach(x=>{employees[x.employee_id]=x.employee_name});return `<div class="top"><div><h2>История тренировок</h2><div class="muted">Последние 50 тренировок и результаты AI</div></div></div><div class="card" style="padding:0;overflow:hidden">${state.history.length?`<table class="table"><thead><tr><th>Дата</th><th>Менеджер</th><th>Сценарий</th><th>Статус</th><th>Балл</th><th>AI-разбор</th></tr></thead><tbody>${state.history.map(x=>`<tr onclick="showTrainingReport(\'${x.id}\')" style="cursor:pointer"><td>${new Date(x.created_at).toLocaleString("ru-RU")}</td><td>${esc(employees[x.employee_id]||((x.employee_id===state.user.id)?(state.profile.first_name||state.user.email):"Менеджер"))}</td><td>${esc(names[x.scenario_id]||"Тренировка")}</td><td>${x.status==="completed"?"Завершена":"В процессе"}</td><td><b>${x.total_score??"—"}</b></td><td>${esc(x.ai_summary||"—")}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">История пока пуста.</div>`}</div>`}'
          if old not in s: raise SystemExit('historyPage target not found')
          s=s.replace(old,new,1)
          marker='function team(){'
          insert='''async function showTrainingReport(id){const {data,error}=await sb.from("saletrening_sessions").select("id,employee_id,company_id,scenario_id,status,total_score,ai_summary,feedback,ai_evaluation,transcript,created_at,completed_at").eq("id",id).single();if(error||!data){toast(error?.message||"Не удалось загрузить отчет");return}if(!["manager","director","admin"].includes(state.profile.role)&&data.employee_id!==state.user.id){toast("Нет доступа к отчету");return}state.report=data;page()}
function reportPage(){const r=state.report||{},e=r.ai_evaluation||{},tr=Array.isArray(r.transcript)?r.transcript:[],names={};state.scenarios.forEach(s=>names[s.id]=s.title);const score20=k=>Math.max(0,Math.min(20,Number(e[k])||0));const overall=Math.max(0,Math.min(100,Number(r.total_score??e.overall_score)||0));const list=(arr,empty)=>Array.isArray(arr)&&arr.length?`<ul style="margin:10px 0 0 18px;padding:0">${arr.map(x=>`<li style="margin:7px 0">${esc(x)}</li>`).join("")}</ul>`:`<div class="muted" style="margin-top:8px">${empty}</div>`;return `<div class="top"><div><h2>Отчёт по тренировке</h2><div class="muted">${esc(names[r.scenario_id]||"Тренировка")} · ${new Date(r.created_at).toLocaleString("ru-RU")}</div></div><button class="secondary" onclick="state.report=null;state.view=\"history\";page()">← История</button></div><div class="card" style="text-align:center;padding:28px"><div class="muted">Общий балл</div><div class="metric" style="font-size:54px">${overall}<span style="font-size:18px;color:var(--muted)"> / 100</span></div></div><div class="section card"><h3>Критерии оценки</h3>${[["Работа с возражениями","objection"],["Выявление потребности","discovery"],["Знание продукта","product"],["Установление контакта","contact"],["Дожим","closing"]].map(([t,k])=>`<div style="margin:18px 0"><div style="display:flex;justify-content:space-between;font-size:14px"><span>${t}</span><b>${score20(k)} / 20</b></div><div class="bar" style="margin-top:8px"><i style="width:${score20(k)*5}%"></i></div></div>`).join("")}<div class="muted" style="margin-top:14px">Сумма пяти критериев = ${["objection","discovery","product","contact","closing"].reduce((a,k)=>a+score20(k),0)} / 100</div></div><div class="section card"><h3>Разбор ошибок менеджера</h3><div style="margin-top:16px"><b>Что сказал нужное</b>${list(e.needed_said||e.strengths,"Нет отмеченных сильных моментов.")}</div><div style="margin-top:20px"><b>Что забыл спросить</b>${list(e.missed_questions||e.weaknesses,"Нет конкретных пропусков.")}</div><div style="margin-top:20px"><b>Что лучше не говорить</b>${list(e.avoid_phrases||e.recommendations,"Нет отмеченных фраз для исключения.")}</div></div><div class="section card"><h3>Сильные вопросы и аргументы</h3>${list(e.strong_questions_arguments,"Сильные вопросы или аргументы не выделены.")}</div><div class="section card"><h3>Полный конспект диалога</h3><div style="margin-top:14px">${tr.length?tr.map(m=>`<div class="msg ${m.speaker==="client"?"client":"manager"}" style="max-width:100%;margin:8px 0"><b>${m.speaker==="client"?"Клиент":"Менеджер"}:</b> ${esc(m.content)}</div>`).join(""):`<div class="muted">Конспект отсутствует.</div>`}</div></div>`}

'''
          if marker not in s: raise SystemExit('team marker not found')
          s=s.replace(marker,insert+marker,1)
          old='finally{state.session=null;await loadAll();state.view="progress";render()}}'
          new='finally{state.session=null;await loadAll();state.view="history";state.report=null;render()}}'
          if old not in s: raise SystemExit('finish target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          p=Path('supabase/functions/evaluate-session/index.ts'); s=p.read_text(encoding='utf-8')
          old='const prompt=`Проанализируй только действия менеджера в диалоге продаж. Верни ТОЛЬКО валидный JSON без markdown и пояснений: {"overall_score":0,"discovery_score":0,"objection_score":0,"value_score":0,"closing_score":0,"communication_score":0,"next_step_score":0,"summary":"","strengths":[],"weaknesses":[],"recommendations":[]}. Все оценки 0-100. Массивы — конкретные строки на русском. Не выдумывай факты. ДИАЛОГ: ${JSON.stringify(tr)}`;'
          new='const prompt=`Проанализируй только действия менеджера в диалоге продаж. Верни ТОЛЬКО валидный JSON без markdown и пояснений: {"overall_score":0,"objection_score":0,"discovery_score":0,"product_score":0,"contact_score":0,"closing_score":0,"needed_said":[],"missed_questions":[],"avoid_phrases":[],"strong_questions_arguments":[],"summary":""}. Каждый из пяти критериев (objection_score, discovery_score, product_score, contact_score, closing_score) оцени строго от 0 до 20. overall_score обязан быть точной суммой этих пяти оценок (0-100). Критерий closing_score — именно дожим: клиент согласился или почти согласился на сделку и менеджер правильно довел до следующего шага/сделки. needed_said — что менеджер сказал правильно и по делу. missed_questions — что менеджер забыл спросить или выяснить. avoid_phrases — конкретно что менеджеру лучше не говорить. strong_questions_arguments — сильные вопросы и аргументы менеджера. Массивы — конкретные строки на русском. Не выдумывай факты. ДИАЛОГ: ${JSON.stringify(tr)}`;'
          if old not in s: raise SystemExit('evaluation prompt target not found')
          s=s.replace(old,new,1)
          old='const ev={overall_score:score(p.overall_score),discovery_score:score(p.discovery_score),objection_score:score(p.objection_score),value_score:score(p.value_score),closing_score:score(p.closing_score),communication_score:score(p.communication_score),next_step_score:score(p.next_step_score),summary:clean(p.summary,5000),strengths:Array.isArray(p.strengths)?p.strengths.map((x:any)=>clean(x,800)).filter(Boolean):[],weaknesses:Array.isArray(p.weaknesses)?p.weaknesses.map((x:any)=>clean(x,800)).filter(Boolean):[],recommendations:Array.isArray(p.recommendations)?p.recommendations.map((x:any)=>clean(x,800)).filter(Boolean):[]};'
          new='const score20=(v:unknown)=>{const n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(20,Math.round(n))):0};const discovery=score20(p.discovery_score),objection=score20(p.objection_score),product=score20(p.product_score),contact=score20(p.contact_score),closing=score20(p.closing_score);const overall=discovery+objection+product+contact+closing;const ev={overall_score:overall,discovery_score:discovery,objection_score:objection,product_score:product,contact_score:contact,closing_score:closing,value_score:score(p.value_score),communication_score:score(p.communication_score),next_step_score:score(p.next_step_score),needed_said:Array.isArray(p.needed_said)?p.needed_said.map((x:any)=>clean(x,800)).filter(Boolean):[],missed_questions:Array.isArray(p.missed_questions)?p.missed_questions.map((x:any)=>clean(x,800)).filter(Boolean):[],avoid_phrases:Array.isArray(p.avoid_phrases)?p.avoid_phrases.map((x:any)=>clean(x,800)).filter(Boolean):[],strong_questions_arguments:Array.isArray(p.strong_questions_arguments)?p.strong_questions_arguments.map((x:any)=>clean(x,800)).filter(Boolean):[],summary:clean(p.summary,5000),strengths:Array.isArray(p.needed_said)?p.needed_said.map((x:any)=>clean(x,800)).filter(Boolean):[],weaknesses:Array.isArray(p.missed_questions)?p.missed_questions.map((x:any)=>clean(x,800)).filter(Boolean):[],recommendations:Array.isArray(p.avoid_phrases)?p.avoid_phrases.map((x:any)=>clean(x,800)).filter(Boolean):[]};'
          if old not in s: raise SystemExit('evaluation object target not found')
          s=s.replace(old,new,1)
          old='const {error:sc}=await admin.from("session_scores").upsert({session_id:sid,employee_id:user.id,company_id:s.company_id,...ev,model:result.model},{onConflict:"session_id"});'
          new='const {error:sc}=await admin.from("session_scores").upsert({session_id:sid,employee_id:user.id,company_id:s.company_id,overall_score:ev.overall_score,discovery_score:ev.discovery_score*5,objection_score:ev.objection_score*5,value_score:ev.value_score,closing_score:ev.closing_score*5,communication_score:ev.communication_score,next_step_score:ev.next_step_score,strengths:ev.needed_said,weaknesses:ev.missed_questions,recommendations:ev.avoid_phrases,model:result.model},{onConflict:"session_id"});'
          if old not in s: raise SystemExit('session_scores target not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          subprocess.run(['git','diff','--check'],check=True)
      - name: Commit training reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html supabase/functions/evaluate-session/index.ts
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add detailed training reports'
          git push
