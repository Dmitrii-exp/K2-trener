name: Validate cold call client audio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current audio implementation
        shell: python
        run: |
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          required = [
              'function speakClient(text)',
              'speechSynthesis',
              'chat-client',
              'Yandex SpeechKit TTS',
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('Cold-call audio validation failed; missing: ' + ', '.join(missing))
          print('Cold-call client audio implementation is present.')
          print('No source patch is applied because the current implementation is already newer than the legacy patch.')
