name: Wire client settings into training runtime
on:
  push:
    branches: [main]
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch training payload
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* CLIENT_SETTINGS_RUNTIME_V1 */'
          if marker in s:
              print('Client settings runtime already patched')
              raise SystemExit(0)
          old='body:JSON.stringify({session_id:state.session.id,scenario_id:state.session.scenario.id,message:opening?"":userMessage,opening,transcript:state.messages,scenario:state.session.scenario})'
          new='body:JSON.stringify({session_id:state.session.id,scenario_id:state.session.scenario.id,message:opening?"":userMessage,opening,transcript:state.messages,scenario:state.session.scenario,client_settings:state.clientSettings||state.client_settings||state.session.client_settings||state.session.scenario.client_settings||state.session.scenario.clientSettings||state.session.scenario.ai_settings||state.session.scenario.settings||{},objections:state.clientObjections||state.client_objections||state.session.objections||state.session.client_objections||state.session.scenario.objections||state.session.scenario.client_objections||[]})'+marker
          if old not in s:
              raise SystemExit('Training payload anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'CLIENT_SETTINGS_RUNTIME_V1' in s
          assert 'client_settings:' in s
          assert 'objections:' in s
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: pass client settings to AI client'
          git push