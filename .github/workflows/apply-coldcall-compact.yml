name: Apply compact cold call objections

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply compact objections patch
        run: |
          if grep -q 'COLD_CALL_OBJECTIONS_COMPACT_V1' auth-invite.js; then
            echo 'Compact objections patch already applied'
            exit 0
          fi
          cat coldcall-objections-compact.js >> auth-invite.js
          git config user.name 'SaleTrening Bot'
          git config user.email 'actions@github.com'
          git add auth-invite.js
          git commit -m 'feat: compact cold call objections UI'
          git push
