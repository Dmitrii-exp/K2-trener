name: Load training launch fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message == 'fix: load training launch fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/training-launch-fix.js?v=20260903-2"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'SaleTrening Fix Bot'
          git config user.email 'actions@github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: load training launch fix'
          git push