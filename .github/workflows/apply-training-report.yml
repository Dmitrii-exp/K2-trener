name: Apply training report
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          if '<!-- TRAINING_REPORT_LAYER_V1 -->' in s: raise SystemExit(0)
          layer=''.join(Path(x).read_text(encoding='utf-8') for x in ['scripts/report_layer_1.js','scripts/report_layer_2.js','scripts/report_layer_3.js'])
          s=s.replace('</body>',layer+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'feat: add detailed training reports'
          git push
