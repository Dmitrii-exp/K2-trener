name: One-time frontend repair
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove frontend placeholders
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements={
            '${nav("home","Главная","¦")}':'${nav("home","Главная","⌂")}',
            '${nav("training","Тренировки","?")}':'${nav("training","Тренировки","◉")}',
            '${nav("scenarios","Сценарии","?")}':'${nav("scenarios","Сценарии","▣")}',
            '${nav("progress","Мой прогресс","?")}':'${nav("progress","Мой прогресс","↗")}',
            '${nav("history","История","?")}':'${nav("history","История","◷")}',
            '${nav("ai","AI-наставник","?")}':'${nav("ai","AI-наставник","✦")}',
            'nav("team","Команда","?")':'nav("team","Команда","♙")',
            'nav("analytics","Аналитика","?")':'nav("analytics","Аналитика","▥")',
            '        ??\n      </div>':'        🤖\n      </div>',
            '          ?? Выявление потребностей':'          🎯 Выявление потребностей',
            '          ?? Работа с возражениями':'          🛡️ Работа с возражениями',
            '          ? AI-наставник':'          ✦ AI-наставник',
            '      AI Edge Function подключается отдельно через Supabase.':'      AI-наставник работает на данных ваших тренировок и AI-разборов.',
            'Добавь сотрудников через систему\n      приглашений на следующем этапе.':'Завершённых тренировок команды пока нет.\n      Здесь появится командная статистика после первых результатов.'
          }
          for old,new in replacements.items():
            s=s.replace(old,new)

          old='''  state.messages=[\n    {\n      speaker:"client",\n      content:\n      "Здравствуйте. Я пока просто сравниваю варианты и не уверен, что мне это вообще нужно."\n    }\n  ];\n\n  await saveSession();\n\n  state.view="training";\n\n  trainingChat();'''
          new='''  state.messages=[];\n  await saveSession();\n\n  state.view="training";\n  trainingChat();\n\n  try{\n    const opening=await aiClientReply("",true);\n    state.messages.push({speaker:"client",content:opening});\n    await saveSession();\n    trainingChat();\n    speakClient(opening);\n  }catch(e){\n    console.error("chat-client opening:",e);\n    trainingChat();\n    toast("Не удалось получить первую реплику AI-клиента: "+(e.message||"ошибка"));\n  }'''
          assert old in s, 'startTraining block not found'
          s=s.replace(old,new)

          old='''  return j?.reply||j?.message||j?.content||j?.text||"Расскажите подробнее.";'''
          new='''  const reply=j?.reply||j?.message||j?.content||j?.text;\n  if(!reply) throw new Error("AI не вернул реплику клиента");\n  return reply;'''
          assert old in s, 'AI fallback not found'
          s=s.replace(old,new)

          old='''  }catch(e){\n    console.error("chat-client:",e);\n    state.messages.push({speaker:"client",content:"Я понял. Уточните, пожалуйста, что именно вы предлагаете и какую пользу я получу для своей компании?"});\n    await saveSession();trainingChat();\n    toast("AI временно недоступен: "+(e.message||"ошибка"));\n  }'''
          new='''  }catch(e){\n    console.error("chat-client:",e);\n    trainingChat();\n    toast("AI-клиент временно недоступен: "+(e.message||"ошибка"));\n  }'''
          assert old in s, 'error fallback not found'
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

      - name: Validate and commit
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          assert 'Расскажите подробнее.' not in s
          assert 'Я понял. Уточните, пожалуйста' not in s
          assert 'Здравствуйте. Я пока просто сравниваю' not in s
          js=re.search(r'<script>([\s\S]*)</script>',s).group(1)
          Path('/tmp/app.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/repair-frontend-stubs.yml
          git commit -m 'fix: remove frontend AI fallbacks and placeholders'
          git push