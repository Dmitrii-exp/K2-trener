name: Fix training tab
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-training-tab.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch training navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='function nav(v,t,icon){return `<button class="${state.view===v?"active":""}" onclick="state.view=\'${v}\';page()"><span class="nav-icon">${icon}</span>${t}</button>`}'
          new='''async function openTrainingTab(){try{state.view="training";const p=$("page");if(p)p.innerHTML=`<div class="top"><div><h2>Тренировки</h2><div class="muted">Загружаем сценарии...</div></div></div><div class="empty">Подготавливаем AI-тренировки…</div>`;if(!state.scenarios?.length&&state.user){const q=await sb.from("saletrening_scenarios").select("*").eq("active",true).order("id");if(q.error)throw q.error;state.scenarios=q.data||[]}render()}catch(e){console.error("Training tab:",e);const p=$("page");if(p)p.innerHTML=`<div class="top"><div><h2>ИИ-тренировки</h2><div class="muted">Ошибка загрузки сценариев</div></div></div><div class="empty"><b>Не удалось загрузить тренировки.</b><br><span class="muted">${esc(e.message||"Проверьте подключение к Supabase")}</span><br><button class="primary" style="margin-top:14px" onclick="openTrainingTab()">Повторить</button></div>`}}
function nav(v,t,icon){return `<button class="${state.view===v?"active":""}" onclick="${v==='training'?"openTrainingTab()":"state.view='"+v+"';page()"}"><span class="nav-icon">${icon}</span>${t}</button>`}'''
          if old not in s:
              raise SystemExit('nav pattern not found')
          s=s.replace(old,new,1)
          old2='function trainingList(){return `<div class="top"><div><h2>Тренировки</h2><div class="muted">Выбери ситуацию и начни живой диалог</div></div></div>${scenarioCards(state.scenarios)}`}function scenarios()'
          new2='function trainingList(){return `<div class="top"><div><h2>ИИ-тренировки</h2><div class="muted">Выбери ситуацию и начни живой диалог с AI-клиентом</div></div></div>${scenarioCards(state.scenarios||[])}`}function scenarios()'
          if old2 not in s:
              raise SystemExit('trainingList pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          print('patched',len(s))
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'SaleTrening Bot'
          git config user.email 'actions@github.com'
          git add index.html
          git commit -m 'fix: restore AI training tab' || exit 0
          git rm .github/workflows/fix-training-tab.yml
          git commit -m 'chore: remove one-time training fix workflow'
          git push
