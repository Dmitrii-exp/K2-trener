name: Patch cold call settings

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: |
          if grep -q 'COLD_CALL_SETTINGS_UI_V1' auth-invite.js; then
            echo 'Patch already applied'
            exit 0
          fi
          cat coldcall-settings-patch.js >> auth-invite.js
          git config user.name 'SaleTrening Bot'
          git config user.email 'actions@github.com'
          git add auth-invite.js
          git commit -m 'patch: apply cold call settings'
          git push
