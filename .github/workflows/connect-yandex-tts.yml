name: Connect Yandex SpeechKit TTS
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire employee invitation registration
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="/auth-invite.js"></script>'
          if tag not in s:
              anchor='</body>'
              if anchor not in s: raise SystemExit('body anchor not found')
              s=s.replace(anchor,tag+anchor,1)
              p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert '<script src="/auth-invite.js"></script>' in s
          assert Path('auth-invite.js').exists()
          print('Employee invitation registration wiring present')
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then echo 'No changes needed'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: wire employee invitation registration'
          git push
