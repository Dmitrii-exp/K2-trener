name: Deploy current main to Vercel

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_1a4Jv1ik6LBIvRApwhY9Rdk4
          VERCEL_PROJECT_ID: prj_v3ExOUKIbVwo3HMQ9V21NYX4i7rZ
        run: npx vercel@latest --prod --yes --token "$VERCEL_TOKEN"
