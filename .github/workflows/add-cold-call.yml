name: Add cold call voice mode

on:
  push:
    branches: [main]
    paths:
      - README.md

jobs:
  patch-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch cold call mode
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* COLD_CALL_MODE_V1 */'
          if marker in s:
              print('already patched')
              raise SystemExit(0)
          style='''\n/* COLD_CALL_MODE_V1 */\n.call-shell{max-width:900px;margin:auto;background:#171625;color:#fff;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px #0002}.call-head{padding:26px 28px;text-align:center;background:linear-gradient(180deg,#232039,#171625)}.call-status{font-size:12px;color:#aaa7b8;text-transform:uppercase;letter-spacing:.12em}.call-avatar{width:92px;height:92px;border-radius:50%;margin:16px auto 12px;display:grid;place-items:center;background:linear-gradient(135deg,#6d4aff,#9b83ff);font-size:38px}.call-name{font-size:22px;font-weight:800}.call-sub{color:#aaa7b8;margin-top:5px}.call-timer{font-variant-numeric:tabular-nums;margin-top:12px;color:#d9d5ff}.call-body{padding:22px}.call-live{min-height:150px;background:#232039;border:1px solid #3a3555;border-radius:18px;padding:18px}.call-live-label{font-size:11px;color:#aaa7b8;text-transform:uppercase}.call-live-text{font-size:20px;line-height:1.45;margin-top:8px}.call-controls{display:flex;justify-content:center;gap:14px;margin-top:22px;flex-wrap:wrap}.call-btn{border:0;border-radius:999px;min-width:58px;height:58px;padding:0 22px;background:#2c2745;color:#fff;font-weight:800}.call-btn.primary-call{background:#6d4aff}.call-btn.end-call{background:#d84d5b}.call-hint{text-align:center;color:#aaa7b8;font-size:13px;margin-top:14px}.call-transcript{margin-top:18px;max-height:230px;overflow:auto;background:#11101b;border-radius:16px;padding:14px}.call-transcript .msg{max-width:90%;background:transparent;border:0;color:#e9e7f4}.call-transcript .msg.manager{color:#c9bfff}.call-pulse{animation:callPulse 1.4s infinite}.call-muted{opacity:.65}@keyframes callPulse{0%,100%{box-shadow:0 0 0 0 #6d4aff55}50%{box-shadow:0 0 0 13px #6d4aff00}}\n'''
          s=s.replace('</style>',style+'</style>',1)
          nav='${nav("coldcall","Холодный звонок","☎")}'
          anchor='${nav("training","Тренировки","◉")}'
          if anchor not in s: raise SystemExit('nav anchor not found')
          s=s.replace(anchor,anchor+nav,1)
          branch='else if(state.view==="coldcall")p.innerHTML=coldCallHome();'
          anchor2='else if(state.view==="training")p.innerHTML=trainingList();'
          if anchor2 not in s: raise SystemExit('page anchor not found')
          s=s.replace(anchor2,anchor2+branch,1)
          code=r'''\n/* COLD_CALL_MODE_V1 */\nfunction coldCallScenario(){return state.scenarios.find(x=>String(x.title).toLowerCase().includes("холодный звонок"))||{id:0,title:"Холодный звонок",description:"Выход на ЛПР и начало холодного разговора",difficulty:"Средняя",client_role:"Потенциальный клиент",client_mood:"Занят, осторожен",objective:"Заинтересовать клиента и договориться о следующем шаге",system_prompt:"Ты клиент на холодном звонке. Не помогай менеджеру. Реагируй естественно, можешь возражать, торопиться и требовать конкретики."};}\nfunction coldCallHome(){const s=coldCallScenario();return `<div class="top"><div><h2>Холодный звонок</h2><div class="muted">Голосовая тренировка в режиме телефонного разговора</div></div></div><div class="card" style="max-width:900px;margin:auto"><h3>Как проходит звонок</h3><p class="muted">AI играет клиента. Вы говорите в микрофон. Если вы молчите больше 3 секунд, клиент спросит: «Вы на связи? Я вас не слышу.»</p><button class="primary" onclick="startColdCall()">☎ Начать звонок</button></div>`}\nlet coldCall={recognition:null,listening:false,silenceTimer:null,silenceNudged:false,startedAt:0,processing:false};\nasync function startColdCall(){const s=coldCallScenario();const payload={employee_id:state.user.id,company_id:state.profile.company_id,scenario_id:s.id||null,status:"started",transcript:[],voice_mode:true};let data,error;if(s.id){({data,error}=await sb.from("saletrening_sessions").insert(payload).select().single())}else{toast("Сначала добавь сценарий «Холодный звонок» в базу");return}if(error){toast(error.message);return}state.session={...data,scenario:s};state.messages=[];coldCall.startedAt=Date.now();coldCall.silenceNudged=false;state.view="coldcall";trainingCallPage();try{const opening=await aiClientReply("",true);state.messages.push({speaker:"client",content:opening});await saveSession();trainingCallPage();speakCallClient(opening);setTimeout(startVoiceListening,700)}catch(e){console.error(e);toast("Не удалось подключить AI-клиента: "+(e.message||"ошибка"))}}\nfunction trainingCallPage(){const p=$("page");if(!p||!state.session)return;p.innerHTML=`<div class="top"><div><h2>Холодный звонок</h2><div class="muted">Соединение с клиентом · AI-клиент</div></div><button class="secondary" onclick="finishTraining()">Завершить и оценить</button></div><div class="call-shell"><div class="call-head"><div class="call-status" id="callStatus">Соединение установлено</div><div class="call-avatar" id="callAvatar">☎</div><div class="call-name">${esc(state.session.scenario.client_role||"Клиент")}</div><div class="call-sub">Холодный звонок</div><div class="call-timer" id="callTimer">00:00</div></div><div class="call-body"><div class="call-live"><div class="call-live-label">Последняя реплика</div><div class="call-live-text" id="callLive">${esc(state.messages.at(-1)?.content||"Ожидание клиента...")}</div></div><div class="call-controls"><button id="callMic" class="call-btn primary-call" onclick="toggleVoice()">🎙 Говорить</button><button class="call-btn end-call" onclick="finishTraining()">Завершить звонок</button></div><div class="call-hint" id="callHint">Нажмите «Говорить» и разговаривайте естественно.</div><div class="call-transcript" id="callTranscript">${state.messages.map(m=>`<div class="msg ${m.speaker}"><b>${m.speaker==="client"?"Клиент":"Вы"}:</b> ${esc(m.content)}</div>`).join("")}</div></div></div>`;const t=setInterval(()=>{const el=$("callTimer");if(!el||!state.session){clearInterval(t);return}const sec=Math.floor((Date.now()-coldCall.startedAt)/1000);el.textContent=`${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`},1000)}\nfunction speakCallClient(text){if(!text)return;if("speechSynthesis" in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ru-RU";u.rate=.96;u.pitch=1;u.onend=()=>{if(state.session&&!coldCall.processing)setTimeout(startVoiceListening,250)};window.speechSynthesis.speak(u)}}\nfunction startVoiceListening(){if(!state.session||coldCall.processing)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast("В этом браузере нет распознавания речи. Используй Chrome/Яндекс Браузер.");return}if(coldCall.recognition){try{coldCall.recognition.abort()}catch{}}const r=new SR();r.lang="ru-RU";r.continuous=false;r.interimResults=true;r.maxAlternatives=1;coldCall.recognition=r;let finalText="";coldCall.listening=true;setCallStatus("Вы говорите…",true);clearTimeout(coldCall.silenceTimer);r.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const text=e.results[i][0]?.transcript||"";if(e.results[i].isFinal)finalText+=text+" ";else interim+=text}const live=$("callLive");if(live)live.textContent=(finalText+interim).trim()||"Слушаю…"};r.onerror=e=>{coldCall.listening=false;if(e.error!=="aborted")setCallStatus("Микрофон готов",false)};r.onend=async()=>{coldCall.listening=false;setCallStatus("Клиент слушает…",false);finalText=finalText.trim();if(finalText){clearTimeout(coldCall.silenceTimer);await sendVoiceTurn(finalText);return}coldCall.silenceTimer=setTimeout(()=>{if(state.session&&!coldCall.listening&&!coldCall.processing&&!coldCall.silenceNudged){coldCall.silenceNudged=true;const n="Вы на связи? Я вас не слышу.";state.messages.push({speaker:"client",content:n});saveSession();trainingCallPage();speakCallClient(n);setTimeout(()=>coldCall.silenceNudged=false,5000)}},3000)};try{r.start()}catch(e){console.error(e)}}\nfunction toggleVoice(){if(coldCall.listening){try{coldCall.recognition?.stop()}catch{}return}startVoiceListening()}\nasync function sendVoiceTurn(text){if(coldCall.processing||!state.session)return;coldCall.processing=true;state.messages.push({speaker:"manager",content:text});await saveSession();trainingCallPage();try{const r=await aiClientReply(text);state.messages.push({speaker:"client",content:r});await saveSession();trainingCallPage();speakCallClient(r)}catch(e){console.error(e);toast("AI-клиент временно недоступен: "+(e.message||"ошибка"))}finally{coldCall.processing=false}}\nfunction setCallStatus(text,pulse){const el=$("callStatus");if(el){el.textContent=text;el.classList.toggle("call-pulse",!!pulse)}}\n'''
          anchor3='async function startTraining(id){'
          if anchor3 not in s: raise SystemExit('startTraining anchor not found')
          s=s.replace(anchor3,code+'\n'+anchor3,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'feat: add cold call voice training'
          git push
