name: Fix training runtime layout

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize executable training runtime
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # Remove duplicate wrappers created by earlier repair runs.
          s = re.sub(r'(</style>\s*<script>\s*)+</style>\s*<script>\s*', r'\1', s, flags=re.I)
          s = re.sub(r'(</script>\s*<style>\s*)+</script>\s*<style>\s*', r'\1', s, flags=re.I)

          marker = 'async function startTraining'
          if marker not in s:
              raise SystemExit('training runtime marker not found')

          styles = list(re.finditer(r'<style[^>]*>(.*?)</style>', s, flags=re.S|re.I))
          containing = next((m for m in styles if marker in m.group(1)), None)
          if containing:
              block = containing.group(1)
              css_marker = '/* COLD_CALL_MODE_V1 */'
              if css_marker not in block:
                  raise SystemExit('cold-call CSS marker not found')
              split = block.index(css_marker)
              js = block[:split].strip()
              css = block[split:].strip()
              open_end = s.index('>', containing.start()) + 1
              close_start = containing.end() - len('</style>')
              prefix = s[:containing.start()]
              open_tag = s[containing.start():open_end]
              suffix = s[close_start + len('</style>'):]
              s = prefix + open_tag + '\n' + css + '\n</style>\n<script>\n' + js + '\n</script>' + suffix

          # Final normalization in case the source already had duplicated wrappers.
          s = re.sub(r'(</style>\s*<script>\s*)+</style>\s*<script>\s*', r'\1', s, flags=re.I)
          s = re.sub(r'(</script>\s*<style>\s*)+</script>\s*<style>\s*', r'\1', s, flags=re.I)
          p.write_text(s, encoding='utf-8')

      - name: Verify training runtime layout
        shell: python
        run: |
          from pathlib import Path
          import re
          t = Path('index.html').read_text(encoding='utf-8')
          styles = re.findall(r'<style[^>]*>(.*?)</style>', t, flags=re.S|re.I)
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', t, flags=re.S|re.I)
          if any('async function startTraining' in css for css in styles):
              raise SystemExit('startTraining is still inside a style block')
          if not any('async function startTraining' in js for js in scripts):
              raise SystemExit('training runtime script is missing')
          if '.call-shell' not in t:
              raise SystemExit('cold-call CSS missing')
          if t.count('<style') != len(re.findall(r'</style>', t, flags=re.I)):
              raise SystemExit('style tags are unbalanced')
          if t.count('<script') != len(re.findall(r'</script>', t, flags=re.I)):
              raise SystemExit('script tags are unbalanced')
          print('training runtime layout verified')

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'fix: normalize executable training runtime'
          git push
