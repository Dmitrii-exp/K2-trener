name: Configure cold call levels
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch only cold call UI and flow
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='function coldCallScenario(){return state.scenarios.find(x=>String(x.title).toLowerCase().includes("холодный звонок"))||{id:0,title:"Холодный звонок",description:"Выход на ЛПР и начало холодного разговора",difficulty:"Средняя",client_role:"Потенциальный клиент",client_mood:"Занят, осторожен",objective:"Заинтересовать клиента и договориться о следующем шаге",system_prompt:"Ты клиент на холодном звонке. Не помогай менеджеру. Реагируй естественно, можешь возражать, торопиться и требовать конкретики."};}'
          new='function coldCallScenario(difficulty="Средний"){const d=String(difficulty).toLowerCase().includes("слож")?"слож":"сред";return state.scenarios.find(x=>String(x.title).toLowerCase().includes("холодный звонок")&&String(x.difficulty||"").toLowerCase().includes(d))||state.scenarios.find(x=>String(x.title).toLowerCase().includes("холодный звонок"))||{id:0,title:"Холодный звонок",description:"Выход на ЛПР и начало холодного разговора",difficulty:difficulty,client_role:"Потенциальный клиент",client_mood:difficulty==="Сложный"?"Занят, скептически настроен":"Сдержанный",objective:"Заинтересовать клиента и договориться о следующем шаге"};}'
          if old not in s: raise SystemExit('coldCallScenario pattern not found')
          s=s.replace(old,new,1)
          old='function coldCallHome(){const s=coldCallScenario();return `<div class="top"><div><h2>Холодный звонок</h2><div class="muted">Голосовая тренировка в режиме телефонного разговора</div></div></div><div class="card" style="max-width:900px;margin:auto"><h3>Как проходит звонок</h3><p class="muted">AI играет клиента. Вы говорите в микрофон. Если вы молчите больше 3 секунд, клиент спросит: «Вы на связи? Я вас не слышу.»</p><button class="primary" onclick="startColdCall()">☎ Начать звонок</button></div>`}'
          new='function coldCallHome(){return `<div class="top"><div><h2>Холодный звонок</h2><div class="muted">Голосовая тренировка в режиме телефонного разговора</div></div></div><div class="card" style="max-width:900px;margin:auto"><h3>Выберите уровень сложности</h3><div class="grid" style="margin-top:18px"><div class="card"><h3>Средний</h3><p class="muted">Клиент более лоялен, идёт на контакт, слушает и задаёт вопросы.</p><button class="primary" onclick="startColdCall(\'Средний\')">☎ Начать</button></div><div class="card"><h3>Сложный</h3><p class="muted">Клиент менее охотно идёт на контакт и требует сильной аргументации.</p><button class="primary" onclick="startColdCall(\'Сложный\')">☎ Начать</button></div></div><p class="muted" style="margin-top:18px">Вы говорите первым. Лимит звонка — 10 минут.</p></div>`}'
          if old not in s: raise SystemExit('coldCallHome pattern not found')
          s=s.replace(old,new,1)
          old='let coldCall={recognition:null,listening:false,silenceTimer:null,silenceNudged:false,startedAt:0,processing:false};'
          new='let coldCall={recognition:null,listening:false,silenceTimer:null,silenceNudged:false,startedAt:0,processing:false,difficulty:"Средний",timer:null};'
          if old not in s: raise SystemExit('coldCall state pattern not found')
          s=s.replace(old,new,1)
          start=s.index('async function startColdCall()')
          end=s.index('\nfunction trainingCallPage()',start)
          newfunc='async function startColdCall(difficulty="Средний"){const s=coldCallScenario(difficulty);if(!s.id){toast("Сценарий «Холодный звонок» не найден в базе");return}const payload={employee_id:state.user.id,company_id:state.profile.company_id,scenario_id:s.id,status:"started",transcript:[],voice_mode:true};let data,error;({data,error}=await sb.from("saletrening_sessions").insert(payload).select().single());if(error){toast(error.message);return}state.session={...data,scenario:s};state.messages=[];coldCall.startedAt=Date.now();coldCall.difficulty=difficulty;coldCall.silenceNudged=false;coldCall.processing=false;state.view="coldcall";trainingCallPage();setTimeout(startVoiceListening,350)}'
          s=s[:start]+newfunc+s[end:]
          start=s.index('function trainingCallPage()')
          end=s.index('\nfunction speakCallClient',start)
          newfunc='function trainingCallPage(){const p=$("page");if(!p||!state.session)return;if(coldCall.timer)clearInterval(coldCall.timer);p.innerHTML=`<div class="top"><div><h2>Холодный звонок</h2><div class="muted">Соединение установлено · ${esc(coldCall.difficulty)}</div></div><button class="secondary" onclick="finishTraining()">Завершить и оценить</button></div><div class="call-shell"><div class="call-head"><div class="call-status" id="callStatus">Ваш ход — начинайте разговор</div><div class="call-avatar" id="callAvatar">☎</div><div class="call-name">${esc(state.session.scenario.client_role||"Клиент")}</div><div class="call-sub">Холодный звонок · ${esc(coldCall.difficulty)}</div><div class="call-timer" id="callTimer">00:00</div></div><div class="call-body"><div class="call-live"><div class="call-live-label">Последняя реплика</div><div class="call-live-text" id="callLive">Начните разговор — клиент слушает.</div></div><div class="call-controls"><button id="callMic" class="call-btn primary-call" onclick="toggleVoice()">🎙 Говорить</button><button class="call-btn end-call" onclick="finishTraining()">Завершить звонок</button></div><div class="call-hint" id="callHint">Вы говорите первым. После вашей реплики клиент ответит.</div><div class="call-transcript" id="callTranscript">${state.messages.map(m=>`<div class="msg ${m.speaker}"><b>${m.speaker==="client"?"Клиент":"Вы"}:</b> ${esc(m.content)}</div>`).join("")}</div></div></div>`;coldCall.timer=setInterval(async()=>{const el=$("callTimer");if(!el||!state.session){clearInterval(coldCall.timer);coldCall.timer=null;return}const sec=Math.floor((Date.now()-coldCall.startedAt)/1000);el.textContent=`${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;if(sec>=600&&!coldCall.processing){clearInterval(coldCall.timer);coldCall.timer=null;coldCall.processing=true;const n="У меня нет времени, мне не интересно, до свидания.";state.messages.push({speaker:"client",content:n});await saveSession();const live=$("callLive");if(live)live.textContent=n;setCallStatus("Звонок завершён",false);speakCallClient(n);setTimeout(()=>finishTraining(),2200)}},1000)}'
          s=s[:start]+newfunc+s[end:]
          old='const r=await fetch(SUPABASE_URL+"/functions/v1/chat-client",'
          new='const r=await fetch(SUPABASE_URL+"/functions/v1/chat-client-v39",'
          if old not in s: raise SystemExit('chat endpoint pattern not found')
          s=s.replace(old,new,1)
          old='body:JSON.stringify({session_id:state.session.id,scenario_id:state.session.scenario.id,message:opening?"":userMessage,opening,transcript:state.messages,scenario:state.session.scenario})'
          new='body:JSON.stringify({session_id:state.session.id,scenario_id:state.session.scenario.id,message:opening?"":userMessage,opening,transcript:state.messages,scenario:state.session.scenario,difficulty:coldCall.difficulty})'
          if old not in s: raise SystemExit('chat payload pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          if git diff --quiet -- index.html; then echo 'No changes needed'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'feat: configure cold call difficulty levels'
          git push
