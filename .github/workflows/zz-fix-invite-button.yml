name: Fix employee invitation button
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch invitation UI only
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* INVITE_BUTTON_FIX_V1 */'
          if marker in s:
              print('Already patched')
              raise SystemExit(0)

          old='''<button class="primary" onclick="$(\\"inviteBox\\").classList.toggle(\\"hidden\\")">Пригласить сотрудника</button>'''
          new='''<button type="button" class="primary" onclick="toggleInviteBox()">Пригласить сотрудника</button>'''
          if old not in s:
              # fallback for differently escaped source
              old='''<button class="primary" onclick="$("inviteBox").classList.toggle("hidden")">Пригласить сотрудника</button>'''
          if old not in s:
              raise SystemExit('Invite button markup not found')
          s=s.replace(old,new,1)

          anchor='''async function createCompanyInvitation(){'''
          replacement='''function toggleInviteBox(){
            const box=$("inviteBox");
            if(!box){toast("Не найден блок приглашения");return}
            box.classList.toggle("hidden");
            if(!box.classList.contains("hidden")) setTimeout(()=>$("inviteEmail")?.focus(),50);
          }
          async function createCompanyInvitation(){'''
          if anchor not in s: raise SystemExit('createCompanyInvitation not found')
          s=s.replace(anchor,replacement,1)

          s=s.replace('''<button class="primary" onclick="createCompanyInvitation()">Создать приглашение</button>''','''<button type="button" class="primary" onclick="createCompanyInvitation()">Создать приглашение</button>''',1)

          # Make the invitation operation fail visibly instead of silently when browser/runtime data is missing.
          old_guard='''if(!state.profile?.company_id||!["director","admin","manager"].includes(state.profile.role)){toast("Нет прав для приглашения сотрудников");return}'''
          new_guard='''if(!state.user||!state.profile){toast("Профиль ещё загружается. Обновите страницу через секунду.");return}
            if(!state.profile.company_id||!["director","admin","manager"].includes(state.profile.role)){toast("Нет прав для приглашения сотрудников");return}'''
          if old_guard not in s: raise SystemExit('Invitation guard not found')
          s=s.replace(old_guard,new_guard,1)

          s=s.replace('</script>',''+marker+'\n</script>',1)
          p.write_text(s,encoding='utf-8')
      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          for x in ['INVITE_BUTTON_FIX_V1','toggleInviteBox','createCompanyInvitation','Пригласить сотрудника']:
              if x not in s: raise SystemExit('Missing: '+x)
          print('Invite button validation passed')
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/zz-fix-invite-button.yml
          git commit -m 'fix: repair employee invitation button [skip ci]'
          git push
