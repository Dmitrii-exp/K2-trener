name: Repair auth bootstrap scope
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "})();\nsb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session){setTimeout(()=>boot(session.user),0)}});\n(async()=>{const {data}=await sb.auth.getSession();if(data.session){await boot(data.session.user)}else{authScreen()}})();"
          new = "window.authScreen=authScreen;window.boot=boot;\n})();\nsb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session){setTimeout(()=>window.boot(session.user),0)}});\n(async()=>{const {data}=await sb.auth.getSession();if(data.session){await window.boot(data.session.user)}else{window.authScreen()}})();"
          if old not in s:
              raise SystemExit('Expected auth bootstrap tail not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit repair and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/fix-auth-scope.yml
          git rm .github/workflows/fix-auth-scope.yml
          git diff --cached --quiet && exit 0
          git commit -m 'fix: expose auth bootstrap globally'
          git push