async function startTraining(id){const s=state.scenarios.find(x=>x.id===id);if(!s)return;const {data,error}=await sb.from("saletrening_sessions").insert({employee_id:state.user.id,company_id:state.profile.company_id,scenario_id:id,status:"started",transcript:[],voice_mode:false}).select().single();if(error){toast(error.message);return}state.session={...data,scenario:s};state.messages=[];await saveSession();state.view="training";trainingChat();try{const opening=await aiClientReply("",true);state.messages.push({speaker:"client",content:opening});await saveSession();trainingChat()}catch(e){console.error("chat-client opening:",e);trainingChat();toast("Не удалось получить первую реплику AI-клиента: "+(e.message||"ошибка"))}}

async function saveSession(){if(!state.session)return;const {error}=await sb.from("saletrening_sessions").update({transcript:state.messages,updated_at:new Date().toISOString()}).eq("id",state.session.id).eq("employee_id",state.user.id);if(error)console.error("saveSession:",error)}
async function aiClientReply(userMessage,opening=false){if(!state.session?.scenario)throw new Error("Нет активной тренировки");const {data,error}=await sb.auth.getSession();if(error||!data?.session?.access_token)throw new Error("Сессия авторизации истекла");const settings=state.clientSettings||state.client_settings||state.session.client_settings||state.session.scenario.client_settings||state.session.scenario.clientSettings||state.session.scenario.ai_settings||state.session.scenario.settings||{};const objections=state.clientObjections||state.client_objections||state.session.objections||state.session.client_objections||state.session.scenario.objections||state.session.scenario.client_objections||[];const r=await fetch(SUPABASE_URL+"/functions/v1/chat-client",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+data.session.access_token},body:JSON.stringify({session_id:state.session.id,scenario_id:state.session.scenario.id,message:opening?"":userMessage,opening,transcript:state.messages,scenario:state.session.scenario,client_settings:settings,objections,cold_call:state.view==="coldcall"?{character:coldCall.character||"Лояльный",facts:coldCall.facts||"",voice:coldCall.voice||"filipp",difficulty:coldCall.difficulty||"Средний"}:null})/* CLIENT_SETTINGS_RUNTIME_V2 */,cache:"no-store"});const raw=await r.text();let j=null;try{j=raw?JSON.parse(raw):null}catch(_){}if(!r.ok)throw new Error(j?.error||j?.message||raw||( "HTTP "+r.status));const reply=j?.reply||j?.message||j?.content||j?.text;if(!reply)throw new Error("AI не вернул реплику клиента");return reply}

async function finishTraining(){if(!state.session)return;const sessionId=state.session.id;await saveSession();try{const {data,error}=await sb.auth.getSession();if(error||!data?.session?.access_token){toast("Сессия авторизации истекла. Войдите снова.");return}const r=await fetch(SUPABASE_URL+"/functions/v1/evaluate-session-v3",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+data.session.access_token},body:JSON.stringify({session_id:sessionId}),cache:"no-store"});const raw=await r.text();let j=null;try{j=raw?JSON.parse(raw):null}catch(_){}if(!r.ok)toast("Тренировка сохранена. AI: "+(j?.error||j?.message||raw||( "HTTP "+r.status)));else if(j?.configured===false)toast("Тренировка сохранена. AI-ключ не настроен.");else toast("AI-анализ завершён")}catch(e){console.error(e);toast("Тренировка сохранена. AI: "+(e.message||"ошибка"))}finally{state.session=null;await loadAll();state.view="progress";render()}}

<script>
(function(){
  'use strict';
  async function startApp(){
    try{
      if(typeof sb==='undefined'||!sb?.auth)throw new Error('Supabase client не загрузился');

      const hash=new URLSearchParams((location.hash||'').replace(/^#/,''));
      const params=new URLSearchParams(location.search);
      const recoveryFromUrl=params.get('reset')==='1' || hash.get('type')==='recovery';

      sb.auth.onAuthStateChange((event,session)=>{
        if(event==='PASSWORD_RECOVERY'){
          state.recoveryMode=true;
          passwordRecoveryScreen();
          return;
        }
        if(event==='SIGNED_OUT' && state.recoveryMode){
          state.recoveryMode=false;
        }
      });

      const r=await sb.auth.getSession();
      const session=r?.data?.session;

      if(recoveryFromUrl){
        state.recoveryMode=true;
        passwordRecoveryScreen();
        return;
      }

      const inviteToken = params.get("invite") || localStorage.getItem("saletrening_invite_token") || "";
      const inviteRedirect = hash.get("type") === "invite";
      if(inviteToken && (session?.user || inviteRedirect)){
        if(inviteToken)localStorage.setItem("saletrening_invite_token",inviteToken);
        authScreen("register");
        return;
      }
      if(session?.user) await boot(session.user);
      else authScreen();
    }catch(e){
      console.error('[SaleTrening] bootstrap failed',e);
      if(typeof showFatal==='function')showFatal(e?.message||String(e));
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',startApp,{once:true});
  else startApp();
})();
</script>
