n h3{margin:0}.scenario-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.scenario{display:flex;flex-direction:column;gap:12px;min-height:205px}.scenario .grow{flex:1}.scenario-title{font-size:17px;font-weight:800;margin:10px 0 6px}.tag{display:inline-block;background:#f0edff;color:#5b40db;border-radius:999px;padding:5px 8px;font-size:11px;margin-right:5px}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick{border:1px solid var(--line);background:#fff;border-radius:15px;padding:15px;text-align:left}.progress-card{display:flex;align-items:center;gap:18px}.ring{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--p) var(--v),#ececf3 0);position:relative}.ring:after{content:"";position:absolute;inset:8px;background:#fff;border-radius:50%}.ring b{position:relative;z-index:1;font-size:18px}.bar{height:8px;border-radius:99px;background:#eeeef3}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:99px}.chat{height:560px;display:grid;grid-template-rows:1fr auto;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.messages{padding:20px;overflow:auto;background:#fafaff}.msg{max-width:78%;padding:12px 14px;border-radius:15px;margin:8px 0;line-height:1.45}.msg.client{background:#fff;border:1px solid var(--line)}.msg.manager{background:#eeeaff;margin-left:auto}.composer{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)}.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}.voice{width:46px;border:1px solid var(--line);border-radius:12px;background:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-weight:650}.empty{padding:40px;text-align:center;color:var(--muted);background:#ff <body><div id="root"></div><div id="toast" class="toast hidden"></div><script>
const SUPABASE_URL="https://svxykakyrloqzloerygb.supabase.co";const SUPABASE_KEY="sb_publishable_r7wu9xAgaiIZBTg4tBiJvQ_CVKHaUoi";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let state={user:null,profile:null,company:null,view:"home",scenarios:[],session:null,messages:[],stats:null,team:[],history:[],report:null};const $=id=>document.getElementById(id);function toast(t){$("toast").textContent=t;$("toast").classList.remove("hidden");setTimeout(()=>$("toast").classList.add("hidden"),2800)}function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}function roleName(r){return({employee:"Менеджер",manager:"Менеджер",director:"Руководитель",admin:"Администратор"})[r]||r}
function authScreen(){$("root").innerHTML=`<div class="auth"><div class="auth-card"><div class="auth-brand"><div class="logo"><div class="logo-b">S</div>SaleTrening</div><span class="auth-badge">AI SALES COACH</span></div><h1>Тренируй продажи.<br>Продавай увереннее.</h1><div class="sub">Практика переговоров с AI-клиентом, разбор ошибок и понятная статистика прогресса.</div><div class="field"><label>Имя</label><input id="first" placeholder="Дмитрий"></div><div class="field"><label>Компания <span class="muted">(для новой организации)</span></label><input id="company" placeholder="Моя компания"></div><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@company.ru"></div><div class="field"><label>Пароль</label><input id="pass" type="password" placeholder="Минимум 6 символов"></div><div class="auth-actions"><button class="primary" onclick="signUp()">Создать аккаунт</button><button class="secondary" onclick="signIn()">Войти</button></div><div class="auth-note">При регистрации с названием компании создаётся новая организация, а первый пользователь становится руководителем.</div></div></div>`}async function signUp(){const email=$("email").value.trim(),password=$("pass").value,first=$("first").value.trim(),company=$("company").value.trim();if(!email||!password){toast("Заполни email и пароль");return}const {data,error}=await sb.auth.signUp({email,password,options:{data:{first_name:first,company_name:company}}});if(error){toast(error.message);return}if(!data.session){toast("Проверь почту для подтверждения аккаунта")}}async function signIn(){const {error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});if(error)toast(error.message)}let bootPromise=null,bootUserId=null;async function boot(user){if(!user?.id)return;if(bootPromise&&bootUserId===user.id)return bootPromise;bootUserId=user.id;bootPromise=(async()=>{state.user=user;let p=null,error=null;for(let attempt=0;attempt<5;attempt++){const result=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();p=result.data;error=result.error;if(p)break;if(error&&error.code!=="PGRST116")throw error;if(attempt<4)await new Promise(resolve=>setTimeout(resolve,250*(attempt+1)))}if(!p)throw new Error("Профиль не найден после ожидания создания.");state.profile=p;if(p.company_id){let c=await sb.from("companies").select("*").eq("id",p.company_id).single();state.company=c.data}await loadAll();render()})();try{return await bootPromise}catch(e){console.error("auth bootstrap:",e);state.user=null;state.profile=null;state.company=null;toast(e.message||"Не удалось загрузить профиль");authScreen()}finally{if(bootUserId===user.id){bootPromise=null;bootUserId=null}}}
async function loadAll(){let q=await sb.from("saletrening_scenarios").select("*").eq("active",true).order("id");state.scenarios=q.data||[];let s=await sb.from("my_training_stats").select("*").eq("employee_id",state.user.id).maybeSingle();state.stats=s.data||{completed_sessions:0,avg_score:0,best_score:0,active_sessions:0};const h=await sb.from("saletrening_sessions").select("id,scenario_id,status,total_score,ai_summary,created_at,completed_at").eq("employee_id",state.user.id).order("created_at",{ascending:false}).limit(50);state.history=h.data||[];if(["director","admin"].includes(state.profile.role)&&state.profile.company_id){let t=await sb.from("manager_team_stats").select("*").eq("company_id",state.profile.company_id).order("avg_score",{ascending:false});state.team=t.data||[]}}
function nav(v,t,icon){return `<button class="${state.view===v?"active":""}" onclick="state.view='${v}';page()"><span class="nav-icon">${icon}</span>${t}</button>`}function render(){if(!state.user){authScreen();return}$('root').innerHTML=`<div class="shell"><aside class="side"><div class="logo"><div class="logo-b">S</div>SaleTrening</div><div class="nav">${nav("home","Главная","⌂")}${nav("training","Тренировки","◉")}${nav("coldcall","Холодный звонок","☎")}${nav("scenarios","Сценарии","▣")}${nav("progress","Мой прогресс","↗")}${nav("history","История","◷")}${nav("ai","AI-наставник","✦")}${["director","admin"].includes(state.profile.role)?nav("team","Команда","♙")+nav("analytics","Аналитика","▥"):""}</div><div class="side-bottom"><div class="user-mini">${esc(state.profile.first_name||state.user.email)}<br>${roleName(state.profile.role)}${state.company?" · "+esc(state.company.name):""}</div><button class="secondary" style="width:100%" onclick="logout()">Выйти</button></div></aside><main class="content"><div id="page"></div></main></div>`;page()}
function setPageHTML(el,value){try{if(value&&typeof value.then==='function'){value.then(html=>el.innerHTML=html).catch(err=>{console.error(err);el.innerHTML='<div class="empty">Не удалось загрузить страницу.</div>'})}else el.innerHTML=value}catch(err){console.error(err);el.innerHTML='<div class="empty">Ошибка отображения страницы.</div>'}}
function page(){let p=$("page");if(!p)return;if(state.session&&state.view!=="coldcall"){trainingChat();return}if(state.report){setPageHTML(p,reportPage());return}if(state.view==="home")setPageHTML(p,home());else if(state.view==="training")setPageHTML(p,trainingList());else if(state.view==="coldcall")setPageHTML(p,coldCallHome());else if(state.view==="scenarios")setPageHTML(p,scenarios());else if(state.view==="progress")setPageHTML(p,progress());else if(state.view==="history")setPageHTML(p,historyPage());else if(state.view==="team")setPageHTML(p,team());else if(state.view==="analytics")setPageHTML(p,analytics());else p.innerHTML=aiCoach()}
function home(){let s=state.stats||{},pct=Math.min(100,(Number(s.completed_sessions)||0)*10);return `<div class="top"><div><h2>Добро пожаловать, ${esc(state.profile.first_name||"коллега")}</h2><div class="muted">Сегодняшний прогресс и быстрый старт</div></div><span class="pill">${roleName(state.profile.role)}</span></div><div class="hero"><div class="hero-card"><h3>Готов прокачать продажи?</h3><div class="muted">Выбери сценарий и проведи короткие переговоры с AI-клиентом. После тренировки получишь оценку и рекомендации.</div><div style="margin-top:18px"><button class="primary" onclick="state.view='training';page()">Начать тренировку ></button></div><div class="hero-robot">🤖</div></div><div class="card progress-card"><div class="ring" style="--v:${pct}%"><b>${pct}%</b></div><div><div class="muted">Дневная цель</div><strong style="font-size:18px">${s.completed_sessions||0} тренировок</strong></div></div></div><div class="grid"><div class="card"><div class="metric-label">Тренировок</div><div class="metric">${s.completed_sessions||0}</div></div><div class="card"><div class="metric-label">Средний балл</div><div class="metric">${s.avg_score||0}</div></div><div class="card"><div class="metric-label">Лучший результат</div><div class="metric">${s.best_score||0}</div></div><div class="card"><div class="metric-label">Активных</div><div class="metric">${s.active_sessions||0}</div></div></div><div class="section"><div class="section-head"><h3>Быстрый старт</h3><button class="secondary" onclick="state.view='training';page()">Все тренировки</button></div>${scenarioCards(state.scenarios.slice(0,3))}</div>`}function scenarioCards(arr){if(!arr.length)return `<div class="empty">Сценариев пока нет.</div>`;return `<div class="scenario-grid">${arr.map(s=>`<div class="card scenario"><div><span class="tag">${esc(s.difficulty||"Средняя")}</span><span class="tag">${esc(s.client_mood||"Нейтральный")}</span></div><div class="grow"><div class="scenario-title">${esc(s.title)}</div><div class="muted">${esc(s.description||s.objective||"Практика продаж")}</div></div><button class="primary" onclick="startTraining(${s.id})">Начать тренировку</button></div>`).join("")}</div>`}function trainingList(){return `<div class="top"><div><h2>Тренировки</h2><div class="muted">Выбери ситуацию и начни живой диалог</div></div></div>${scenarioCards(state.scenarios)}`}function scenarios(){return `<div class="top"><div><h2>Сценарии</h2><div class="muted">Библиотека ситуаций для команды</div></div></div>${scenarioCards(state.scenarios)}`}function progress(){let s=state.stats||{};return `<div class="top"><div><h2>Мой прогресс</h2><div class="muted">Результаты тренировок из Supabase</div></div></div><div class="grid"><div class="card"><div class="metric-label">Средний балл</div><div class="metric">${s.avg_score||0}</div></div><div class="card"><div class="metric-label">Лучший</div><div class="metric">${s.best_score||0}</div></div><div class="card"><div class="metric-label">Завершено</div><div class="metric">${s.completed_sessions||0}</div></div><div class="card"><div class="metric-label">Активные</div><div class="metric">${s.active_sessions||0}</div></div></div></div>`}
async function showTrainingReport(id){try{const {data,error}=await sb.from("saletrening_sessions").select("id,employee_id,scenario_id,status,total_score,ai_summary,feedback,transcript,ai_evaluation,created_at,completed_at,duration_seconds").eq("id",id).single();if(error)throw error;const {data:score,error:scoreError}=await sb.from("session_scores").select("overall_score,discovery_score,objection_score,value_score,closing_score,communication_score,next_step_score,strengths,weaknesses,recommendations").eq("session_id",id).maybeSingle();if(scoreError)throw scoreError;state.report={session:data,score:score||{}};state.view="history";page()}catch(e){console.error(e);toast("Не удалось загрузить отчёт тренировки")}}
function reportItems(v){if(Array.isArray(v))return v.filter(Boolean);if(typeof v==="string"&&v.trim())return [v.trim()];return []}function reportPage(){const r=state.report||{},x=r.session||{},s=r.score||{},to20=n=>Math.max(1,Math.min(20,Math.round((Number(n)||0)/5))),skills=[["Работа с возражениями",to20(s.objection_score)],["Презентация продукта",to20(s.value_score)],["Дожим / закрытие сделки",to20(s.closing_score)],["Вовлечённость клиента в разговор / коммуникация",to20(s.communication_score)],["Выявление потребности",to20(s.discovery_score)]],total=skills.reduce((a,v)=>a+v[1],0),names={};state.scenarios.forEach(z=>names[z.id]=z.title);const list=v=>Array.isArray(v)&&v.length?`<ul>${v.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:'<div class="muted">Нет данных.</div>',tr=Array.isArray(x.transcript)?x.transcript:[];return `<div class="top"><div><h2>Отчёт тренировки</h2><div class="muted">${esc(names[x.scenario_id]||"Тренировка")} · ${new Date(x.created_at).toLocaleString("ru-RU")}</div></div><button class="secondary" onclick="state.report=null;page()">← Назад</button></div><div class="card" style="text-align:center"><div class="muted">ОБЩИЙ БАЛЛ</div><div class="metric" style="font-size:54px">${total} / 100</div></div><div class="section card"><h3>Оценка навыков</h3>${skills.map(v=>`<div style="margin:18px 0;display:flex;justify-content:space-between"><span>${v[0]}</span><b>${v[1]} / 20</b></div>`).join("")}</div><div class="section card"><h3>Анализ тренировки</h3><b>🟢 Сильные стороны</b>${list(s.strengths)}<b>🔴 Слабые стороны</b>${list(s.weaknesses)}<b>💡 Рекомендации</b>${list(s.recommendations)}${x.ai_summary?`<p class="muted">${esc(x.ai_summary)}</p>`:""}</div><div class="section card"><h3>Полный диалог</h3>${tr.length?tr.map(m=>`<div class="msg ${m.speaker==='manager'?'manager':'client'}"><b>${m.speaker==='manager'?'Менеджер':'Клиент'}:</b> ${esc(m.content||'')}</div>`).join(''):'<div class="empty">Полный диалог не сохранён.</div>'}</div>`}
function team(){return `<div class="top"><div><h2>Команда</h2></div></div><div class="empty">Данные команды загружаются из Supabase.</div>`}function analytics(){return `<div class="top"><div><h2>Аналитика руководителя</h2></div></div><div class="empty">Данные аналитики загружаются из Supabase.</div>`}function aiCoach(){return `<div class="top"><div><h2>AI-наставник</h2></div></div><div class="card"><p class="muted">Персональный разбор тренировок.</p></div>`}
