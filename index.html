splay:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.section h3{margin:0}.scenario-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.scenario{display:flex;flex-direction:column;gap:12px;min-height:205px}.scenario .grow{flex:1}.scenario-title{font-size:17px;font-weight:800;margin:10px 0 6px}.tag{display:inline-block;background:#f0edff;color:#5b40db;border-radius:999px;padding:5px 8px;font-size:11px;margin-right:5px}.quick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.quick{border:1px solid var(--line);background:#fff;border-radius:15px;padding:15px;text-align:left}.quick strong{display:block;margin-bottom:4px}.quick:hover{border-color:#cfc5ff;background:#fbfaff}.progress-card{display:flex;align-items:center;gap:18px}.ring{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--p) var(--v),#ececf3 0);position:relative}.ring:after{content:"";position:absolute;inset:8px;background:#fff;border-radius:50%}.ring b{position:relative;z-index:1;font-size:18px}.bar{height:8px;border-radius:99px;background:#eeeef3}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--p),var(--p2));border-radius:99px}.chat{height:560px;display:grid;grid-template-rows:1fr auto;background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}.messages{padding:20px;overflow:auto;background:#fafaff}.msg{max-width:78%;padding:12px 14px;border-radius:15px;margin:8px 0;line-height:1.45}.msg.client{background:#fff;border:1px solid var(--line)}.msg.manager{background:#eeeaff;margin-left:auto}.composer{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)}.composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}.voice{width:46px;border:1px solid var(--line);border-radius:12px;background:#fff}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.table th{color:var(--muted);font-weight:650}.empty{padding:40px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}.toast{position:fixed;right:20px;bottom:20px;background:#191827;color:#fff;padding:12px 16px;border-radius:12px;z-index:20;box-shadow:0 12px 30px #0003}

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
/* YANDEX_SPEECHKIT_TTS_V1 */
(()=>{
  const nativeSpeechSynthesis=window.speechSynthesis;
  if(!nativeSpeechSynthesis||!window.supabase)return;
  let yandexAudio=null;
  let yandexBusy=false;
  const originalCancel=nativeSpeechSynthesis.cancel.bind(nativeSpeechSynthesis);
  const originalSpeak=nativeSpeechSynthesis.speak.bind(nativeSpeechSynthesis);
  nativeSpeechSynthesis.cancel=()=>{try{if(yandexAudio){yandexAudio.pause();yandexAudio.currentTime=0;yandexAudio=null}}catch{};yandexBusy=false;originalCancel()};
  nativeSpeechSynthesis.speak=async(utterance)=>{
    const text=String(utterance?.text||'').trim();
    if(!text)return;
    try{utterance?.onstart?.({type:'start'});yandexBusy=true;
      const {data,error}=await sb.functions.invoke('yandex-tts',{body:{text,voice:(window.coldCall?.voice||'marina'),role:'friendly',speed:0.96,pitchShift:0}});
      if(error)throw error;
      const b64=data?.audio_base64;if(!b64)throw new Error('Yandex TTS returned no audio');
      const bin=atob(b64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      if(yandexAudio){try{yandexAudio.pause()}catch{}}
      yandexAudio=new Audio(URL.createObjectURL(new Blob([bytes],{type:data?.mime||'audio/wav'})));
      yandexAudio.onended=()=>{yandexBusy=false;try{utterance?.onend?.({type:'end'})}catch{}};
      yandexAudio.onerror=()=>{yandexBusy=false;try{utterance?.onerror?.({type:'error'})}catch{}};
      try{await yandexAudio.play()}catch(playError){
        console.warn('Yandex SpeechKit audio playback failed, using browser TTS fallback:',playError);
        yandexBusy=false;
        try{originalSpeak(utterance)}catch{}
        return;
      }
    }catch(e){
      yandexBusy=false;console.error('Yandex SpeechKit TTS:',e);
      try{originalSpeak(utterance)}catch{}
      try{utterance?.onerror?.({type:'error',error:e})}catch{}
    }
  };
})();

let state={user:null,profile:null,company:null,view:"home",scenarios:[],session:null,messages:[],stats:null,team:[],history:[]};

function esc(s=""){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function roleName(r){return({employee:"Менеджер",manager:"Менеджер",director:"Руководитель",admin:"Администратор"})[r]||r}
function authScreen(){$("root").innerHTML=`<div class="auth"><div class="auth-card"><div class="auth-brand"><div class="logo"><div class="logo-b">S</div>SaleTrening</div><span class="auth-badge">AI SALES COACH</span></div><h1>Тренируй продажи.<br>Продавай увереннее.</h1><div class="sub">Практика переговоров с AI-клиентом, разбор ошибок и понятная статистика прогресса.</div><div class="field"><label>Имя</label><input id="first" placeholder="Дмитрий"></div><div class="field"><label>Компания <span class="muted">(для новой организации)</span></label><input id="company" placeholder="Моя компания"></div><div class="field"><label>Email</label><input id="email" type="email" placeholder="you@company.ru"></div><div class="field"><label>Пароль</label><input id="pass" type="password" placeholder="Минимум 6 символов"></div><div class="auth-actions"><button class="primary" onclick="signUp()">Создать аккаунт</button><button class="secondary" onclick="signIn()">Войти</button></div><div class="auth-note">При регистрации с названием компании создаётся новая организация, а первый пользователь становится руководителем.</div></div></div>`}
async function signUp(){const email=$("email").value.trim(),password=$("pass").value,first=$("first").value.trim(),company=$("company").value.trim();if(!email||!password){toast("Заполни email и пароль");return}const {data,error}=await sb.auth.signUp({email,password,options:{data:{first_name:first,company_name:company}}});if(error){toast(error.message);return}if(!data.session){toast("Проверь почту для подтверждения аккаунта")}}
async function signIn(){const {data,error}=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("pass").value});if(error){toast(error.message);return}}
let bootPromise=null,bootUserId=null;
async function boot(user){if(!user?.id)return;if(bootPromise&&bootUserId===user.id)return bootPromise;bootUserId=user.id;bootPromise=(async()=>{state.user=user;let p=null,error=null;for(let attempt=0;attempt<5;attempt++){const result=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();p=result.data;error=result.error;if(p)break;if(error&&error.code!=="PGRST116")throw error;if(attempt<4)await new Promise(resolve=>setTimeout(resolve,250*(attempt+1)))}if(!p)throw new Error("Профиль не найден после ожидания создания.");state.profile=p;if(p.company_id){let c=await sb.from("companies").select("*").eq("id",p.company_id).single();state.company=c.data}await loadAll();render()})();try{return await bootPromise}catch(e){console.error("auth bootstrap:",e);state.user=null;state.profile=null;state.company=null;toast(e.message||"Не удалось загрузить профиль");authScreen()}finally{if(bootUserId===user.id){bootPromise=null;bootUserId=null}}}
async function loadAll(){let q=await sb.from("saletrening_scenarios").select("*").eq("active",true).order("id");state.scenarios=q.data||[];let s=await sb.from("my_training_stats").select("*").eq("employee_id",state.user.id).maybeSingle();state.stats=s.data||{completed_sessions:0,avg_score:0,best_score:0,active_sessions:0};const h=await sb.from("saletrening_sessions").select("id,scenario_id,status,total_score,ai_summary,created_at,completed_at").eq("employee_id",state.user.id).order("created_at",{ascending:false}).limit(50);state.history=h.data||[];if(["director","admin"].includes(state.profile.role)&&state.profile.company_id){let t=await sb.from("manager_team_stats").select("*").eq("company_id",state.profile.company_id).order("avg_score",{ascending:false});state.team=t.data||[]}}
function nav(v,t,icon){return `<button class="${state.view===v?"active":""}" onclick="state.view='${v}';page()"><span class="nav-icon">${icon}</span>${t}</button>`}
function render(){if(!state.user){authScreen();return}$('root').innerHTML=`<div class="shell"><aside class="side"><div class="logo"><div class="logo-b">S</div>SaleTrening</div><div class="nav">${nav("home","Главная","⌂")}${nav("training","Тренировки","◉")}${nav("coldcall","Холодный звонок","☎")}${nav("scenarios","Сценарии","▣")}${nav("progress","Мой прогресс","↗")}${nav("history","История","◷")}${nav("ai","AI-наставник","✦")}${["director","admin"].includes(state.profile.role)?nav("team","Команда","♙")+nav("analytics","Аналитика","▥"):""}</div><div class="side-bottom"><div class="user-mini">${esc(state.profile.first_name||state.user.email)}<br>${roleName(state.profile.role)}${state.company?" · "+esc(state.company.name):""}</div><button class="secondary" style="width:100%" onclick="logout()">Выйти</button></div></aside><main class="content"><div id="page"></div></main></div>`;page()}
function page(){let p=$("page");if(!p)return;if(state.session){trainingChat();return}if(state.view==="home")p.innerHTML=home();else if(state.view==="training")p.innerHTML=trainingList();else if(state.view==="coldcall")p.innerHTML=coldCallHome();else if(state.view==="scenarios")p.innerHTML=scenarios();else if(state.view==="progress")p.innerHTML=progress();else if(state.view==="history")p.innerHTML=historyPage();else if(state.view==="team")p.innerHTML=team();else if(state.view==="analytics")p.innerHTML=analytics();else p.innerHTML=aiCoach()}
function home(){let s=state.stats||{},pct=Math.min(100,(Number(s.completed_sessions)||0)*10);return `<div class="top"><div><h2>Добро пожаловать, ${esc(state.profile.first_name||"коллега")}</h2><div class="muted">Сегодняшний прогресс и быстрый старт</div></div><span class="pill">${roleName(state.profile.role)}</span></div><div class="hero"><div class="hero-card"><h3>Готов прокачать продажи?</h3><div class="muted">Выбери сценарий и проведи короткие переговоры с AI-клиентом. После тренировки получишь оценку и рекомендации.</div><div style="margin-top:18px"><button class="primary" onclick="state.view='training';page()">Начать тренировку ></button></div><div class="hero-robot">🤖</div></div><div class="card progress-card"><div class="ring" style="--v:${pct}%"><b>${pct}%</b></div><div><div class="muted">Дневная цель</div><strong style="font-size:18px">${s.completed_sessions||0} тренировок</strong><div class="muted" style="margin-top:5px">Продолжай практику каждый день</div></div></div></div><div class="grid"><div class="card"><div class="metric-label">Тренировок</div><div class="metric">${s.completed_sessions||0}</div></div><div class="card"><div class="metric-label">Средний балл</div><div class="metric">${s.avg_score||0}</div></div><div class="card"><div class="metric-label">Лучший результат</div><div class="metric">${s.best_score||0}</div></div><div class="card"><div class="metric-label">Активных</div><div class="metric">${s.active_sessions||0}</div></div></div><div class="section"><div class="section-head"><h3>Быстрый старт</h3><button class="secondary" onclick="state.view='training';page()">Все тренировки</button></div>${scenarioCards(state.scenarios.slice(0,3))}</div><div class="section"><div class="section-head"><h3>Что можно улучшать</h3></div><div class="quick-grid"><button class="quick" onclick="state.view='training';page()"><strong>🎯 Выявление потребностей</strong><span class="muted">Задавай сильные вопросы</span></button><button class="quick" onclick="state.view='training';page()"><strong>🛡️ Работа с возражениями</strong><span class="muted">Не спорь — раскрывай причину</span></button><button class="quick" onclick="state.view='ai';page()"><strong>✦ AI-наставник</strong><span class="muted">Разбери свой подход</span></button></div></div>`}
function scenarioCards(arr){if(!arr.length)return `<div class="empty">Сценариев пока нет.</div>`;return `<div class="scenario-grid">${arr.map(s=>`<div class="card scenario"><div><span class="tag">${esc(s.difficulty||"Средняя")}</span><span class="tag">${esc(s.client_mood||"Нейтральный")}</span></div><div class="grow"><div class="scenario-title">${esc(s.title)}</div><div class="muted">${esc(s.description||s.objective||"Практика продаж")}</div></div><button class="primary" onclick="startTraining(${s.id})">Начать тренировку</button></div>`).join("")}</div>`}

function scenarios(){return `<div class="top"><div><h2>Сценарии</h2><div class="muted">Библиотека ситуаций для команды</div></div></div>${scenarioCards(state.scenarios)}`}
function progress(){let s=state.stats||{};return `<div class="top"><div><h2>Мой прогресс</h2><div class="muted">Результаты тренировок из Supabase</div></div></div><div class="grid"><div class="card"><div class="metric-label">Средний балл</div><div class="metric">${s.avg_score||0}</div></div><div class="card"><div class="metric-label">Лучший</div><div class="metric">${s.best_score||0}</div></div><div class="card"><div class="metric-label">Завершено</div><div class="metric">${s.completed_sessions||0}</div></div><div class="card"><div class="metric-label">Активные</div><div class="metric">${s.active_sessions||0}</div></div></div><div class="section card"><h3>Следующий шаг</h3><p class="muted">Запусти тренировку, проведи диалог и получи AI-анализ.</p><button class="primary" onclick="state.view='training';page()">Начать тренировку</button></div>`}
function historyPage(){const names={};state.scenarios.forEach(s=>names[s.id]=s.title);return `<div class="top"><div><h2>История тренировок</h2><div class="muted">Последние 50 тренировок и результаты AI</div></div></div><div class="card" style="padding:0;overflow:hidden">${state.history.length?`<table class="table"><thead><tr><th>Дата</th><th>Сценарий</th><th>Статус</th><th>Балл</th><th>AI-разбор</th></tr></thead><tbody>${state.history.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString("ru-RU")}</td><td>${esc(names[x.scenario_id]||"Тренировка")}</td><td>${x.status==="completed"?"Завершена":"В процессе"}</td><td><b>${x.total_score??"—"}</b></td><td>${esc(x.ai_summary||"—")}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">История пока пуста.</div>`}</div>`}
function team(){if(!state.team.length)return `<div class="top"><div><h2>Команда</h2><div class="muted">В организации пока нет данных о тренировках</div></div></div><div class="empty">Завершённых тренировок команды пока нет. Здесь появится командная статистика после первых результатов.</div>`;return `<div class="top"><div><h2>Команда</h2><div class="muted">${state.team.length} участников</div></div></div><div class="card"><table class="table"><thead><tr><th>Сотрудник</th><th>Тренировки</th><th>Средний</th><th>Выявление</th><th>Возражения</th><th>Закрытие</th></tr></thead><tbody>${state.team.map(x=>`<tr><td>${esc(x.employee_name)}</td><td>${x.sessions_count}</td><td><b>${x.avg_score}</b></td><td>${x.discovery_score}</td><td>${x.objection_score}</td><td>${x.closing_score}</td></tr>`).join("")}</tbody></table></div>`}
function avgSkill(k){if(!state.team.length)return 0;return Math.round(state.team.reduce((a,x)=>a+(x[k]||0),0)/state.team.length)}
function weakest(){let a=[["Выявление",avgSkill("discovery_score")],["Возражения",avgSkill("objection_score")],["Ценность",avgSkill("value_score")],["Закрытие",avgSkill("closing_score")]];a.sort((x,y)=>x[1]-y[1]);return a[0][0]}
function skillBar(t,n){n=Math.max(0,Math.min(100,Number(n)||0));return `<div style="margin:16px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${t}</span><b>${n}</b></div><div class="bar"><i style="width:${n}%"></i></div></div>`}
function analytics(){if(!state.team.length)return `<div class="top"><div><h2>Аналитика</h2><div class="muted">Данные появятся после тренировок команды</div></div></div><div class="empty">Пока нет завершённых тренировок.</div>`;let avg=Math.round(state.team.reduce((a,x)=>a+(x.avg_score||0),0)/state.team.length);return `<div class="top"><div><h2>Аналитика руководителя</h2><div class="muted">Командная эффективность</div></div><span class="pill">Средний балл ${avg}</span></div><div class="grid"><div class="card"><div class="metric-label">Средний команды</div><div class="metric">${avg}</div></div><div class="card"><div class="metric-label">Лучший менеджер</div><div class="metric" style="font-size:20px">${esc(state.team[0].employee_name)}</div></div><div class="card"><div class="metric-label">Тренировок</div><div class="metric">${state.team.reduce((a,x)=>a+x.sessions_count,0)}</div></div><div class="card"><div class="metric-label">Слабое место</div><div class="metric" style="font-size:20px">${weakest()}</div></div></div><div class="section card"><h3>Навыки команды</h3>${skillBar("Выявление потребности",avgSkill("discovery_score"))}${skillBar("Работа с возражениями",avgSkill("objection_score"))}${skillBar("Ценность",avgSkill("value_score"))}${skillBar("Закрытие",avgSkill("closing_score"))}</div>`}
function aiCoach(){return `<div class="top"><div><h2>AI-наставник</h2><div class="muted">Персональный разбор и план развития</div></div></div><div class="card"><h3>Что анализирует SaleTrening</h3><ul class="muted"><li>выявление потребностей</li><li>работу с возражениями</li><li>ценность и аргументацию</li><li>закрытие и следующий шаг</li><li>коммуникацию и структуру диалога</li></ul><p class="muted">AI-наставник работает на данных ваших тренировок и AI-разборов.</p></div>`}

/* COLD_CALL_MODE_V1 */
function coldCallScenario(difficulty="Средний"){const d=String(difficulty).toLowerCase().includes("слож")?"слож":"сред";return state.scenarios.find(x=>String(x.title).toLowerCase().includes("холодный звонок")&&String(x.difficulty||"").toLowerCase().includes(d))||state.scenarios.find(x=>String(x.title).toLowerCase().includes("холодный звонок"))||{id:0,title:"Холодный звонок",description:"Выход на ЛПР и начало холодного разговора",difficulty:difficulty,client_role:"Потенциальный клиент",client_mood:difficulty==="Сложный"?"Занят, скептически настроен":"Сдержанный",objective:"Заинтересовать клиента и договориться о следующем шаге"};}
function coldCallHome(){return `<div class="top"><div><h2>Холодный звонок</h2><div class="muted">Голосовая тренировка в режиме телефонного разговора</div></div></div><div class="card" style="max-width:900px;margin:auto"><h3>Настройка клиента</h3><div class="field" style="margin-top:14px"><label>Характер клиента</label><select id="coldCharacter"><option value="Лояльный">Лояльный</option><option value="Скептик">Скептик</option><option value="Грубит">Грубит</option><option value="Занятой">Занятой</option><option value="Аналитик">Аналитик</option></select></div><div class="field" style="margin-top:14px"><label>Голос клиента</label><select id="coldVoice"><option value="filipp">Филипп — мужской</option><option value="ermil">Ермил — мужской</option><option value="zahar">Захар — мужской</option><option value="alexander">Александр — мужской</option><option value="kirill">Кирилл — мужской</option><option value="anton">Антон — мужской</option></select></div><div class="field" style="margin-top:14px"><label>Факты о клиенте <span class="muted">(необязательно)</span></label><textarea id="coldFacts" rows="4" placeholder="Например: сейчас покупает у конкурента, нужен объём 100 шин, важна гарантия..."></textarea></div><h3 style="margin-top:22px">Выберите уровень сложности</h3><div class="grid" style="margin-top:18px"><div class="card"><h3>Средний</h3><p class="muted">Клиент более лоялен, идёт на контакт, слушает и задаёт вопросы.</p><button class="primary" onclick="startColdCall('Средний')">☎ Начать</button></div><div class="card"><h3>Сложный</h3><p class="muted">Клиент менее охотно идёт на контакт и требует сильной аргументации.</p><button class="primary" onclick="startColdCall('Сложный')">☎ Начать</button></div></div><p class="muted" style="margin-top:18px">Вы говорите первым. Лимит звонка — 10 минут.</p></div>`}
let coldCall={recognition:null,listening:false,silenceTimer:null,silenceNudged:false,startedAt:0,processing:false,difficulty:"Средний",timer:null,character:"Лояльный",facts:"",voice:"filipp"};
async function startColdCall(difficulty="Средний"){const s=coldCallScenario(difficulty);if(!s.id){toast("Сценарий «Холодный звонок» не найден в базе");return}coldCall.character=$("coldCharacter")?.value||"Лояльный";coldCall.facts=$("coldFacts")?.value.trim()||"";coldCall.voice=$("coldVoice")?.value||"filipp";const payload={employee_id:state.user.id,company_id:state.profile.company_id,scenario_id:s.id,status:"started",transcript:[],voice_mode:true};let data,error;({data,error}=await sb.from("saletrening_sessions").insert(payload).select().single());if(error){toast(error.message);return}state.session={...data,scenario:s};state.messages=[];coldCall.startedAt=Date.now();coldCall.difficulty=difficulty;coldCall.silenceNudged=false;coldCall.processing=false;state.view="coldcall";trainingCallPage();setTimeout(startVoiceListening,350)}
function trainingCallPage(){const p=$("page");if(!p||!state.session)return;if(coldCall.timer)clearInterval(coldCall.timer);p.innerHTML=`<div class="top"><div><h2>Холодный звонок</h2><div class="muted">Соединение установлено · ${esc(coldCall.difficulty)}</div></div><button class="secondary" onclick="finishTraining()">Завершить и оценить</button></div><div class="call-shell"><div class="call-head"><div class="call-status" id="callStatus">Ваш ход — начинайте разговор</div><div class="call-avatar" id="callAvatar">☎</div><div class="call-name">${esc(state.session.scenario.client_role||"Клиент")}</div><div class="call-sub">Холодный звонок · ${esc(coldCall.difficulty)}</div><div class="call-timer" id="callTimer">00:00</div></div><div class="call-body"><div class="call-live"><div class="call-live-label">Последняя реплика</div><div class="call-live-text" id="callLive">Начните разговор — клиент слушает.</div></div><div class="call-controls"><button id="callMic" class="call-btn primary-call" onclick="toggleVoice()">🎙 Говорить</button><button class="call-btn end-call" onclick="finishTraining()">Завершить звонок</button></div><div class="call-hint" id="callHint">Вы говорите первым. После вашей реплики клиент ответит.</div><div class="call-transcript" id="callTranscript">${state.messages.map(m=>`<div class="msg ${m.speaker}"><b>${m.speaker==="client"?"Клиент":"Вы"}:</b> ${esc(m.content)}</div>`).join("")}</div></div></div>`;coldCall.timer=setInterval(async()=>{const el=$("callTimer");if(!el||!state.session){clearInterval(coldCall.timer);coldCall.timer=null;return}const sec=Math.floor((Date.now()-coldCall.startedAt)/1000);el.textContent=`${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;if(sec>=600&&!coldCall.processing){clearInterval(coldCall.timer);coldCall.timer=null;coldCall.processing=true;const n="У меня нет времени, мне не интересно, до свидания.";state.messages.push({speaker:"client",content:n});await saveSession();const live=$("callLive");if(live)live.textContent=n;setCallStatus("Звонок завершён",false);speakCallClient(n);setTimeout(()=>finishTraining(),2200)}},1000)}
async function speakCallClient(text){
  if(!text)return;
  try{
    const {data,error}=await sb.functions.invoke('yandex-tts',{body:{text,voice:'marina',role:'friendly',speed:0.96,pitch_shift:0}});
    if(error)throw error;
    if(!data?.audio_base64)throw new Error(data?.error||'Yandex TTS returned no audio');
    const bin=atob(data.audio_base64),bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
    const audio=new Audio(URL.createObjectURL(new Blob([bytes],{type:data?.mime||'audio/wav'})));
    audio.onended=()=>{URL.revokeObjectURL(audio.src);if(state.session&&!coldCall.processing)setTimeout(startVoiceListening,250)};
    audio.onerror=()=>{URL.revokeObjectURL(audio.src);throw new Error('Yandex audio playback failed')};
    await audio.play();
  }catch(e){
    console.error('Yandex SpeechKit TTS playback:',e);
    if('speechSynthesis' in window){
      window.speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=.96;u.pitch=1;
      u.onend=()=>{if(state.session&&!coldCall.processing)setTimeout(startVoiceListening,250)};
      window.speechSynthesis.speak(u);
    }
  }
};
window.historyPage=async function(){let q;if(['manager','director','admin'].includes(state.profile?.role)&&state.profile?.company_id)q=await sb.from('saletrening_sessions').select('id,employee_id,scenario_id,status,total_score,ai_summary,created_at,completed_at').eq('company_id',state.profile.company_id).order('created_at',{ascending:false}).limit(100);else q=await sb.from('saletrening_sessions').select('id,employee_id,scenario_id,status,total_score,ai_summary,created_at,completed_at').eq('employee_id',state.user.id).order('created_at',{ascending:false}).limit(100);const rows=q.data||[],names={};state.scenarios.forEach(z=>names[z.id]=z.title);state.history=rows;return `<div class="top"><div><h2>История тренировок</h2><div class="muted">Нажмите на тренировку, чтобы открыть полный отчёт</div></div></div><div class="card" style="padding:0;overflow:hidden">${rows.length?`<table class="table"><thead><tr><th>Дата</th><th>Менеджер</th><th>Сценарий</th><th>Статус</th><th>Балл</th></tr></thead><tbody>${rows.map(x=>`<tr onclick="showTrainingReport('${x.id}')" style="cursor:pointer"><td>${new Date(x.created_at).toLocaleString('ru-RU')}</td><td>${x.employee_id===state.user.id?esc(state.profile.first_name||state.user.email):'Менеджер'}</td><td>${esc(names[x.scenario_id]||'Тренировка')}</td><td>${x.status==='completed'?'Завершена':'В процессе'}</td><td><b>${x.total_score??'—'}</b></td></tr>`).join('')}</tbody></table>`:'<div class="empty">История пока пуста.</div>'}</div>`};
const oldPage=window.page;window.page=function(){if(state.report){$('page').innerHTML=reportPage();return}return oldPage.apply(this,arguments)};
})();
