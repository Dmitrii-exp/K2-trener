<script>
async function startTraining(id){const s=state.scenarios.find(x=>x.id===id);if(!s)return;const {data,error}=await sb.from("saletrening_sessions").insert({employee_id:state.user.id,company_id:state.profile.company_id,scenario_id:id,status:"started",transcript:[],voice_mode:false}).select().single();if(error){toast(error.message);return}state.session={...data,scenario:s};state.messages=[];await saveSession();state.view="training";trainingChat();try{const opening=await aiClientReply("",true);state.messages.push({speaker:"client",content:opening});await saveSession();trainingChat();speakClient(opening)}catch(e){console.error("chat-client opening:",e);trainingChat();toast("Не удалось получить первую реплику AI-клиента: "+(e.message||"ошибка"))}}
function trainingChat(){const p=$("page");if(!p)return;p.innerHTML=`<div class="top"><div><h2>${esc(state.session.scenario.title)}</h2><div class="muted">${esc(state.session.scenario.client_role||"Клиент")} · ${esc(state.session.scenario.difficulty||"Средняя")}</div></div><button class="secondary" onclick="finishTraining()">Завершить и оценить</button></div><div class="chat"><div id="messages" class="messages">${state.messages.map(m=>`<div class="msg ${m.speaker}"><b>${m.speaker==="client"?"Клиент":"Вы"}:</b> ${esc(m.content)}</div>`).join("")}</div><div class="composer"><button class="voice" onclick="voiceInput()" title="Голосовой ввод">🎙️</button><textarea id="msg" rows="2" placeholder="Ответьте клиенту..."></textarea><button class="primary" onclick="sendMessage()">Отправить</button></div></div>`;const messages=$("messages");if(messages)messages.scrollTop=messages.scrollHeight}
async function saveSession(){if(!state.session)return;const {error}=await sb.from("saletrening_sessions").update({transcript:state.messages,updated_at:new Date().toISOString()}).eq("id",state.session.id).eq("employee_id",state.user.id);if(error)console.error("saveSession:",error)}
async function aiClientReply(userMessage,opening=false){if(!state.session?.scenario)throw new Error("Нет активной тренировки");const {data,error}=await sb.auth.getSession();if(error||!data?.session?.access_token)throw new Error("Сессия авторизации истекла");const settings=state.clientSettings||state.client_settings||state.session.client_settings||state.session.scenario.client_settings||state.session.scenario.clientSettings||state.session.scenario.ai_settings||state.session.scenario.settings||{};const objections=state.clientObjections||state.client_objections||state.session.objections||state.session.client_objections||state.session.scenario.objections||state.session.scenario.client_objections||[];const r=await fetch(SUPABASE_URL+"/functions/v1/chat-client",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+data.session.access_token},body:JSON.stringify({session_id:state.session.id,scenario_id:state.session.scenario.id,message:opening?"":userMessage,opening,transcript:state.messages,scenario:state.session.scenario,client_settings:settings,objections,cold_call:state.view==="coldcall"?{character:coldCall.character||"Лояльный",facts:coldCall.facts||"",voice:coldCall.voice||"filipp",difficulty:coldCall.difficulty||"Средний"}:null})/* CLIENT_SETTINGS_RUNTIME_V2 */,cache:"no-store"});const raw=await r.text();let j=null;try{j=raw?JSON.parse(raw):null}catch(_){}if(!r.ok)throw new Error(j?.error||j?.message||raw||( "HTTP "+r.status));const reply=j?.reply||j?.message||j?.content||j?.text;if(!reply)throw new Error("AI не вернул реплику клиента");return reply}
function speakClient(text){if(!( "speechSynthesis" in window)||!text)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="ru-RU";u.rate=.96;u.pitch=1;window.speechSynthesis.speak(u)}
async function sendMessage(){const input=$("msg"),t=input.value.trim();if(!t)return;state.messages.push({speaker:"manager",content:t});input.value="";await saveSession();trainingChat();try{const r=await aiClientReply(t);state.messages.push({speaker:"client",content:r});await saveSession();trainingChat();speakClient(r)}catch(e){console.error("chat-client:",e);trainingChat();toast("AI-клиент временно недоступен: "+(e.message||"ошибка"))}}
async function finishTraining(){if(!state.session)return;const sessionId=state.session.id;await saveSession();try{const {data,error}=await sb.auth.getSession();if(error||!data?.session?.access_token){toast("Сессия авторизации истекла. Войдите снова.");return}const r=await fetch(SUPABASE_URL+"/functions/v1/evaluate-session",{method:"POST",headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Authorization":"Bearer "+data.session.access_token},body:JSON.stringify({session_id:sessionId}),cache:"no-store"});const raw=await r.text();let j=null;try{j=raw?JSON.parse(raw):null}catch(_){}if(!r.ok)toast("Тренировка сохранена. AI: "+(j?.error||j?.message||raw||( "HTTP "+r.status)));else if(j?.configured===false)toast("Тренировка сохранена. AI-ключ не настроен.");else toast("AI-анализ завершён")}catch(e){console.error(e);toast("Тренировка сохранена. AI: "+(e.message||"ошибка"))}finally{state.session=null;await loadAll();state.view="progress";render()}}
function voiceInput(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast("Голосовой ввод не поддерживается этим браузером");return}const r=new SR();r.lang="ru-RU";r.interimResults=false;r.onresult=e=>{const msg=$("msg");if(msg)msg.value=e.results[0][0].transcript};r.onerror=()=>{toast("Не удалось распознать речь")};r.start()}
async function logout(){await sb.auth.signOut();state={user:null,profile:null,company:null,view:"home",scenarios:[],session:null,messages:[],stats:null,team:[],history:[]};authScreen()}
function startVoiceListening(){if(!state.session||coldCall.processing)return;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast("В этом браузере нет распознавания речи. Используй Chrome/Яндекс Браузер.");return}if(coldCall.recognition){try{coldCall.recognition.abort()}catch{}}const r=new SR();r.lang="ru-RU";r.continuous=false;r.interimResults=true;r.maxAlternatives=1;coldCall.recognition=r;let finalText="";coldCall.listening=true;setCallStatus("Вы говорите…",true);clearTimeout(coldCall.silenceTimer);r.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const text=e.results[i][0]?.transcript||"";if(e.results[i].isFinal)finalText+=text+" ";else interim+=text}const live=$("callLive");if(live)live.textContent=(finalText+interim).trim()||"Слушаю…"};r.onerror=e=>{coldCall.listening=false;if(e.error!=="aborted")setCallStatus("Микрофон готов",false)};r.onend=async()=>{coldCall.listening=false;setCallStatus("Клиент слушает…",false);finalText=finalText.trim();if(finalText){clearTimeout(coldCall.silenceTimer);await sendVoiceTurn(finalText);return}coldCall.silenceTimer=setTimeout(()=>{if(state.session&&!coldCall.listening&&!coldCall.processing&&!coldCall.silenceNudged){coldCall.silenceNudged=true;const n="Вы на связи? Я вас не слышу.";state.messages.push({speaker:"client",content:n});saveSession();trainingCallPage();speakCallClient(n);setTimeout(()=>coldCall.silenceNudged=false,5000)}},3000)};try{r.start()}catch(e){console.error(e)}}
function toggleVoice(){if(coldCall.listening){try{coldCall.recognition?.stop()}catch{}return}startVoiceListening()}
async function sendVoiceTurn(text){if(coldCall.processing||!state.session)return;coldCall.processing=true;state.messages.push({speaker:"manager",content:text});await saveSession();trainingCallPage();try{const r=await aiClientReply(text);state.messages.push({speaker:"client",content:r});await saveSession();trainingCallPage();speakCallClient(r)}catch(e){console.error(e);toast("AI-клиент временно недоступен: "+(e.message||"ошибка"))}finally{coldCall.processing=false}}
function setCallStatus(text,pulse){const el=$("callStatus");if(el){el.textContent=text;el.classList.toggle("call-pulse",!!pulse)}}
</script>

function toggleInviteBox(){const box=$("inviteBox");if(!box){toast("Не найден блок приглашения");return}box.classList.toggle("hidden");if(!box.classList.contains("hidden"))setTimeout(()=>$("inviteEmail")?.focus(),50)}async function createCompanyInvitation(){if(!state.user||!state.profile){toast("Профиль ещё загружается. Обновите страницу через секунду.");return}if(!state.profile.company_id||!["director","admin","manager"].includes(state.profile.role)){toast("Нет прав для приглашения сотрудников");return}const email=$("inviteEmail")?.value.trim().toLowerCase(),role=$("inviteRole")?.value||"employee";if(!email){toast("Укажи email сотрудника");return}const token=crypto.randomUUID().replace(/-/g,"");const {error}=await sb.from("company_invitations").insert({company_id:state.profile.company_id,email,role,token,invited_by:state.user.id,expires_at:new Date(Date.now()+7*86400000).toISOString()});if(error){toast(error.message);return}const link=location.origin+location.pathname+"?invite="+encodeURIComponent(token);const out=$("inviteResult");if(out)out.innerHTML=`<div class="card" style="margin-top:14px;background:#faf9ff"><b>Приглашение создано</b><div class="muted" style="margin:6px 0">Срок действия: 7 дней</div><input id="inviteLink" value="${esc(link)}" readonly style="width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff"><div style="display:flex;gap:8px;margin-top:8px"><button class="primary" onclick="navigator.clipboard.writeText($(\"inviteLink\").value);toast(\"Ссылка скопирована\")">Копировать ссылку</button><button class="secondary" onclick="toast(\"Код: ${esc(token)}\")">Показать код</button></div></div>`}

turn `<div class="top"><div><h2>Аналитика</h2><div class="muted">Данные появятся после тренировок команды</div></div></div><div class="empty">Пока нет завершённых тренировок.</div>`;let avg=Math.round(state.team.reduce((a,x)=>a+(x.avg_score||0),0)/state.team.length);return `<div class="top"><div><h2>Аналитика руководителя</h2><div class="muted">Командная эффективность</div></div><span class="pill">Средний балл ${avg}</span></div><div class="grid"><div class="card"><div class="metric-label">Средний команды</div><div class="metric">${avg}</div></div><div class="card"><div class="metric-label">Лучший менеджер</div><div class="metric" style="font-size:20px">${esc(state.team[0].employee_name)}</div></div><div class="card"><div class="metric-label">Тренировок</div><div class="metric">${state.team.reduce((a,x)=>a+x.sessions_count,0)}</div></div><div class="card"><div class="metric-label">Слабое место</div><div class="metric" style="font-size:20px">${weakest()}</div></div></div><div class="section card"><h3>Навыки команды</h3>${skillBar("Выявление потребности",avgSkill("discovery_score"))}${skillBar("Работа с возражениями",avgSkill("objection_score"))}${skillBar("Ценность",avgSkill("value_score"))}${skillBar("Закрытие",avgSkill("closing_score"))}</div>`}function aiCoach(){return `<div class="top"><div><h2>AI-наставник</h2><div class="muted">Персональный разбор и план развития</div></div></div><div class="card"><h3>Что анализирует SaleTrening</h3><ul class="muted"><li>выявление потребностей</li><li>работу с возражениями</li><li>ценность и аргументацию</li><li>закрытие и следующий шаг</li><li>коммуникацию и структуру диалога</li></ul><p class="muted">AI-наставник работает на данных ваших тренировок и AI-разборов.</p></div>`}
function coldCallScenario(difficulty="Средний"){const d=String(difficulty).toLowerCase().includes("слож")?"слож":"сред";return state.scenarios.find(x=>String(x.title).toLowerCase().includes("холодный звонок")&&String(x.difficulty||"").toLowerCase().includes(d))||state.scenarios.find(x=>String(x.title).toLowerCase().includes("холодный звонок"))||{id:0,title:"Холодный звонок",description:"Выход на ЛПР и начало холодного разговора",difficulty:difficulty,client_role:"Потенциальный клиент",client_mood:difficulty==="Сложный"?"Занят, скептически настроен":"Сдержанный",objective:"Заинтересовать клиента и договориться о следующем шаге"}}function coldCallHome(){return `<div class="top"><div><h2>Холодный звонок</h2><div class="muted">Голосовая тренировка в режиме телефонного разговора</div></div></div><div class="card" style="max-width:900px;margin:auto"><h3>Настройка клиента</h3><div class="field" style="margin-top:14px"><label>Характер клиента</label><select id="coldCharacter"><option value="Лояльный">Лояльный</option><option value="Скептик">Скептик</option><option value="Грубит">Грубит</option><option value="Занятой">Занятой</option><option value="Аналитик">Аналитик</option></select></div><div class="field" style="margin-top:14px"><label>Голос клиента</label><select id="coldVoice"><option value="filipp">Филипп — мужской</option><option value="ermil">Ермил — мужской</option><option value="zahar">Захар — мужской</option><option value="alexander">Александр — мужской</option><option value="kirill">Кирилл — мужской</option><option value="anton">Антон — мужской</option></select></div><div class="field" style="margin-top:14px"><label>Факты о клиенте <span class="muted">(необязательно)</span></label><textarea id="coldFacts" rows="4" placeholder="Например: сейчас покупает у конкурента, нужен объём 100 шин, важна гарантия..."></textarea></div><h3 style="margin-top:22px">Выберите уровень сложности</h3><div class="grid" style="margin-top:18px"><div class="card"><h3>Средний</h3><p class="muted">Клиент более лоялен, идёт на контакт, слушает и задаёт вопросы.</p><button class="primary" onclick="startColdCall('Средний')">☎ Начать</button></div><div class="card"><h3>Сложный</h3><p class="muted">Клиент менее охотно идёт на контакт и требует сильной аргументации.</p><button class="primary" onclick="startColdCall('Сложный')">☎ Начать</button></div></div><p class="muted" style="margin-top:18px">Вы говорите первым. Лимит звонка — 10 минут.</p></div>`}let coldCall={recognition:null,listening:false,silenceTimer:null,silenceNudged:false,startedAt:0,processing:false,difficulty:"Средний",timer:null,character:"Лояльный",facts:"",voice:"filipp"};async function startColdCall(difficulty="Средний"){const s=coldCallScenario(difficulty);if(!s.id){toast("Сценарий «Холодный звонок» не найден в базе");return}coldCall.character=$("coldCharacter")?.value||"Лояльный";coldCall.facts=$("coldFacts")?.value.trim()||"";coldCall.voice=$("coldVoice")?.value||"filipp";const payload={employee_id:state.user.id,company_id:state.profile.company_id,scenario_id:s.id,status:"started",transcript:[],voice_mode:true};const {data,error}=await sb.from("saletrening_sessions").insert(payload).select().single();if(error){toast(error.message);return}state.session={...data,scenario:s};state.messages=[];coldCall.startedAt=Date.now();coldCall.difficulty=difficulty;coldCall.silenceNudged=false;coldCall.processing=false;state.view="coldcall";trainingCallPage();setTimeout(startVoiceListening,350)}function trainingCallPage(){const p=$("page");if(!p||!state.session)return;if(coldCall.timer)clearInterval(coldCall.timer);p.innerHTML=`<div class="top"><div><h2>Холодный звонок</h2><div class="muted">Соединение установлено · ${esc(coldCall.difficulty)}</div></div><button class="secondary" onclick="finishTraining()">Завершить и оценить</button></div><div class="call-shell"><div class="call-head"><div class="call-status" id="callStatus">Ваш ход — начинайте разговор</div><div class="call-avatar" id="callAvatar">☎</div><div class="call-name">${esc(state.session.scenario.client_role||"Клиент")}</div><div class="call-sub">Холодный звонок · ${esc(coldCall.difficulty)}</div><div class="call-timer" id="callTimer">00:00</div></div><div class="call-body"><div class="call-live"><div class="call-live-label">Последняя реплика</div><div class="call-live-text" id="callLive">Начните разговор — клиент слушает.</div></div><div class="call-controls"><button id="callMic" class="call-btn primary-call" onclick="toggleVoice()">🎙 Говорить</button><button class="call-btn end-call" onclick="finishTraining()">Завершить звонок</button></div><div class="call-hint" id="callHint">Вы говорите первым. После вашей реплики клиент ответит.</div><div class="call-transcript" id="callTranscript">${state.messages.map(m=>`<div class="msg ${m.speaker}"><b>${m.speaker==="client"?"Клиент":"Вы"}:</b> ${esc(m.content)}</div>`).join("")}</div></div></div>`;coldCall.timer=setInterval(async()=>{const el=$("callTimer");if(!el||!state.session){clearInterval(coldCall.timer);coldCall.timer=null;return}const sec=Math.floor((Date.now()-coldCall.startedAt)/1000);el.textContent=`${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;if(sec>=600&&!coldCall.processing){clearInterval(coldCall.timer);coldCall.timer=null;coldCall.processing=true;const n="У меня нет времени, мне не интересно, до свидания.";state.messages.push({speaker:"client",content:n});await saveSession();const live=$("callLive");if(live)live.textContent=n;setCallStatus("Звонок завершён",false);speakCallClient(n);setTimeout(()=>finishTraining(),2200)}},1000)}async function speakCallClient(text){if(!text)return;try{const {data,error}=await sb.functions.invoke('yandex-tts',{body:{text,voice:(coldCall.voice||document.getElementById('coldVoice')?.value||'marina'),role:'friendly',speed:0.96,pitch_shift:0}});if(error)throw error;if(!data?.audio_base64)throw new Error(data?.error||'Yandex TTS returned no audio');const bin=atob(data.audio_base64),bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);const audio=new Audio(URL.createObjectURL(new Blob([bytes],{type:data?.mime||'audio/wav'})));audio.onended=()=>{URL.revokeObjectURL(audio.src);if(state.session&&!coldCall.processing)setTimeout(startVoiceListening,250)};await audio.play()}catch(e){console.error('Yandex SpeechKit TTS playback:',e);if('speechSynthesis'in window){window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ru-RU';u.rate=.96;u.pitch=1;u.onend=()=>{if(state.session&&!coldCall.processing)setTimeout(startVoiceListening,250)};window.speechSynthesis.speak(u)}}}
window.historyPage=async function(){let q;if(["manager","director","admin"].includes(state.profile?.role)&&state.profile?.company_id)q=await sb.from("saletrening_sessions").select("id,employee_id,scenario_id,status,total_score,ai_summary,created_at,completed_at").eq("company_id",state.profile.company_id).order("created_at",{ascending:false}).limit(100);else q=await sb.from("saletrening_sessions").select("id,employee_id,scenario_id,status,total_score,ai_summary,created_at,completed_at").eq("employee_id",state.user.id).order("created_at",{ascending:false}).limit(100);const rows=q.data||[],names={};state.scenarios.forEach(z=>names[z.id]=z.title);state.history=rows;return `<div class="top"><div><h2>История тренировок</h2><div class="muted">Нажмите на тренировку, чтобы открыть полный отчёт</div></div></div><div class="card" style="padding:0;overflow:hidden">${rows.length?`<table class="table"><thead><tr><th>Дата</th><th>Менеджер</th><th>Сценарий</th><th>Статус</th><th>Балл</th><th>Краткий анализ ИИ</th></tr></thead><tbody>${rows.map(x=>`<tr onclick="showTrainingReport('${x.id}')" style="cursor:pointer"><td>${new Date(x.created_at).toLocaleString("ru-RU")}</td><td>${x.employee_id===state.user.id?esc(state.profile.first_name||state.user.email):"Менеджер"}</td><td>${esc(names[x.scenario_id]||"Тренировка")}</td><td>${x.status==='completed'?'Завершена':'В процессе'}</td><td><b>${x.total_score??'—'}</b></td><td style="max-width:430px;white-space:normal;line-height:1.4">${esc(x.ai_summary||"Откройте отчёт для полного анализа")}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">История пока пуста.</div>'}</div>`};
const oldPage=window.page;window.page=function(){if(state.report){setPageHTML($("page"),reportPage());return}return oldPage.apply(this,arguments)};window.authScreen=authScreen;window.boot=boot;sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_IN'&&session){setTimeout(()=>window.boot(session.user),0)}});(async()=>{const {data}=await sb.auth.getSession();if(data.session)await window.boot(data.session.user);else window.authScreen()})();
</script>
<script src="/auth-invite.js"></script><script>/* AI_CLIENT_SETTINGS_V3 */
(()=>{const O=['Дорого','Работаем с другими / есть поставщик','Нет времени','Не хочу менять поставщика','Нет бюджета, нет денег, нет финансирования','Жили же как-то без вас','Я подумаю','Ещё не смотрел','Не интересно','Не звоните сюда больше','Всё есть','Слышал негативные отзывы','Сам знаю где купить / сам всё знаю и тп','Сейчас не сезон','Решает директор. Решает Москва. Решает центральный офис','Был негативный опыт с вами','Сейчас сезон','Ничего не нужно','Пока всё заморозили','Я сам вам перезвоню','Хорошие отношения с текущим поставщиком','Есть поставщик рядом','Был негативный опыт с аналогичным продуктом','Отправляйте всё на почту','Я вас не знаю. Мы о вас не слышали','Пока нет заказов, нет покупателей','Мы будем иметь вас в виду','У директора брат работает у нашего поставщика','Все у всех одинаково','Долго везти','Что я скажу нашему поставщику','Перед новым годом не будем менять поставщика'];const P={'Шины':'Ты опытный пользователь шин: знаешь типоразмеры, оси, нагрузку, давление, сезонность, условия эксплуатации, износ, пробег, бренды, цены и поставщиков. Задавай предметные вопросы и сравнивай предложения как реальный покупатель.','Автомобили':'Ты опытный пользователь автомобилей и понимаешь эксплуатацию, обслуживание, надежность и стоимость владения.','Оборудование':'Ты опытный пользователь профессионального оборудования и понимаешь производительность, надежность, обслуживание и цену.','Услуги':'Ты опытный клиент услуг и сравниваешь цену, качество, сроки и риски.','Недвижимость':'Ты опытный покупатель недвижимости и сравниваешь цену, состояние, документы, расположение и расходы.','Свой товар':'Ты опытный пользователь выбранного товара: задавай практические вопросы, сравнивай варианты и не принимай заявления менеджера без уточнений.'};const E=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function S(){return window.state?.editingScenario||window.state?.currentScenario||window.state?.scenarioDraft||window.state?.selectedScenario||null}function C(s){let m=String(s?.system_prompt||'').match(/AI_CLIENT_SETTINGS_V3_JSON:([A-Za-z0-9+/=]+)$/);if(m)try{return JSON.parse(decodeURIComponent(escape(atob(m[1]))))}catch{}return{random:false,randomCount:0,objections:Array.isArray(s?.objections)?s.objections:[],product:'',productCustom:'',productKnowledge:''}}function B(x){return btoa(unescape(encodeURIComponent(JSON.stringify(x))))}function draw(){if(!document.body.innerText.includes('Сохранить сценарий')||document.getElementById('ai-client-settings-v3'))return;let s=S();if(!s?.id||!window.sb)return;let c=C(s),p=document.getElementById('page');if(!p)return;let d=document.createElement('div');d.id='ai-client-settings-v3';d.className='card';d.style.marginTop='16px';d.innerHTML=`<h3 style="margin:0 0 6px">Настройки AI-клиента</h3><div class="muted">Клиент учитывает выбранные возражения и знает выбранный товар/тему.</div><div class="field"><label>Товар / продукт</label><select id="aip"><option value="">Не выбран</option>${Object.keys(P).map(x=>`<option>${E(x)}</option>`).join('')}</select><input id="aipc" placeholder="Или свой товар / тема" style="margin-top:8px"></div><div class="field"><label>Знания AI-клиента о товаре</label><textarea id="aik" rows="4"></textarea></div><div class="field"><label><input id="air" type="checkbox" style="width:auto"> 🎲 Случайные возражения</label><input id="ain" type="number" min="0" max="10" value="0" placeholder="Количество" style="margin-top:8px"></div><div class="field"><label>Возражения клиента</label><div id="aio"></div><button id="aiall" class="secondary" type="button">Все возражения</button></div><button id="aisave" class="primary" type="button">Сохранить настройки AI-клиента</button>`;p.appendChild(d);let sel=d.querySelector('#aip'),custom=d.querySelector('#aipc'),know=d.querySelector('#aik'),rnd=d.querySelector('#air'),num=d.querySelector('#ain'),list=d.querySelector('#aio');sel.value=c.product||'';custom.value=c.productCustom||'';know.value=c.productKnowledge||P[c.product]||'';rnd.checked=!!c.random;num.value=c.randomCount||0;function render(){list.innerHTML=O.map((x,i)=>`<label style="display:block;padding:9px 11px;border:1px solid var(--line);border-radius:10px;margin:5px 0"><input type="checkbox" data-i="${i}" ${c.objections.includes(x)?'checked':''} style="width:auto"> ${i+1}. ${E(x)}</label>`).join('');list.querySelectorAll('input').forEach(z=>z.onchange=()=>{let x=O[+z.dataset.i];c.objections=c.objections||[];if(z.checked&&!c.objections.includes(x))c.objections.push(x);if(!z.checked)c.objections=c.objections.filter(v=>v!==x)})}render();sel.onchange=()=>{c.product=sel.value;know.value=P[c.product]||''};custom.oninput=()=>c.productCustom=custom.value;know.oninput=()=>c.productKnowledge=know.value;rnd.onchange=()=>c.random=rnd.checked;num.oninput=()=>c.randomCount=+num.value||0;d.querySelector('#aiall').onclick=()=>{let m=document.createElement('div');m.style='position:fixed;inset:5%;z-index:9999;background:var(--dark);color:#fff;padding:20px;border-radius:18px;overflow:auto';m.innerHTML='<h2>Все возражения <button id="x" class="secondary">✕</button></h2>'+O.map((x,i)=>`<div style="padding:10px;border:1px solid #444;border-radius:10px;margin:5px 0">${i+1}. ${E(x)} <button data-i="${i}" class="primary">Добавить</button></div>`).join('');document.body.appendChild(m);m.querySelector('#x').onclick=()=>m.remove();m.querySelectorAll('[data-i]').forEach(z=>z.onclick=()=>{let x=O[+z.dataset.i];if(!c.objections.includes(x))c.objections.push(x);render();z.textContent='Выбрано'})};d.querySelector('#aisave').onclick=async()=>{let prompt=String(s.system_prompt||'').replace(/\n?AI_CLIENT_SETTINGS_V3_JSON:[A-Za-z0-9+/=]+$/,'')+'\nAI_CLIENT_SETTINGS_V3_JSON:'+B(c);let r=await sb.from('saletrening_scenarios').update({objections:c.objections,system_prompt:prompt}).eq('id',s.id);if(r.error)toast('Ошибка сохранения: '+r.error.message);else{state.clientSettings=c;state.clientObjections=c.objections;toast('Настройки AI-клиента сохранены')}}}new MutationObserver(draw).observe(document.body,{childList:true,subtree:true});setTimeout(draw,500)})()</script><script src="/canva-ui.js"></script>
