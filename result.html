<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SaleTrening — Результат тренировки</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#6d4aff;--p2:#8b70ff;--bg:#f6f7fb;--card:#fff;--text:#171827;--muted:#7b7e91;--line:#e8e9f0;--dark:#171625;--dark2:#232039;--good:#19a873;--warn:#f29b38;--bad:#ef5b68;--shadow:0 12px 35px rgba(25,20,55,.07)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,Arial,sans-serif;background:var(--bg);color:var(--text)}button{font:inherit;cursor:pointer}.muted{color:var(--muted);font-size:13px}.shell{min-height:100vh;display:grid;grid-template-columns:250px minmax(0,1fr)}
.side{background:var(--dark);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.logo{display:flex;align-items:center;gap:11px;font-weight:850;font-size:20px;padding:4px 10px 25px}.logo-b{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,var(--p),#a08aff);display:grid;place-items:center;font-size:22px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#aaa7b8;text-align:left;padding:12px 14px;border-radius:11px}.nav button:hover,.nav button.active{background:var(--dark2);color:#fff}.side-bottom{margin-top:auto}.side-bottom button{width:100%}
.content{padding:30px 34px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:20px}.top h1{margin:0;font-size:30px;letter-spacing:-.6px}.top-actions{display:flex;gap:9px}.secondary,.primary{border-radius:12px;padding:11px 16px;font-weight:750}.secondary{border:1px solid var(--line);background:#fff;color:var(--text)}.primary{border:0;background:var(--p);color:#fff;box-shadow:0 8px 18px rgba(109,74,255,.18)}
.hero{display:grid;grid-template-columns:minmax(0,1.35fr) 330px;gap:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:21px;box-shadow:var(--shadow)}.hero-main{background:linear-gradient(135deg,#fff,#f8f5ff);position:relative;overflow:hidden}.hero-main:after{content:"";position:absolute;width:250px;height:250px;border-radius:50%;right:-100px;top:-110px;background:#6d4aff12}.eyebrow{font-size:12px;font-weight:800;color:var(--p);text-transform:uppercase;letter-spacing:.08em}.hero-title{font-size:25px;font-weight:850;margin:8px 0}.hero-summary{font-size:15px;line-height:1.6;max-width:800px;color:#4e5061}.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.tag{display:inline-flex;align-items:center;background:#f0edff;color:#5b40db;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:700}.score-card{display:flex;align-items:center;gap:18px}.score-ring{width:125px;height:125px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--ring-color) var(--v),#ececf3 0);position:relative;flex:none}.score-ring:after{content:"";position:absolute;inset:11px;background:#fff;border-radius:50%}.score-ring>div{position:relative;z-index:1;text-align:center}.score-ring strong{display:block;font-size:29px;line-height:1}.score-ring span{font-size:11px;color:var(--muted)}.score-label{font-weight:800;font-size:18px}.score-caption{font-size:13px;color:var(--muted);margin-top:5px}
.section{margin-top:18px}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.section h2{font-size:19px;margin:0}.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.skill{padding:17px}.skill-head{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:750}.skill-score{font-weight:850}.bar{height:8px;background:#eeeef3;border-radius:99px;margin-top:11px;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--p),var(--p2))}.bar i.low{background:linear-gradient(90deg,#f08a91,#ef5b68)}.bar i.mid{background:linear-gradient(90deg,#f3b35e,#f29b38)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.list{display:grid;gap:10px}.list-item{display:flex;gap:11px;align-items:flex-start;border:1px solid var(--line);border-radius:13px;padding:13px;background:#fff;line-height:1.45;font-size:13px}.dot{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;flex:none;background:#eeeaff;color:var(--p);font-weight:900}.dot.good{background:#e8f8f2;color:var(--good)}.dot.bad{background:#fff0f1;color:var(--bad)}.dot.warn{background:#fff6e9;color:var(--warn)}.transcript{max-height:430px;overflow:auto;display:grid;gap:9px}.msg{max-width:80%;padding:11px 13px;border-radius:14px;font-size:13px;line-height:1.5}.msg.client{background:#f5f5fa;border:1px solid var(--line)}.msg.manager{background:#eeeaff;margin-left:auto}.msg-role{font-size:10px;font-weight:850;color:var(--muted);margin-bottom:4px;text-transform:uppercase}.empty{padding:35px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:16px}.loading{min-height:70vh;display:grid;place-items:center;font-weight:700;color:var(--muted)}.error{max-width:600px;margin:80px auto}
@media(max-width:1000px){.hero{grid-template-columns:1fr}.skills{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.shell{grid-template-columns:1fr}.side{height:auto;position:relative;padding:12px}.logo{padding:4px 8px 12px}.nav{grid-template-columns:repeat(2,1fr)}.side-bottom{margin-top:12px}.content{padding:18px 14px}.top{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions button{flex:1}.skills,.cols{grid-template-columns:1fr}.score-card{justify-content:center}.hero-main{text-align:center}.meta{justify-content:center}.msg{max-width:92%}}
@media print{.side,.top-actions{display:none!important}.content{padding:0}.card{box-shadow:none}}
</style>
</head>
<body><div id="app"><div class="loading">Загружаем результат тренировки…</div></div>
<script>
const SUPABASE_URL="https://svxykakyrloqzloerygb.supabase.co";
const SUPABASE_KEY="sb_publishable_r7wu9xAgaiIZBTg4tBiJvQ_CVKHaUoi";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY),$=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const arr=v=>Array.isArray(v)?v:[];
function skillValue(v){if(v===null||v===undefined||v==='')return null;const n=Number(v);return Number.isFinite(n)?Math.max(1,Math.min(20,Math.round(n))):null}
function overall(v){const n=Number(v);return Number.isFinite(n)?Math.max(0,Math.min(100,Math.round(n))):0}
function scoreColor(v){return v>=80?'var(--good)':v>=60?'var(--warn)':'var(--bad)'}
function skill(name,v){v=skillValue(v);if(v===null)return '';const pct=v*5,cls=v<8?'low':v<13?'mid':'';return `<div class="card skill"><div class="skill-head"><span>${esc(name)}</span><span class="skill-score">${v}/20</span></div><div class="bar"><i class="${cls}" style="width:${pct}%"></i></div></div>`}
function list(items,type,empty){if(!items.length)return `<div class="empty">${empty}</div>`;return `<div class="list">${items.map((x,i)=>`<div class="list-item"><div class="dot ${type}">${i+1}</div><div>${esc(x)}</div></div>`).join('')}</div>`}
function formatDate(v){if(!v)return '—';return new Date(v).toLocaleString('ru-RU',{day:'2-digit',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function formatDuration(v){v=Number(v)||0;if(!v)return '—';const m=Math.floor(v/60),s=v%60;return m?`${m} мин ${s} сек`:`${s} сек`}
function renderError(title,text){$('app').innerHTML=`<div class="error"><div style="font-size:52px">🤖</div><h1>${esc(title)}</h1><p class="muted">${esc(text)}</p><button class="primary" onclick="location.href='/'">Вернуться в SaleTrening</button></div>`}
async function load(){try{
 const {data:{session},error:authError}=await sb.auth.getSession();if(authError)throw authError;if(!session){renderError('Сессия не найдена','Откройте SaleTrening и войдите в аккаунт.');return}
 const requested=new URLSearchParams(location.search).get('session_id');
 let q=sb.from('saletrening_sessions').select('id,employee_id,company_id,scenario_id,status,total_score,feedback,created_at,completed_at,started_at,duration_seconds,ai_summary,ai_evaluation,voice_mode,transcript').eq('employee_id',session.user.id);
 if(requested)q=q.eq('id',requested);else q=q.order('created_at',{ascending:false}).limit(1);
 const {data,error}=requested?await q.single():await q;if(error||!data){renderError('Результат не найден','Тренировка ещё не завершена или у вас нет доступа к этому результату.');return}
 const s=Array.isArray(data)?data[0]:data;let scenario=null;
 if(s.scenario_id){const r=await sb.from('saletrening_scenarios').select('id,title,difficulty,industry').eq('id',s.scenario_id).maybeSingle();scenario=r.data||null}
 const sr=await sb.from('session_scores').select('overall_score,discovery_score,objection_score,value_score,closing_score,communication_score,next_step_score,summary,strengths,weaknesses,recommendations,success,outcome,model').eq('session_id',s.id).maybeSingle();
 render(s,scenario,sr.data||null);
 }catch(e){console.error(e);renderError('Не удалось загрузить результат','Попробуйте обновить страницу.')}}
function render(s,scenario,scoreRow){
 const e=s.ai_evaluation&&typeof s.ai_evaluation==='object'?s.ai_evaluation:{};const src=scoreRow||e;
 const vals={discovery:skillValue(src.discovery_score),objection:skillValue(src.objection_score),value:skillValue(src.value_score),closing:skillValue(src.closing_score),communication:skillValue(src.communication_score)};
 const all=[vals.discovery,vals.objection,vals.value,vals.closing,vals.communication];let ov=overall(src.overall_score??s.total_score);if(all.every(v=>v!==null))ov=all.reduce((a,b)=>a+b,0);
 const strengths=arr(src.strengths??e.strengths),weaknesses=arr(src.weaknesses??e.weaknesses),recommendations=arr(src.recommendations??e.recommendations),transcript=arr(s.transcript);
 $('app').innerHTML=`<div class="shell"><aside class="side"><div class="logo"><div class="logo-b">S</div><span>SaleTrening</span></div><div class="nav"><button onclick="location.href='/'">⌂&nbsp;&nbsp;Главная</button><button class="active">◉&nbsp;&nbsp;Результат</button><button onclick="location.href='/'">▣&nbsp;&nbsp;Тренировки</button><button onclick="location.href='/'">◷&nbsp;&nbsp;История</button><button onclick="location.href='/'">⚙&nbsp;&nbsp;Настройки</button></div><div class="side-bottom"><div class="muted" style="margin:0 10px 10px;color:#aaa7b8">AI-тренер по продажам</div><button class="secondary" onclick="location.href='/'">← Вернуться в приложение</button></div></aside>
<main class="content"><div class="top"><div><h1>Результат тренировки</h1><div class="muted">${formatDate(s.completed_at||s.created_at)}</div></div><div class="top-actions"><button class="secondary" onclick="window.print()">Печать / PDF</button><button class="primary" onclick="location.href='/'">Новая тренировка</button></div></div>
<div class="hero"><section class="card hero-main"><div class="eyebrow">AI-анализ завершён</div><div class="hero-title">${esc(scenario?.title||'Тренировка по продажам')}</div><div class="hero-summary">${esc(src.summary||e.summary||s.ai_summary||s.feedback||'AI подготовил анализ вашей тренировки.')}</div><div class="meta"><span class="tag">${esc(scoreRow?.model||'GigaChat-2-Pro')}</span>${scenario?.difficulty?`<span class="tag">${esc(scenario.difficulty)}</span>`:''}${scenario?.industry?`<span class="tag">${esc(scenario.industry)}</span>`:''}<span class="tag">${formatDuration(s.duration_seconds)}</span>${s.voice_mode?'<span class="tag">🎙 Голосовой режим</span>':''}</div></section>
<section class="card score-card"><div class="score-ring" style="--v:${ov}%;--ring-color:${scoreColor(ov)}"><div><strong>${ov}</strong><span>из 100</span></div></div><div><div class="score-label">${ov>=80?'Отличный результат':ov>=60?'Хороший результат':ov>=40?'Есть над чем работать':'Нужна дополнительная практика'}</div><div class="score-caption">Общая оценка AI-тренера</div></div></section></div>
<section class="section"><div class="section-head"><h2>Навыки продаж</h2><span class="muted">Каждый навык — от 1 до 20</span></div><div class="skills">${skill('Выявление потребности',vals.discovery)}${skill('Работа с возражениями',vals.objection)}${skill('Презентация ценности',vals.value)}${skill('Закрытие',vals.closing)}${skill('Коммуникация',vals.communication)}</div></section>
<section class="section cols"><div class="card"><div class="section-head"><h2>Сильные стороны</h2><span>✓</span></div>${list(strengths,'good','AI не выделил сильных сторон — это точка для роста.')}</div><div class="card"><div class="section-head"><h2>Что улучшить</h2><span>!</span></div>${list(weaknesses,'bad','Критичных слабых сторон не найдено.')}</div></section>
<section class="section card"><div class="section-head"><h2>Рекомендации AI-тренера</h2><span class="tag">Практика</span></div>${list(recommendations,'warn','Рекомендации отсутствуют.')}</section>
<section class="section card"><div class="section-head"><h2>Диалог тренировки</h2><span class="muted">${transcript.length} сообщений</span></div>${transcript.length?`<div class="transcript">${transcript.map(m=>{const role=String(m.role||m.sender||'client').toLowerCase(),manager=['manager','employee','sales','assistant'].includes(role),text=m.content??m.text??m.message??'';return `<div class="msg ${manager?'manager':'client'}"><div class="msg-role">${manager?'Менеджер':'Клиент'}</div>${esc(text)}</div>`}).join('')}</div>`:'<div class="empty">Диалог не сохранён.</div>'}</section>
<div class="section" style="display:flex;justify-content:center;gap:10px;padding-bottom:30px"><button class="secondary" onclick="location.href='/'">← Вернуться к истории</button><button class="primary" onclick="location.href='/'">Начать новую тренировку</button></div></main></div>`}
load();
</script></body></html>
