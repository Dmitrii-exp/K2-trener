<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SaleTrening — Кабинет руководителя</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#6d4aff;--bg:#f7f7fb;--card:#fff;--text:#171827;--muted:#7b7e91;--line:#e7e7ef;--dark:#171625;--good:#19a873;--warn:#f29b38;--bad:#ef5b68}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{background:var(--dark);color:#fff;padding:22px 14px;display:flex;flex-direction:column;min-height:100vh}.logo{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:850;padding:4px 10px 28px}.logo b{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#6d4aff,#9b86ff);display:grid;place-items:center}.nav button{width:100%;border:0;background:transparent;color:#aaa7b8;text-align:left;padding:12px 14px;border-radius:11px;font-weight:650;cursor:pointer}.nav button.active,.nav button:hover{background:#252039;color:#fff}.bottom{margin-top:auto}.main{padding:32px 36px;max-width:1450px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:30px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 5px 20px #19143708}.metric{font-size:32px;font-weight:850;margin-top:6px}.section{margin-top:22px}.section h2{font-size:19px;margin:0 0 12px}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;white-space:nowrap}.table th{color:var(--muted);font-weight:650}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eeeaff;color:#6045e0;font-weight:750}.bar{height:8px;background:#eeeef3;border-radius:99px;min-width:120px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#6d4aff,#9b86ff);border-radius:99px}.empty{padding:35px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.error{max-width:650px;margin:100px auto;text-align:center}.primary{border:0;border-radius:12px;padding:11px 16px;background:var(--p);color:#fff;font-weight:750;cursor:pointer}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.shell{grid-template-columns:1fr}.side{min-height:auto}.main{padding:20px 14px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head>
<body><div id="app"><div class="empty">Загружаем аналитику…</div></div>
<script>
const URL="https://svxykakyrloqzloerygb.supabase.co",KEY="sb_publishable_r7wu9xAgaiIZBTg4tBiJvQ_CVKHaUoi",sb=supabase.createClient(URL,KEY),$=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const n=v=>Number.isFinite(Number(v))?Number(v):0;
function avg(a){return a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0}
function renderError(t,x){$('app').innerHTML=`<div class="error"><h1>${esc(t)}</h1><p class="muted">${esc(x)}</p><button class="primary" onclick="location.href='/'">Вернуться в SaleTrening</button></div>`}
async function load(){try{
 const {data:{session},error:ae}=await sb.auth.getSession();if(ae)throw ae;if(!session){renderError('Нужна авторизация','Войдите в SaleTrening как руководитель.');return}
 const me=await sb.from('profiles').select('id,company_id,role,first_name,last_name').eq('id',session.user.id).single();if(me.error)throw me.error;
 if(!me.data.company_id||!['director','admin','manager'].includes(me.data.role)){renderError('Нет доступа','Кабинет руководителя доступен директору, администратору или менеджеру.');return}
 const company=me.data.company_id;
 const [pr,sr,sc]=await Promise.all([
  sb.from('profiles').select('id,first_name,last_name,role').eq('company_id',company),
  sb.from('saletrening_sessions').select('id,employee_id,status,created_at,completed_at,total_score,duration_seconds').eq('company_id',company).order('created_at',{ascending:false}).limit(1000),
  sb.from('session_scores').select('session_id,employee_id,overall_score,discovery_score,objection_score,value_score,closing_score,communication_score,success,outcome').eq('company_id',company).limit(1000)
 ]);
 if(pr.error)throw pr.error;if(sr.error)throw sr.error;if(sc.error)throw sc.error;
 render(me.data,pr.data||[],sr.data||[],sc.data||[]);
 }catch(e){console.error(e);renderError('Не удалось загрузить аналитику','Проверьте права доступа и попробуйте ещё раз.')}}
function render(me,profiles,sessions,scores){
 const byScore=new Map(scores.map(x=>[x.session_id,x]));const employees=profiles.filter(p=>p.role==='employee');const completed=sessions.filter(s=>s.status==='completed');const ovs=scores.map(s=>n(s.overall_score)).filter(x=>x>0);const success=scores.filter(s=>s.success===true).length;const recent=sessions.slice(0,10);
 const rows=employees.map(p=>{const ss=scores.filter(s=>s.employee_id===p.id),vals=ss.map(s=>n(s.overall_score)).filter(x=>x>0),last=sessions.find(s=>s.employee_id===p.id);return {name:[p.first_name,p.last_name].filter(Boolean).join(' ')||'Без имени',count:ss.length,avg:avg(vals),last:last?.created_at||null}}).sort((a,b)=>b.avg-a.avg);
 const skillNames=[['discovery_score','Выявление потребности'],['objection_score','Возражения'],['value_score','Ценность'],['closing_score','Закрытие'],['communication_score','Коммуникация']];
 const skills=skillNames.map(([k,label])=>({label,avg:avg(scores.map(s=>n(s[k])).filter(x=>x>0))}));
 $('app').innerHTML=`<div class="shell"><aside class="side"><div class="logo"><b>S</b><span>SaleTrening</span></div><div class="nav"><button onclick="location.href='/'">⌂&nbsp;&nbsp;Главная</button><button class="active">▣&nbsp;&nbsp;Аналитика</button><button onclick="location.href='/'">◷&nbsp;&nbsp;История</button></div><div class="bottom"><div class="muted" style="color:#aaa7b8;margin:0 10px 10px">${esc([me.first_name,me.last_name].filter(Boolean).join(' ')||'Руководитель')}</div><button onclick="location.href='/'" style="width:100%;border:0;border-radius:11px;padding:11px;background:#fff;color:#171827;font-weight:700;cursor:pointer">← В приложение</button></div></aside>
<main class="main"><div class="top"><div><h1>Кабинет руководителя</h1><div class="muted">Контроль обучения и прогресса сотрудников</div></div><span class="badge">${employees.length} сотрудников</span></div>
<div class="grid"><div class="card"><div class="muted">Завершено тренировок</div><div class="metric">${completed.length}</div></div><div class="card"><div class="muted">Средний балл</div><div class="metric">${avg(ovs)}/100</div></div><div class="card"><div class="muted">Успешные тренировки</div><div class="metric">${success}</div></div><div class="card"><div class="muted">Оценено AI</div><div class="metric">${scores.length}</div></div></div>
<section class="section"><div class="card"><h2>Рейтинг сотрудников</h2><div class="table-wrap"><table class="table"><thead><tr><th>Сотрудник</th><th>Тренировок</th><th>Средний балл</th><th>Уровень</th></tr></thead><tbody>${rows.length?rows.map((r,i)=>`<tr><td><b>${i+1}. ${esc(r.name)}</b></td><td>${r.count}</td><td>${r.avg}/100</td><td><div class="bar"><i style="width:${Math.min(100,r.avg)}%"></i></div></td></tr>`).join(''):'<tr><td colspan="4">Нет сотрудников с результатами</td></tr>'}</tbody></table></div></div></section>
<section class="section"><div class="card"><h2>Средний уровень навыков</h2><div class="table-wrap"><table class="table"><thead><tr><th>Навык</th><th>Средняя оценка</th><th></th></tr></thead><tbody>${skills.map(s=>`<tr><td>${esc(s.label)}</td><td>${s.avg}/20</td><td><div class="bar"><i style="width:${s.avg*5}%"></i></div></td></tr>`).join('')}</tbody></table></div></div></section>
<section class="section"><div class="card"><h2>Последние тренировки</h2><div class="table-wrap"><table class="table"><thead><tr><th>Дата</th><th>Сотрудник</th><th>Результат</th><th>Статус</th></tr></thead><tbody>${recent.length?recent.map(s=>{const p=profiles.find(x=>x.id===s.employee_id),sc=byScore.get(s.id);return `<tr><td>${new Date(s.created_at).toLocaleDateString('ru-RU')}</td><td>${esc([p?.first_name,p?.last_name].filter(Boolean).join(' ')||'—')}</td><td>${sc?.overall_score??s.total_score??'—'}/100</td><td><span class="badge">${esc(s.status||'—')}</span></td></tr>`}).join(''):'<tr><td colspan="4">Нет тренировок</td></tr>'}</tbody></table></div></div></section>
</main></div>`}
load();
</script></body></html>
